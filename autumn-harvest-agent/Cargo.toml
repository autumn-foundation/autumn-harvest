[package]
name = "autumn-harvest-agent"
description = "Durable agent loop for autumn-harvest: model and tool calls as activities, approvals as durable waits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn-harvest"
readme = "README.md"
keywords = ["workflow", "durable", "agent", "llm", "autumn"]
categories = ["asynchronous"]

[features]
default = []
# Register the agent loop on the embedded SQLite backend.
sqlite = ["dep:autumn-harvest-sqlite"]
# Replay-as-evaluation (issue #2001). Drives a recorded run in the in-memory
# test engine, so it needs the engine's `testing` surface.
eval = ["autumn-harvest/testing"]
# A tool that runs agent code in a sandbox. See `docs/sandbox-activities.md`.
sandbox = ["autumn-harvest/sandbox-activities", "dep:tokio-util"]

[dependencies]
# The backend-neutral core only: no Diesel, no Postgres, no autumn-web.
autumn-harvest = { version = "0.8.0", path = "../autumn-harvest", default-features = false }
autumn-harvest-sqlite = { version = "0.8.0", path = "../autumn-harvest-sqlite", optional = true }
# Workspace snapshots carry file bytes as base64 (issue #2274). The core
# crate already depends on this version.
base64 = "0.23"
# `join_all` runs the child runs of a fan-out at the same time (issue #2270).
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# The cancellation token of a sandbox run. The core crate already depends on
# this version.
tokio-util = { version = "0.7", optional = true }

[dev-dependencies]
# `testing` adds `ActivityContext::new_test_with_state` for the engine path.
autumn-harvest = { version = "0.8.0", path = "../autumn-harvest", default-features = false, features = ["testing"] }
chrono = { workspace = true }
autumn-harvest-sqlite = { version = "0.8.0", path = "../autumn-harvest-sqlite" }
proptest = { workspace = true }
tempfile = "3"
# The sandbox tool tests pass a cancellation token.
tokio-util = "0.7"
# Measures gzip against delta encoding (issue #2009). Already in the lockfile.
flate2 = "1"
tokio = { workspace = true }

[[test]]
name = "sqlite_loop"
required-features = ["sqlite"]

[[test]]
name = "crash_resume"
required-features = ["sqlite"]

[[test]]
name = "always_on"
required-features = ["sqlite"]

[[test]]
name = "response_cache"
required-features = ["sqlite"]

[[test]]
name = "sqlite_ledger"
required-features = ["sqlite"]

[[test]]
name = "eval"
required-features = ["eval", "sqlite"]

[[test]]
name = "mesh"
required-features = ["sqlite"]

[[test]]
name = "durable_agent"
required-features = ["sqlite"]

[[test]]
name = "agent_interrupts"
required-features = ["sqlite"]

[[test]]
name = "agent_wakes"
required-features = ["sqlite"]

[[test]]
name = "durable_peers"
required-features = ["sqlite"]

[[test]]
name = "model_per_agent"
required-features = ["sqlite"]

[[test]]
name = "fan_out"
required-features = ["sqlite"]

[[test]]
name = "transcript_delta"
required-features = ["sqlite", "eval"]

[[test]]
name = "memory_state"
required-features = ["sqlite"]

[[test]]
name = "mesh_controls"
required-features = ["sqlite"]

[[test]]
name = "live_tokens"
required-features = ["sqlite"]

[[test]]
name = "agent_lifecycle"
required-features = ["sqlite"]

[[test]]
name = "agent_workspace"
required-features = ["sqlite"]

[[test]]
name = "refine_propose"
required-features = ["sqlite"]

[lints]
workspace = true

[[example]]
name = "sqlite_agent"
required-features = ["sqlite"]

# A session as a durable agent (issues #1975, #2263). `test = true` runs its
# embedded tests in the crate's own `cargo test` step.
[[example]]
name = "agent_session_entity"
required-features = ["sqlite"]
test = true

# Deterministic instruction-count harness for `AgentHarness::model_turn`, the
# activity side of one model turn (issues #1973, #2264). Drive it under
# valgrind. See `benches/agent_model_turn_profile.rs`.
[[bench]]
name = "agent_model_turn_profile"
harness = false

# Deterministic instruction-count harness for the replay of a recorded
# `agent_loop` run, the workflow side of the loop (issue #1973). See
# `benches/agent_loop_replay_profile.rs`.
[[bench]]
name = "agent_loop_replay_profile"
harness = false

# Deterministic instruction-count harness for the replay of a durable `agent`
# run, one entity op at a time (issue #2263). See
# `benches/durable_agent_replay_profile.rs`.
[[bench]]
name = "durable_agent_replay_profile"
harness = false
