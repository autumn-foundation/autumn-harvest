[package]
name = "autumn-harvest-redis"
description = "Redis Streams task queue adapter for autumn-harvest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/madmax983/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "redis", "streams", "queue", "autumn"]
categories = ["asynchronous", "database"]

[features]
default = []
# Enables the testcontainers-backed integration test scaffolding for downstream
# users that want to spin up an in-process Redis for their own tests.
test-utils = ["dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
autumn-harvest = { version = "0.3.0", path = "../autumn-harvest", default-features = false }
async-trait = "0.1"
chrono = { workspace = true }
futures = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }

[lints]
workspace = true
