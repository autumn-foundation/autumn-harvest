[package]
name = "autumn-harvest-redis"
description = "Redis Streams dispatch channel and standalone task queue for autumn-harvest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "redis", "streams", "queue", "autumn"]
categories = ["asynchronous", "database"]

[features]
default = []
# Enables the testcontainers-backed integration test scaffolding for downstream
# users that want to spin up an in-process Redis for their own tests.
test-utils = ["dep:testcontainers", "dep:testcontainers-modules"]

[dependencies]
autumn-harvest = { version = "0.7.0", path = "../autumn-harvest", default-features = false }
async-trait = "0.1"
chrono = { workspace = true }
futures = { workspace = true }
redis = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = { workspace = true }
uuid = { workspace = true }
# TLS support (issue #1834). The `redis` client builds its rustls config
# with `ClientConfig::builder()`, which needs a process crypto provider. This
# crate installs `ring` when none is set. `rustls::pki_types` also checks
# caller-supplied PEM before any network I/O.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
testcontainers = { workspace = true, optional = true }
testcontainers-modules = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
# The worker end-to-end suite (tests/worker_dispatch_e2e.rs) drives a real
# `autumn_harvest::worker::Worker` against Postgres and Redis, so it needs the
# engine's database, test-helper and chaos features. Dev-only: the library
# build still depends on `autumn-harvest` with default features off.
autumn-harvest = { version = "0.7.0", path = "../autumn-harvest", features = ["db", "testing", "chaos"] }
diesel = { workspace = true }
# Mints a throwaway CA and certificates for the TLS container suite
# (tests/tls_redis.rs, issue #1834). Nothing secret is committed.
rcgen = "0.14"
tempfile = "3"
diesel-async = { workspace = true }
deadpool = { workspace = true }

[[bench]]
name = "claim_roundtrip_profile"
harness = false
# Requires a real, reachable Redis instance (see the harness's module doc) --
# `test = false` keeps `cargo test --all-targets` / `cargo test --workspace
# --all-targets` from building-and-running this binary (which `harness =
# false` would otherwise do unconditionally, panicking wherever
# HARVEST_REDIS_TEST_URL isn't set). `cargo bench --bench
# claim_roundtrip_profile` is unaffected: `test` only gates `cargo test`.
test = false

[lints]
workspace = true
