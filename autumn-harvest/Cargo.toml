[package]
name = "autumn-harvest"
description = "Durable workflow orchestration engine core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "durable", "postgres", "orchestration", "autumn"]
categories = ["asynchronous", "database"]

[features]
default = ["db", "unified-dag-execution"]
unified-dag-execution = ["autumn-harvest-macros/unified-dag-execution"]
db = [
    "dep:deadpool",
    "dep:diesel",
    "dep:diesel-async",
    "dep:diesel_migrations",
    "dep:tokio-postgres",
]
testing = []
metrics-rs = ["dep:metrics"]
# Enables `WorkflowInfo::with_schemas::<I, O, E>()` for automatic JSON Schema
# generation from types that derive `schemars::JsonSchema` (issue #373).
schema = ["dep:schemars"]
# Sandboxed WebAssembly activities (issue #965). Pulls wasmtime + wat only when
# explicitly enabled; requires the `db` feature (activity events are persisted).
#
# EFFECTIVE MSRV: this feature requires Rust >= 1.94 (wasmtime 46's own minimum).
# The crate's core/default MSRV is 1.88 and is UNAFFECTED: this optional R&D-spike
# feature is out of the default build and the MSRV CI check (`cargo check
# --workspace`, default features, never compiles wasmtime). See
# docs/rnd/wasm-activities-spike.md.
wasm-activities = ["dep:wasmtime", "dep:wat", "db"]

[dependencies]
autumn-harvest-macros = { version = "0.5.0", path = "../autumn-harvest-macros" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
url = "2"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
lru = "0.16"
croner = "2.2"
seahash = "4.1"
rand = { workspace = true }
deadpool = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
diesel-async = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
# 0.7.18 is the first release with the RUSTSEC advisory fix; pin the floor so a
# downstream lockfile can't silently resolve back to a vulnerable 0.7.x.
tokio-postgres = { version = "0.7.18", optional = true }
metrics = { version = "0.24", optional = true }
schemars = { version = "0.8", optional = true }
# wasmtime 46's own minimum Rust is 1.94, so the `wasm-activities` feature that
# enables these has an effective MSRV of 1.94 (the crate's core MSRV stays 1.88).
wasmtime = { version = "46", optional = true }
wat = { version = "1", optional = true }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# Property-based (proptest) test suite. Mirrors the `integration` target's
# single-entry-point convention: `tests/property/mod.rs` includes a module tree.
# The pure-function suites run under `cargo test -p autumn-harvest
# --no-default-features` (no DB); db-gated suites (build_routing, dlq) are
# `#[cfg(feature = "db")]` submodules that only compile in a `db` build.
[[test]]
name = "property"
path = "tests/property/mod.rs"

[[bench]]
name = "metrics_noop"
harness = false

