[[example]]
name = "fanout_batch"

[[example]]
name = "fanout_child_workflows"

[[example]]
name = "schema_workflow"
required-features = ["schema"]

[[example]]
name = "interface_schema_workflow"
required-features = ["schema"]

[[example]]
name = "business_metrics"

[[example]]
name = "sleep_until_renewal_reminder"

[[example]]
name = "business_day_escalation"

[[example]]
name = "long_lived_entity_deadline"

[[example]]
name = "cancellable_timer_sla"

[[example]]
name = "signal_aggregator"

[[example]]
name = "mutex_ledger"

[[example]]
name = "activity_interceptor"
required-features = ["testing"]

[[example]]
name = "dag_approval_gate"
required-features = ["unified-dag-execution"]

[[example]]
name = "dag_data_flow"
required-features = ["unified-dag-execution"]

[[example]]
