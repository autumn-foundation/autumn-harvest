[package]
name = "autumn-harvest"
description = "Durable workflow orchestration engine core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/madmax983/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "durable", "postgres", "orchestration", "autumn"]
categories = ["asynchronous", "database"]

[features]
default = ["db", "unified-dag-execution"]
unified-dag-execution = ["autumn-harvest-macros/unified-dag-execution"]
db = [
    "dep:deadpool",
    "dep:diesel",
    "dep:diesel-async",
    "dep:diesel_migrations",
    "dep:scoped-futures",
    "dep:tokio-postgres",
]
testing = []
metrics-rs = ["dep:metrics"]

[dependencies]
autumn-harvest-macros = { version = "0.3.0", path = "../autumn-harvest-macros" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
lru = "0.16"
croner = "2.2"
seahash = "4.1"
deadpool = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
diesel-async = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
scoped-futures = { version = "0.1", optional = true }
tokio-postgres = { version = "0.7", optional = true }
metrics = { version = "0.24", optional = true }

[[test]]
name = "macros_query_handlers"
required-features = ["testing"]

[[test]]
name = "macros_compile_fail"
required-features = ["testing"]

[[test]]
name = "external_completion_tests"
required-features = ["testing"]

[[bench]]
name = "metrics_noop"
harness = false

[[test]]
name = "idempotency_tests"
required-features = ["testing"]

[[test]]
name = "replayer_tests"
required-features = ["testing"]

[[test]]
name = "workflow_test_env_tests"
required-features = ["testing"]

[[test]]
name = "dag_unified_tests"
required-features = ["testing", "unified-dag-execution"]

[[test]]
name = "replayer_integration_tests"
required-features = ["testing", "db"]

[[test]]
name = "build_routing_tests"
required-features = ["db"]

[[test]]
name = "workflow_handle_tests"
required-features = ["db"]

[[test]]
name = "signal_with_start_tests"
required-features = ["db"]

[[example]]
name = "signal_with_start_webhook"
required-features = ["db"]

[[example]]
name = "timezone_cron_schedule"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
proptest = "1.11.0"
loom = "0.7.2"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trybuild = "1"
tempfile = "3"

[[test]]
name = "replay_verifier_tests"
required-features = ["testing"]

[[test]]
name = "payload_cap_tests"
required-features = ["testing"]

[[bench]]
name = "replay_bench"
required-features = ["testing"]
harness = false

[[bench]]
name = "replay_verifier_bench"
required-features = ["testing"]
harness = false

[lints]
workspace = true
