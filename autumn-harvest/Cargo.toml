[package]
name = "autumn-harvest"
description = "Durable workflow orchestration engine core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "durable", "postgres", "orchestration", "autumn"]
categories = ["asynchronous", "database"]

[features]
default = ["db", "unified-dag-execution"]
unified-dag-execution = ["autumn-harvest-macros/unified-dag-execution"]
db = [
    "dep:deadpool",
    "dep:diesel",
    "dep:diesel-async",
    "dep:diesel_migrations",
    "dep:tokio-postgres",
]
testing = []
# Time-travel replay debugger (issue #949): a stepping/diff API over the existing
# replay machinery. Read-only by construction -- no new `WorkflowEvent` variant, no
# migration, no engine-runtime change. Depends on `testing` for `HistorySnapshot`
# and the `WorkflowReplayer` handler-registration surface.
debugger = ["testing"]
metrics-rs = ["dep:metrics"]
# Enables `WorkflowInfo::with_schemas::<I, O, E>()` for automatic JSON Schema
# generation from types that derive `schemars::JsonSchema` (issue #373).
schema = ["dep:schemars"]
# Sandboxed WebAssembly activities (issue #965). Pulls wasmtime + wat only when
# explicitly enabled; requires the `db` feature (activity events are persisted).
#
# EFFECTIVE MSRV: this feature requires Rust >= 1.94 (wasmtime 46's own minimum).
# The crate's core/default MSRV is 1.88 and is UNAFFECTED: this optional R&D-spike
# feature is out of the default build and the MSRV CI check (`cargo check
# --workspace`, default features, never compiles wasmtime). See
# docs/rnd/wasm-activities-spike.md.
wasm-activities = ["dep:wasmtime", "dep:wat", "db"]
# Hot code swap for workflow definitions via runtime modules (issue #967).
#
# R&D spike. Hosts `#[workflow]` logic as a runtime-loaded WebAssembly module
# registered under an explicit `BuildId`, so the shipped build-routing machinery
# (percent ramp #604, compatibility sets + claim-time filtering #171,
# reachability #520/#535) governs a hot swap with no new safety machinery and
# **zero replay-surface change**. Off by default and never in `default`.
#
# Implies `wasm-activities` (and through it `db`): the module host reuses that
# feature's already-embedded wasmtime engine, `WasmModuleStore` compile cache,
# capability model and resource limits rather than adding a second sandbox, so
# this feature adds **no new dependency to the workspace**.
#
# EFFECTIVE MSRV: inherited from `wasm-activities` (Rust >= 1.94, wasmtime 46's
# own minimum). The crate's core/default MSRV is 1.88 and is UNAFFECTED.
# See docs/rnd/hot-code-swap.md.
hot-code-swap = ["wasm-activities"]
# Deterministic chaos / fault-injection test harness (issue #940). Off by
# default and never in `default`: injection points compile to a zero-cost
# const-check when this feature is off, so a non-chaos build has no hot-path
# cost (AC2/AC6). Requires `db` (the reproducers drive real Postgres paths).
chaos = ["db"]

[dependencies]
autumn-harvest-macros = { version = "0.6.0", path = "../autumn-harvest-macros" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
url = "2"
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
# Reads a migration's `metadata.toml` in `crate::migrate` with the SAME parser
# Diesel reads it with, so what this applies and what `diesel migration run`
# applies can never disagree. A hand-rolled subset was tried first and leaked
# five separate ways (unknown keys, duplicate keys, non-`key = value` lines,
# unbalanced key quotes, non-ASCII whitespace); already in the workspace
# lockfile via the plugin, so this unifies rather than widening.
toml = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
lru = "0.16"
croner = "2.2"
seahash = "4.1"
rand = { workspace = true }
deadpool = { workspace = true, optional = true }
diesel = { workspace = true, optional = true }
diesel-async = { workspace = true, optional = true }
diesel_migrations = { workspace = true, optional = true }
# 0.7.18 is the first release with the RUSTSEC advisory fix; pin the floor so a
# downstream lockfile can't silently resolve back to a vulnerable 0.7.x.
tokio-postgres = { version = "0.7.18", optional = true }
# 0.24.6 is the first non-yanked 0.24.x release; pin the floor for the same
# reason as tokio-postgres above (a downstream lockfile shouldn't be able to
# freshly resolve the yanked 0.24.5).
metrics = { version = "0.24.6", optional = true }
schemars = { version = "0.8", optional = true }
# wasmtime 46's own minimum Rust is 1.94, so the `wasm-activities` feature that
# enables these has an effective MSRV of 1.94 (the crate's core MSRV stays 1.88).
# 46.0.3 is the first release with all four RUSTSEC-2026-0222/0223/0268/0269
# fixes; pin the floor so a downstream consumer enabling `wasm-activities`
# can't silently resolve back to a vulnerable 46.0.x (same reasoning as
# tokio-postgres above — a workspace's own Cargo.lock never propagates to
# downstream consumers, only the manifest constraint does).
wasmtime = { version = "46.0.3", optional = true }
wat = { version = "1", optional = true }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# Property-based (proptest) test suite. Mirrors the `integration` target's
# single-entry-point convention: `tests/property/mod.rs` includes a module tree.
# The pure-function suites run under `cargo test -p autumn-harvest
# --no-default-features` (no DB); db-gated suites (build_routing, dlq) are
# `#[cfg(feature = "db")]` submodules that only compile in a `db` build.
[[test]]
name = "property"
path = "tests/property/mod.rs"

[[bench]]
name = "metrics_noop"
harness = false

# End-to-end benchmark suite (issue #941). `harness = false`: every scenario is
# destructive and stateful, so libtest/criterion's repeat-the-closure model would
# end up timing an empty queue. Needs `db` for the three engine scenarios and
# `testing` for the replay scenario's `WorkflowReplayer`.
[[bench]]
name = "e2e_bench"
harness = false
required-features = ["db", "testing"]

