# harvest-verify allowlist (issue #962, AC5)
# ============================================================================
#
# Suppresses a `harvest-verify` verdict for one workflow, with a REQUIRED
# justification. A file rather than a `#[workflow(allow_unverified)]` attribute
# because AC7 forbids any macro-path change — see
# `docs/rnd/determinism-static-analysis.md` §Escape hatch.
#
# Rules (each enforced by a test in `autumn-harvest-verify/tests/allowlist.rs`):
#
#   * `workflow` is the fully-qualified path (`crate::module::fn`), matched
#     EXACTLY. No globs: a pattern that silently widens is how an allowlist
#     becomes a bypass.
#   * `justification` is required and must be non-blank. An escape hatch without
#     a justification is an off switch.
#   * A duplicate `workflow` is a hard error — two justifications for one
#     workflow means one of them is stale.
#   * An UNUSED entry (its workflow no longer exists, or no longer needs it) is
#     reported as a warning, and is an error under `--strict`. Expect that
#     warning whenever the file is passed to a run that does not cover the
#     entry's workflow: CI passes this one file to BOTH the examples gate and
#     the test-workflow-corpus gate, and every entry is unused in one of them.
#     Both gates are non-strict, so the warning is a note, not a failure —
#     read an unused entry as "not covered by this run", and only chase it when
#     the run that *should* cover it reports it.
#
# The size of this file IS the success metric: `≤ 10%` of the analyzed workflow
# fns may need an entry. If it grows past that, the tool is wrong, not the code.
#
# Format:
#
#   [[allow]]
#   workflow = "my_crate::billing::reconcile_invoices"
#   justification = "Why this is safe, what covers it, and the tracking issue."
#
# Measured at the audited revision over `-p autumn-harvest --all-examples
# --no-default-features --features testing` — 57 workflow fns: 56 proven,
# 0 unknown, 1 allowed = 1.8 % against the 10 % budget. See
# `docs/harvest-verify.md` for how to read a verdict before writing an entry.

[[allow]]
workflow = "collect_approvals::collect_approvals"
justification = """\
`futures::future::select` is a reachability-only forbidden-effect rule: the \
analyzer reports the combinator, it cannot inspect how the race is driven. \
This one is replay-safe, and the example says why — the poll order is fixed \
(the signal future first, the deadline second) and the losing future is kept \
alive across loop iterations by `&mut timer_res`, so no already-started future \
is ever dropped and restarted. The very same call already carries a reviewed \
`harvest-suppress: DET011` in autumn-harvest/examples/collect_approvals.rs for \
exactly that reason; this entry is the semantic layer recording that decision, \
not a second opinion on it. Remove it if the example stops racing futures, or \
when the model can verify a fixed-order select instead of reporting every one."""

[[allow]]
workflow = "integration::decision_boundary_db_tests::boundary_mutex_waiter"
justification = """\
A test fixture for issue #1833, nondeterministic on purpose. Its first run \
appends one history row through a side connection, then takes a contended \
mutex. That puts a write by another writer inside the decision window, the \
race that `a_contended_acquire_records_no_boundary_after_a_foreign_write` \
proves the boundary write ignores. No engine hook can place a write there. \
The static flag makes the write fire once, and the row is a boundary, which \
replay skips. So later replays issue the same commands. Remove this entry if \
the engine gains a test hook between replay and persist."""

[[allow]]
workflow = "integration::decision_boundary_db_tests::boundary_pause_inline"
justification = """\
A test fixture for issue #1833, nondeterministic on purpose. After its local \
activity completes inline, its first run pauses itself through a side \
connection. The pause then lands after the inline writes and before the \
decision persists, the window that \
`a_pause_before_persist_keeps_the_boundary_of_inline_writes` covers. No \
engine hook can place a pause there. The static flag makes the pause fire \
once, and a paused run does not replay again in the test. Remove this entry \
if the engine gains a test hook between replay and persist."""

[[allow]]
workflow = "integration::decision_boundary_db_tests::boundary_late_row"
justification = """\
A test fixture for issue #1833, nondeterministic on purpose. Its first run \
appends one history row through a side connection, then takes a free \
mutex. The row lands after the cap check counted the history. That is the case \
`a_boundary_never_brings_a_running_history_to_the_cap` covers: the boundary \
write must see the real count. No engine hook can place a write there. The \
static flag makes the write fire once, and the row is a boundary, which \
replay skips. Remove this entry if the engine gains a test hook between \
replay and persist."""
