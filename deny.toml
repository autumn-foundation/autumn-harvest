# Dependency ledger harness (Ballast). Run locally with `cargo deny check`;
# CI runs the same command in .github/workflows/ci.yml's `dependency-audit`
# job on every push/PR that touches Cargo.toml/Cargo.lock/this file.
#
# Every `ignore`/`exceptions` entry below is a documented pin: it carries the
# reason it's deferred and the trigger that should bring it back for review.
# An entry with neither is a bug in this file, not a policy.

[graph]
# Resolve metadata the same way CI builds it (`--all-features`), so a crate
# that's only pulled in behind a feature flag (e.g. `kafka`, `mcp`) is still
# audited.
all-features = true

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — RUSTSEC scan, reachability-joined by hand below.
# ---------------------------------------------------------------------------
[advisories]
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0204 — crossbeam-epoch 0.9.18, invalid pointer deref in the
    # `fmt::Pointer`/`fmt::Display` impls for `Atomic`/`Shared` when the
    # pointer is null. We never format those types ourselves; reached via
    # `moka` (autumn-web's cache, production) and `criterion` (dev-only
    # benchmarks) — both transitive through `crossbeam-deque`/`rayon`, not a
    # direct dependency. Fix is a patch bump (>=0.9.20) entirely inside
    # `autumn-web`'s and `criterion`'s trees; not ours to force via
    # `cargo update` without those crates re-resolving on their own.
    # Verdict: unreachable. Revisit: next scheduled dependency batch.
    { id = "RUSTSEC-2026-0204", reason = "unreachable: we never format Atomic/Shared; fix lives in autumn-web's/criterion's transitive tree, not our manifest. Revisit: next scheduled batch." },

    # RUSTSEC-2026-0253 — lru 0.16.4, use-after-free in LruCache::pop() when
    # a stored key/value's Drop panics mid-pop. This IS a direct dependency
    # (autumn-harvest/src/cache.rs's WorkflowCache::remove calls
    # LruCache::pop()), so usage exists. But the key type is `Uuid` (Copy, no
    # custom Drop — cannot panic on drop) and the value type
    # `CachedWorkflowState` (a Vec<WorkflowEvent> of plain data, no custom
    # Drop either). Neither stored type can panic during drop, so this call
    # site cannot trigger the UB the advisory describes.
    # Verdict: unreachable (usage confirmed, exploitability requires a
    # panicking Drop our types don't have). The fix (>=0.18.2) is a manifest
    # bump (0.16 -> 0.18); good candidate for the first scheduled batch once
    # a changelog read confirms no breaking API surface we use.
    # Revisit: next scheduled batch.
    { id = "RUSTSEC-2026-0253", reason = "unreachable: LruCache::pop() is called (cache.rs), but our key (Uuid) and value (CachedWorkflowState) types have no custom Drop, so the panic-during-drop precondition can't occur. Candidate for next scheduled batch (0.16->0.18 manifest bump). Revisit: next scheduled batch." },

    # RUSTSEC-2026-0258 — h2, unbounded empty DATA frames (low severity DoS
    # if a peer floods empty frames and streams aren't drained). This
    # advisory matched TWO distinct h2 instances in the graph; a review
    # comment on this PR correctly caught that the first one below does not
    # need an ignore at all:
    #   - h2 0.4.13, via hyper 1.x -> axum -> autumn-web (our production HTTP
    #     server path): FIXED in the sibling commit, `cargo update -p
    #     h2@0.4.13` -> 0.4.19, no manifest change, `cargo check
    #     --workspace --all-features` green.
    #   - h2 0.3.27, via the old hyper 0.14 line pulled by
    #     aws-smithy-http-client/aws-config/aws-sdk-sqs (the `sqs` feature,
    #     optional, off by default): `cargo update -p h2@0.3.27` resolves 0
    #     packages — 0.3.27 is already the newest release its hyper-0.14
    #     constraint allows, and the advisory's fix ("Patched in v0.4.16")
    #     never landed on the 0.3.x branch. Same cluster and same fix path
    #     as the rustls-webpki findings below: needs an aws-config/
    #     aws-sdk-sqs manifest bump onto a release built on a newer
    #     hyper/h2 line, not a lockfile update. This ignore entry now covers
    #     only that surviving 0.3.27 instance.
    # Revisit: next scheduled batch evaluates whether a current aws-config/
    # aws-sdk-sqs release has moved off hyper 0.14/h2 0.3.
    { id = "RUSTSEC-2026-0258", reason = "the hyper-1.x/axum/autumn-web instance is fixed (see sibling commit); the surviving h2@0.3.27 instance is reachable only via the optional `sqs` feature's AWS SDK cluster (old hyper 0.14 line) and has no patched 0.3.x release to update to — needs an aws-config/aws-sdk-sqs manifest bump. Revisit: next scheduled batch." },

    # RUSTSEC-2026-0173 — proc-macro-error2 2.0.1 is unmaintained (not a
    # vulnerability). Pulled by validator_derive -> validator -> autumn-web;
    # no direct use in this repo. "No safe upgrade is available" per the
    # advisory. Nothing to bump; the maintenance signal belongs to
    # autumn-web's dependency on `validator`.
    # Revisit: if autumn-web drops or replaces `validator`, or
    # proc-macro-error2 gains a maintained release.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained, no safe upgrade exists; entirely inside autumn-web's `validator` dependency, not used directly here. Revisit: autumn-web drops/replaces validator, or proc-macro-error2 is revived." },

    # RUSTSEC-2023-0071 — rsa 0.9.10 Marvin Attack (timing side-channel on
    # private-key ops). Pulled by jsonwebtoken -> autumn-web; whether this is
    # reachable depends on whether autumn-web ever performs RSA *signing*
    # (private-key ops) rather than RS256 *verification* only, which is a
