\* A clear or a replace records no floor. A stale row then comes back
\* after a clear. TLC must violate ClearIsKept.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Floor = FALSE
    Hlc = TRUE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    ClearIsKept
CHECK_DEADLOCK FALSE
