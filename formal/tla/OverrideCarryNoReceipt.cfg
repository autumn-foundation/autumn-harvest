\* The copy records no receipt. A retry after a failed delete then
\* copies a cleared row back. TLC must violate ClearIsKept.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 2
    MaxFlips = 3
    Receipt = FALSE
    DropSource = TRUE
    Fenced = TRUE
    FlipWhen = "settled"
INVARIANT
    ClearIsKept
CHECK_DEADLOCK FALSE
