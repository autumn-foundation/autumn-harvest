\* The copy keeps no receipt. A retry after a failed delete then copies a
\* cleared row back. TLC must violate ClearIsKept.
SPECIFICATION Spec
CONSTANTS
    MaxVersion = 2
    MaxFlips = 3
    Receipt = FALSE
    DropSourceReceipt = TRUE
    Fenced = TRUE
INVARIANT
    ClearIsKept
CHECK_DEADLOCK FALSE
