\* A carry leaves the floor on its source. A route back after a clear on
\* the other shard then serves the stale row. TLC must violate ClearIsKept.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = TRUE
    Floor = TRUE
    CarryFloor = FALSE
    Hlc = TRUE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    ClearIsKept
CHECK_DEADLOCK FALSE
