\* The owner-lease design of issue #2250, with all four nemeses on.
\* TLC must find no error.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2, w3}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 4
    Defect = "none"
INVARIANTS
    TypeOK
    OneOwnerPerEpoch
    CommitAtPinnedEpoch
    DecisionOnFreshHistory
    NoDuplicateEvent
    AckAfterDurableWrite
    NoAckedSignalLost
    OwnerNeverFencesItself
SYMMETRY WorkerSymmetry
CHECK_DEADLOCK FALSE
