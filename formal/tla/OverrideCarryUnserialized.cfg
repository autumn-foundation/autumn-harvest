\* A carry does not lock both shards. Two carries in opposite directions
\* then both delete. TLC must violate NothingLostWithoutAClear.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = TRUE
    Floor = TRUE
    CarryFloor = TRUE
    Hlc = TRUE
    Newest = TRUE
    Serial = FALSE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    NothingLostWithoutAClear
CHECK_DEADLOCK FALSE
