\* The applied-set dedupe alone, with two sends in flight. It does not
\* depend on the order, so TLC must find no error.
SPECIFICATION LiveSpec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 2
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "off"
    SeqDedupe = "applied_set"
    Accept = "meet"
INVARIANTS
    TypeOK
    AtMostOnce
    NoLostAck
    MandateNarrows
    ConsumesTheHead
    AppliedSetExact
PROPERTY
    EventuallyApplied
CHECK_DEADLOCK FALSE
