\* R7. A tenure begins a second decision before its first commits. Both
\* read one resident state, so the second commits on a stale history.
\* TLC must violate DecisionOnFreshHistory.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "pipeline"
INVARIANT
    DecisionOnFreshHistory
CHECK_DEADLOCK FALSE
