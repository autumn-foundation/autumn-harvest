\* The capability-miss release with the full claim-epoch guard.
\* TLC must find no error. This is the fix for the CapMissGap config.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    MaxClaims = 5
    MaxStrikes = 2
    ChecksAttempt = TRUE
    CapMissGuard = "epoch"
INVARIANTS
    TypeOK
    AtMostOneTerminal
    TerminalByCurrentClaim
    OwnerWritesByCurrentClaim
CHECK_DEADLOCK FALSE
