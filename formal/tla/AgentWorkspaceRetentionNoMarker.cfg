\* A reset leaves no marker. It empties the store, so a new life starts low.
\* A late attempt of the reset then deletes the head of the new life. TLC
\* must violate HeadPresent.
SPECIFICATION Spec
CONSTANTS
    Ops = 4
    Contents = {"x", "y"}
    KeyBy = "generation"
    FloorBy = "store"
    MarkReset = FALSE
INVARIANT
    HeadPresent
CHECK_DEADLOCK FALSE
