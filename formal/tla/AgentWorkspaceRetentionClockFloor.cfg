\* A new life starts at the clock alone. A slow clock gives it the generation
\* of an old key, and a late retention of the old life deletes its head. TLC
\* must violate HeadPresent.
SPECIFICATION Spec
CONSTANTS
    Ops = 4
    Contents = {"x", "y"}
    KeyBy = "generation"
    FloorBy = "clock"
    MarkReset = TRUE
INVARIANT
    HeadPresent
CHECK_DEADLOCK FALSE
