\* A known limit. A routing change lands between a copy and its delete.
\* Two carries in opposite directions then both delete. TLC must violate
\* NothingLostWithoutAClear.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 2
    MaxFlips = 3
    Receipt = TRUE
    DropSource = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    NothingLostWithoutAClear
CHECK_DEADLOCK FALSE
