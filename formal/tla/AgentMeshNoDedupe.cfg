\* Both dedupe layers off, and the relay can deliver a row twice. TLC must
\* violate AtMostOnce.
SPECIFICATION Spec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 2
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "off"
    SeqDedupe = "off"
    Accept = "meet"
INVARIANT
    AtMostOnce
CHECK_DEADLOCK FALSE
