\* The counter-example for issue #1789. Owner writes check only
\* state = 'RUNNING'. TLC must violate TerminalByCurrentClaim.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Sweeper = Sweeper
    MaxClaims = 4
    Fenced = FALSE
INVARIANTS
    TypeOK
    AtMostOneTerminal
    TerminalStateHasOneEvent
    TerminalByCurrentClaim
CHECK_DEADLOCK FALSE
