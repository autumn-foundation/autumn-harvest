\* The counter-example for a blind sweep write. TLC must violate
\* ErasureIsFinal: the sweep resurrects an erased payload.
SPECIFICATION Spec
CONSTANTS
    Rows = {r1, r2}
    Sweepers = {s1, s2}
    OldKey = OldKey
    NewKey = NewKey
    Cas = FALSE
INVARIANTS
    TypeOK
    ErasureIsFinal
    CiphertextKeepsItsRow
CHECK_DEADLOCK FALSE
