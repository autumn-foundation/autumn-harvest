\* The engine keeps the keys of one run only, and B has no lastSeq dedupe. A
\* duplicate that lands after continue-as-new runs again. TLC must violate
\* AtMostOnce.
SPECIFICATION Spec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 1
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "run"
    SeqDedupe = FALSE
    Accept = "meet"
INVARIANT
    AtMostOnce
CHECK_DEADLOCK FALSE
