\* Issue #2602, gap 1. A routing change lands only while no carry runs,
\* so a failed delete can leave a stale row. A subset of OverrideCarry.cfg,
\* kept as the acceptance row of the issue. TLC must find no error.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = TRUE
    Floor = TRUE
    CarryFloor = TRUE
    Hlc = TRUE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "idle"
INVARIANT
    ClearIsKept
    LastWriteWins
    NothingLostWithoutAClear
    NoWriteAfterPromotion
CHECK_DEADLOCK FALSE
