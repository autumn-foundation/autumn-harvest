\* A known limit. A routing change lands while a failed delete leaves a
\* stale row. A clear on the owner then comes back. TLC must violate
\* ClearIsKept.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 2
    MaxFlips = 3
    Receipt = TRUE
    DropSource = TRUE
    Fenced = TRUE
    FlipWhen = "idle"
INVARIANT
    ClearIsKept
CHECK_DEADLOCK FALSE
