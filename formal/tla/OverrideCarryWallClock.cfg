\* A write takes any version, not one above all that its shard knows. A
\* set can then land at or below a floor, and both shards lose it. TLC must
\* violate NothingLostWithoutAClear.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = FALSE
    Floor = TRUE
    CarryFloor = TRUE
    Hlc = FALSE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    NothingLostWithoutAClear
CHECK_DEADLOCK FALSE
