\* A set takes any version, as a skewed clock gives. It can then take a
\* version at or below the floor. TLC must violate ClearIsKept.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Floor = TRUE
    Hlc = FALSE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    ClearIsKept
CHECK_DEADLOCK FALSE
