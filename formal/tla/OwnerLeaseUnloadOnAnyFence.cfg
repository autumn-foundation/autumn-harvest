\* Issue #2294. A fenced commit unloads its worker even when the worker
\* holds the live row at a newer epoch. The row then has no owner until it
\* expires, so a drain with no fault stops. TLC must violate
\* LiveRowHasAPinnedHolder.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "unload-on-any-fence"
INVARIANT
    LiveRowHasAPinnedHolder
CHECK_DEADLOCK FALSE
