\* Nemesis 2. An acquisition keeps the old resident state. The lease flaps
\* from w1 to w2 and back, and w1 decides on the history it had before.
\* TLC must violate DecisionOnFreshHistory.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "keep-cache"
INVARIANT
    DecisionOnFreshHistory
CHECK_DEADLOCK FALSE
