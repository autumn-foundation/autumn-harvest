\* Nemesis 2. The fence reads the owner row with no lock, so a takeover
\* lands between the check and the append. TLC must violate OneOwnerPerEpoch.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "unlocked-fence"
INVARIANT
    OneOwnerPerEpoch
CHECK_DEADLOCK FALSE
