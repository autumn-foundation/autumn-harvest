\* A reachability witness for the design. TLC must violate SomeNemesisUnseen,
\* so one behaviour reaches every nemesis.
SPECIFICATION Spec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 2
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "chain"
    SeqDedupe = "applied_set"
    Accept = "meet"
INVARIANT
    SomeNemesisUnseen
CHECK_DEADLOCK FALSE
