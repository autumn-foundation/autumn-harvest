\* A copy never replaces a row on its destination, as in issue #2413. A
\* stale older row then wins over a newer set. TLC must violate
\* LastWriteWins.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = TRUE
    Floor = TRUE
    CarryFloor = TRUE
    Hlc = TRUE
    Newest = FALSE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    LastWriteWins
CHECK_DEADLOCK FALSE
