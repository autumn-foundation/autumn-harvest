\* A copy never replaces a row on its destination, as in issue #2413. A
\* stale older row then shadows a newer one, and a floor removes the stale
\* row. TLC must violate NothingLostWithoutAClear.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Floor = TRUE
    Hlc = TRUE
    Newest = FALSE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    NothingLostWithoutAClear
CHECK_DEADLOCK FALSE
