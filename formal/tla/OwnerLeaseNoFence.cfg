\* Nemesis 1, golem#3766. The commit does not check the owner row, so a
\* stale owner commits after a takeover. TLC must violate OneOwnerPerEpoch.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "no-fence"
INVARIANT
    OneOwnerPerEpoch
CHECK_DEADLOCK FALSE
