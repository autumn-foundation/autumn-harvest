\* The design with two shards. A routing change can land at any time. TLC
\* must find no error.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = TRUE
    Floor = TRUE
    CarryFloor = TRUE
    Hlc = TRUE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    ClearIsKept
    LastWriteWins
    NothingLostWithoutAClear
    NoWriteAfterPromotion
CHECK_DEADLOCK FALSE
