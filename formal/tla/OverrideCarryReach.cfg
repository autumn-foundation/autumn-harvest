\* A reachability witness for the design. TLC must violate
\* NoClearOfACopiedRow, so a clear lands while another shard keeps the row.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = TRUE
    Floor = TRUE
    CarryFloor = TRUE
    Hlc = TRUE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    NoClearOfACopiedRow
CHECK_DEADLOCK FALSE
