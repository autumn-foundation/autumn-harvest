\* A reachability witness for the design. TLC must violate
\* NoClearOfACopiedRow, so a clear lands while another shard keeps the row.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 2
    MaxFlips = 3
    Receipt = TRUE
    DropSource = TRUE
    Fenced = TRUE
    FlipWhen = "settled"
INVARIANT
    NoClearOfACopiedRow
CHECK_DEADLOCK FALSE
