\* The peer-send design of issue #2269, with every nemesis on. Both dedupe
\* layers are on, and A keeps one send in flight. TLC must find no error,
\* and B must apply each committed send.
SPECIFICATION LiveSpec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 1
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "chain"
    SeqDedupe = TRUE
    Accept = "meet"
INVARIANTS
    TypeOK
    AtMostOnce
    NoLostAck
    MandateNarrows
    ConsumesTheHead
PROPERTY
    EventuallyApplied
CHECK_DEADLOCK FALSE
