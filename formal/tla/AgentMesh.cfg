\* The peer-send design of issue #2269, with every nemesis on. The engine
\* dedupes keys across the chain, and B dedupes by its applied set. A has
\* two sends in flight, so the outbox can reorder them. TLC must find no
\* error, and B must apply each committed send.
SPECIFICATION LiveSpec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 2
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "chain"
    SeqDedupe = "applied_set"
    Accept = "meet"
INVARIANTS
    TypeOK
    AtMostOnce
    NoLostAck
    MandateNarrows
    ConsumesTheHead
    AppliedSetExact
PROPERTY
    EventuallyApplied
CHECK_DEADLOCK FALSE
