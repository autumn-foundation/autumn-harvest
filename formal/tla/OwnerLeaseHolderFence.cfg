\* Nemesis 2. The fence compares the holder, not the epoch. The lease flaps
\* from w1 to w2 and back, and the old decision of w1 commits on a stale
\* history. TLC must violate DecisionOnFreshHistory.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "holder-fence"
INVARIANT
    DecisionOnFreshHistory
CHECK_DEADLOCK FALSE
