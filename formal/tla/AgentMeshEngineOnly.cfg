\* The engine dedupe alone, with two sends in flight. The outbox can reorder
\* them. The key dedupe does not depend on the order, so TLC must find no
\* error, and B must apply each committed send.
SPECIFICATION LiveSpec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 2
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "chain"
    SeqDedupe = FALSE
    Accept = "meet"
INVARIANTS
    TypeOK
    AtMostOnce
    NoLostAck
    MandateNarrows
    ConsumesTheHead
PROPERTY
    EventuallyApplied
CHECK_DEADLOCK FALSE
