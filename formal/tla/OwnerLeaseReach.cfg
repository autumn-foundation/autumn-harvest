\* A reachability witness for the design. TLC must violate
\* SomeNemesisUnseen, so one behaviour reaches all four nemeses.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 4
    Defect = "none"
INVARIANT
    SomeNemesisUnseen
CHECK_DEADLOCK FALSE
