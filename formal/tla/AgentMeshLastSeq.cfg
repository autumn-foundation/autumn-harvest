\* The old last_seq dedupe with two sends in flight. B gets the second
\* send first and then skips the first one. TLC must violate NoLostAck.
SPECIFICATION Spec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 2
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "chain"
    SeqDedupe = "last_seq"
    Accept = "meet"
INVARIANT
    NoLostAck
CHECK_DEADLOCK FALSE
