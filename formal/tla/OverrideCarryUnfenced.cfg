\* The carry writes do not check the generation. A write then lands after
\* a promotion. TLC must violate NoWriteAfterPromotion.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 2
    MaxFlips = 3
    Receipt = TRUE
    DropSource = TRUE
    Fenced = FALSE
    FlipWhen = "settled"
INVARIANT
    NoWriteAfterPromotion
CHECK_DEADLOCK FALSE
