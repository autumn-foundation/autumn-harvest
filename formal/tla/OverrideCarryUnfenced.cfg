\* The carry writes do not check the generation. A write then lands after
\* a promotion. TLC must violate NoWriteAfterPromotion.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Floor = TRUE
    Hlc = TRUE
    Newest = TRUE
    Serial = TRUE
    Fenced = FALSE
    FlipWhen = "any"
INVARIANT
    NoWriteAfterPromotion
CHECK_DEADLOCK FALSE
