\* Nemesis 3. A renewal adds 1 to the epoch while a decision is in flight,
\* so the holder fences its own commit. TLC must violate
\* OwnerNeverFencesItself.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "renew-bumps"
INVARIANT
    OwnerNeverFencesItself
CHECK_DEADLOCK FALSE
