\* A known limit. A clock that runs ahead clears on one shard. A later set
\* on another shard takes a lower version, and the floor removes it. TLC
\* must violate LastWriteWins.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 3
    MaxFlips = 3
    Fresh = FALSE
    Floor = TRUE
    CarryFloor = TRUE
    Hlc = TRUE
    Newest = TRUE
    Serial = TRUE
    Fenced = TRUE
    FlipWhen = "any"
INVARIANT
    LastWriteWins
CHECK_DEADLOCK FALSE
