\* The delete keeps the receipt of the source. A round trip then skips
\* the copy of a live row. TLC must violate NothingLostWithoutAClear.
SPECIFICATION Spec
CONSTANTS
    Shards = {"a", "b"}
    MaxVersion = 2
    MaxFlips = 3
    Receipt = TRUE
    DropSource = FALSE
    Fenced = TRUE
    FlipWhen = "settled"
INVARIANT
    NothingLostWithoutAClear
CHECK_DEADLOCK FALSE
