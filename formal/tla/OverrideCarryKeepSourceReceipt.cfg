\* The delete keeps the receipt of the source. A round trip then skips the
\* copy of a live row. TLC must violate NothingLostWithoutAClear.
SPECIFICATION Spec
CONSTANTS
    MaxVersion = 2
    MaxFlips = 3
    Receipt = TRUE
    DropSourceReceipt = FALSE
    Fenced = TRUE
INVARIANT
    NothingLostWithoutAClear
CHECK_DEADLOCK FALSE
