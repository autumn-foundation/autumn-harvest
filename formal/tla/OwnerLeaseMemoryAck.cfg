\* Nemesis 4, restate#4566. The owner acknowledges a signal from memory.
\* The epoch bumps before the durable write, and the signal is lost. TLC
\* must violate NoAckedSignalLost.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    Signals = {s1, s2}
    NoSignal = NoSignal
    MaxEpoch = 3
    Defect = "memory-ack"
INVARIANT
    NoAckedSignalLost
CHECK_DEADLOCK FALSE
