\* The old last_seq dedupe alone, with one send in flight. Delivery is
\* then in order, so TLC must find no error.
SPECIFICATION LiveSpec
CONSTANTS
    Tools = {t1, t2, t3}
    LocalB = {t1, t2}
    MandateA = {t2, t3}
    PeerTools = {t1, t2, t3}
    MaxSeq = 2
    MaxInFlight = 1
    MaxCrash = 2
    MaxEpoch = 3
    MaxDup = 1
    MaxCheckpoint = 1
    EngineDedupe = "off"
    SeqDedupe = "last_seq"
    Accept = "meet"
INVARIANTS
    TypeOK
    AtMostOnce
    NoLostAck
    MandateNarrows
    ConsumesTheHead
    AppliedSetExact
PROPERTY
    EventuallyApplied
CHECK_DEADLOCK FALSE
