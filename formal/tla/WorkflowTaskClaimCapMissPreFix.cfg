\* The counter-example for issue #1917. The capability-miss release after the
\* handler starts guards on worker_id and crash_strikes only. A stale cycle
\* can re-pend a later claim. TLC must violate OwnerWritesByCurrentClaim.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1, w2}
    NoWorker = NoWorker
    MaxClaims = 5
    MaxStrikes = 2
    ChecksAttempt = TRUE
    CapMissGuard = "strikes"
INVARIANTS
    TypeOK
    AtMostOneTerminal
    OwnerWritesByCurrentClaim
CHECK_DEADLOCK FALSE
