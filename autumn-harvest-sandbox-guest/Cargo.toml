[package]
name = "autumn-harvest-sandbox-guest"
description = "Guest agent for autumn-harvest sandbox microVMs: runs one plan per microVM over vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn-harvest"
readme = "README.md"
keywords = ["sandbox", "firecracker", "microvm", "agent", "autumn"]
categories = ["virtualization"]

[[bin]]
name = "harvest-guest-agent"
path = "src/main.rs"

[dependencies]
# The protocol and the process executor. No database.
autumn-harvest = { version = "0.7.0", path = "../autumn-harvest", default-features = false, features = ["sandbox-activities"] }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
# AF_VSOCK, mount, reboot and the random pool ioctls. Already in the lockfile.
libc = "0.2"

[lints]
workspace = true
