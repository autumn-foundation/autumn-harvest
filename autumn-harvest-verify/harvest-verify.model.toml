# HANDLER REGISTRATION — closures analyzed as entry-adjacent bodies
# ═══════════════════════════════════════════════════════════════════════════
#
# These are entry points, not calls. A workflow that registers a signal handler
# whose closure reads a `static` and emits an activity IS non-deterministic, and
# an analyzer that walks only the `#[workflow]` body would report it
