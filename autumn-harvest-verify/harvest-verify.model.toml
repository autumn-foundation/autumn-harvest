# ── Wall clock and monotonic clock ─────────────────────────────────────────

[[source]]
path = "SystemTime::now"
kind = "value"
reason = "Host wall clock. Differs between the original execution and every replay. The sanctioned replacement is `ctx.system_now()` (AC4)."
[[source]]
path = "SystemTime::elapsed"
kind = "value"
reason = "Reads the host wall clock to subtract from. Same hazard as `SystemTime::now`, and the shape MIR inlining leaves behind at opt-level >= 1."
[[source]]
path = "SystemTime::duration_since"
kind = "value"
reason = "Only non-deterministic when either operand is a live clock read; taint reaches it through the operand, and this row makes the result carry it even when the argument is `UNIX_EPOCH`."
[[source]]
path = "Instant::now"
kind = "value"
reason = "Monotonic clock; the origin is process start, so the value differs on every run and every worker."
[[source]]
path = "Instant::elapsed"
kind = "value"
reason = "Monotonic clock read; see `Instant::now`."
[[source]]
path = "Instant::duration_since"
kind = "value"
reason = "Difference of two monotonic reads. Included because the difference is itself a wall-clock-derived quantity whose value depends on how long the original run took — a laundering shape (`t1.duration_since(t0).as_secs() % 3`) that the syntactic layer's `Instant::now` rule catches at the read but not at the use."
[[source]]
path = "Utc::now"
receiver = "Utc"
kind = "value"
reason = "chrono wall clock. Prints as `Utc::now` and, through this crate's re-export, as `autumn_harvest::chrono::Utc::now` — which is exactly why this row is a suffix and not a `chrono::` prefix. `chrono` is a `[[trusted]]` propagator; this source row takes precedence over that."
[[source]]
path = "Local::now"
receiver = "Local"
kind = "value"
reason = "chrono local-time clock: non-deterministic in the clock AND in the machine's timezone."
[[source]]
path = "Utc::today"
receiver = "Utc"
kind = "value"
reason = "Deprecated chrono date read; still compiles and still reads the host clock."

