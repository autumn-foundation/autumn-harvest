path = "collect"
dest_type = "BinaryHeap"
clears = "order"
reason = "A heap has no observable iteration order that author code can act on except through `into_sorted_vec` / `pop`, both of which are ordered by the element ordering."
[[sanitizer]]
path = "into_sorted_vec"
receiver = "BinaryHeap"
clears = "order"
reason = "`BinaryHeap::into_sorted_vec` produces an ascending sequence independent of insertion order."
[[sanitizer]]
path = "sorted"
clears = "order"
reason = "`itertools::Itertools::sorted`."
[[sanitizer]]
path = "sorted_by"
clears = "order"
reason = "`itertools::Itertools::sorted_by`; see `sort_by`."
[[sanitizer]]
path = "sorted_by_key"
clears = "order"
reason = "`itertools::Itertools::sorted_by_key`; see `sort_by`."
[[sanitizer]]
path = "sorted_unstable"
clears = "order"
reason = "`itertools::Itertools::sorted_unstable`."
[[sanitizer]]
path = "reverse"
receiver = "Vec"
clears = "order"
reason = "NOT a sanitizer on its own — listed here ONLY to record the audit decision: reversing a hash-seeded order yields another hash-seeded order. This row clears nothing that was not already clear; it exists so a future reader does not add it as a real sanitizer. (`clears` is required by the schema; the analyzer treats a receiver-mismatched row as inert.)"

# ═══════════════════════════════════════════════════════════════════════════
# REDUCTIONS — order-insensitive consumers of an ordered sequence
# ═══════════════════════════════════════════════════════════════════════════
#
# A reduction reads an `Order`-tainted sequence and produces a value that does
# NOT depend on the order. `Value` taint passes straight through: `.max()` of a
# `Vec<Instant>` is still a clock read.

[[reduction]]
path = "len"
clears = "order"
reason = "Cardinality is order-independent."
[[reduction]]
path = "count"
clears = "order"
reason = "`Iterator::count`; see `len`."
[[reduction]]
path = "is_empty"
clears = "order"
reason = "See `len`."
[[reduction]]
path = "sum"
clears = "order"
reason = "Integer addition is associative and commutative, so the sum of a hash-ordered sequence is order-independent. CAVEAT, deliberately accepted: FLOAT addition is not associative, so `f64` sums over a `HashMap` iteration can differ in the last bits between orderings. The analyzer does not distinguish the element type here — a rule that flagged every float sum would produce more false positives than it prevents real divergences, and a workflow whose commands depend on the last bit of a float sum has a problem this tool is not the right shape to find. The report's soundness-boundaries table carries this."
[[reduction]]
path = "product"
clears = "order"
reason = "See `sum`, including the float caveat."
[[reduction]]
path = "max"
clears = "order"
reason = "The maximum of a set is order-independent."
[[reduction]]
path = "min"
clears = "order"
reason = "The minimum of a set is order-independent."
[[reduction]]
path = "all"
clears = "order"
reason = "Universal quantification is order-independent. (Short-circuiting changes how MANY elements are visited, not the answer; it matters only if the predicate has side effects, which is a separate finding on the predicate body.)"
[[reduction]]
path = "any"
clears = "order"
reason = "Existential quantification; see `all`."
[[reduction]]
path = "contains"
clears = "order"
reason = "Membership is order-independent."
[[reduction]]
path = "fold"
clears = "order"
reason = "NOT order-independent in general — `fold` with a non-commutative accumulator IS order-sensitive. Listed with `clears = \"order\"` would be wrong, so this row is deliberately absent from the analyzer's effective set: see the note in the `reverse` sanitizer row for the same device. Kept as a documented non-rule so a future contributor does not add it."
[[reduction]]
path = "get"
receiver = "HashMap"
clears = "order"
reason = "A keyed lookup returns the same value regardless of iteration order — the map's ORDER is unobservable through it. This row is what keeps `HashMap` usable in a deterministic workflow: only ITERATION is the hazard, never lookup."
[[reduction]]
path = "get_mut"
receiver = "HashMap"
clears = "order"
reason = "See `HashMap::get`."
[[reduction]]
path = "contains_key"
receiver = "HashMap"
clears = "order"
reason = "See `HashMap::get`."
[[reduction]]
path = "index"
receiver = "HashMap"
clears = "order"
reason = "`<HashMap as Index>::index`, the `map[k]` spelling of `get`."
[[reduction]]
path = "insert"
receiver = "HashMap"
clears = "order"
reason = "Returns the displaced value for that key, not an order-dependent one."
[[reduction]]
path = "remove"
receiver = "HashMap"
clears = "order"
reason = "Returns the value for that key; see `HashMap::get`."
[[reduction]]
path = "len"
receiver = "HashMap"
clears = "order"
reason = "See `len`."
[[reduction]]
path = "contains"
receiver = "HashSet"
clears = "order"
reason = "See `HashMap::get`: membership is not order-dependent."
[[reduction]]
path = "insert"
receiver = "HashSet"
clears = "order"
reason = "Returns whether the element was newly inserted; order-independent."
[[reduction]]
path = "remove"
receiver = "HashSet"
clears = "order"
reason = "Returns whether the element was present; order-independent."
[[reduction]]
path = "len"
receiver = "HashSet"
clears = "order"
reason = "See `len`."

# ═══════════════════════════════════════════════════════════════════════════
# TRUSTED CRATES — modelled as pure taint-propagators
# ═══════════════════════════════════════════════════════════════════════════
#
# When the analyzer meets a call into a crate whose MIR it does not have, the
# honest default is `unknown("external-crate-body: <path>")`. That default is
# correct and useless at scale: `format!` alone would make every workflow
# unknown. A crate listed here is instead modelled as a PURE PROPAGATOR — its
# result is tainted iff any argument is, it performs no effect, and it starts no
# taint of its own.
#
# The precedence rule is what keeps this from becoming a hole: `[[source]]`,
# `[[forbidden]]`, `[[sanitizer]]` and `[[reduction]]` rows are matched BEFORE
# the trusted-crate default. `chrono` is trusted AND `Utc::now` is a source; the
# source wins. `tokio` is trusted AND `tokio::time::sleep` is forbidden; the
# forbidden row wins. Trust means "no body needed to propagate", never "assumed
# clean".
#
# Adding a crate here is the single highest-leverage way to make this tool lie.
# Each row states why the crate's whole surface is effect-free apart from the
# rows already carved out above.

# ── `[[std_free_fn]]` — body-less callees that are provably std ─────────────
#
# A callee with no body in the analyzed set and no model row is an
# `external-crate-body` boundary: a dependency compiled without `--emit=mir`
# really is code the analysis never saw, and calling it "clean" is the silent
# `proven` this table exists to prevent.
#
# A trusted crate is the exception, because it is modelled by the tables above
# instead. The analyzer recognises one from evidence about the CALLEE: either
# the callee path names a trusted crate root itself (including the qualifying
# trait of a `<T as std::future::IntoFuture>::into_future`), or the call is a
# METHOD whose receiver type is a primitive (`<u64 as From<u32>>::from`) or is
# declared at the call site with a trusted root — MIR prints `let` declarations
# fully qualified even where it trims the callee path, so `String::clone`'s
# `_9: &std::string::String` receiver says what `String` is.
#
# Declared ARGUMENT and RESULT types are deliberately not evidence. `now_ish()
# -> std::string::String` from a dependency compiled without `--emit=mir` names
# std in its result and is still a body the analysis never saw; treating that as
# std was the silent `proven` this rule was tightened to prevent.
#
# What that leaves is FREE functions: with no receiver there is nothing at the
# call site that names the callee's crate. Add a row here when a run reports
# `unknown: external-crate-body: <path>` for a free function of std/core/alloc
# or of a `[[trusted]]` crate, after checking the callee text and the declared
# types in the dump to confirm which item it really is:
#
#   [[std_free_fn]]
#   path = "some_free_fn"
#   reason = "core::…::some_free_fn; a free function, so no receiver at the
#             call site names its crate."
#
# `path` matches exactly as `[[source]] path` does: a `::`-segment suffix of the
# callee path with generic arguments stripped. A row here says "this body is
# trusted, propagate taint through it", never "this call is clean".

[[std_free_fn]]
path = "format"
reason = "alloc::fmt::format. `format!` lowers to `format(Arguments)`, printed with no crate root and no receiver; its `std::fmt::Arguments` argument and `std::string::String` result are the caller's types, not evidence about the callee. Verified in the dumps: `_5 = format(move _6)` with `_6: std::fmt::Arguments<'_>`. Without this row every workflow that formats a string is `unknown`."

[[std_free_fn]]
path = "must_use"
reason = "core::hint::must_use — the identity function the `#[must_use]` lint desugars `format!` and friends through. Verified in the dumps: `_4 = must_use::<String>(move _5)` with `_5: std::string::String`, immediately after the `format` call whose result it forwards."

[[std_free_fn]]
path = "to_value"
reason = "serde_json::to_value, a `[[trusted]]` crate's free function that rustc trims to one segment at every `#[workflow]` command-encoding site. Verified in the corpus dumps: `_35 = to_value::<&u64>(move _36)` with `_36: &u64` and `_35: std::result::Result<serde_json::Value, serde_json::Error>` — the crate is named only in the RESULT, which is not evidence about the callee. A structural walk over the value; the derived `Serialize` impls it calls are in the analyzed set when they are first-party."

[[std_free_fn]]
path = "from_value"
reason = "serde_json::from_value, the decoding half of `to_value` and trimmed the same way. Verified in the dumps: `from_value::<bool>(move _N)` with a `serde_json::Value` argument and a `std::result::Result<bool, serde_json::Error>` destination — again the crate is named only in types that are the CALLER's, not the callee's."

[[std_free_fn]]
path = "display"
reason = "tracing::field::display — what `tracing`'s `%field` sigil lowers to, printed as a bare `display::<&T>` with the *caller's* `T` as its only type. Verified in the dumps: `_36 = display::<&autumn_harvest::ExecutionId>(move _37)` with `_36: tracing::field::DisplayValue<..>`. The name is generic, but a user's own `fn display` with a body in the analyzed set is resolved to that body and never reaches this table."

[[std_free_fn]]
path = "debug"
reason = "tracing::field::debug — the `?field` sigil's half of the pair above, and trimmed identically. Verified in the dumps: `_51 = debug::<&std::option::Option<autumn_harvest::ExecutionId>>(move _52)` with `_51: tracing::field::DebugValue<..>`."

[[std_free_fn]]
path = "task_duration"
reason = "autumn_harvest::task_duration (`autumn-harvest/src/lib.rs`), a `[[trusted]]` crate's free function that parses a `&str` into an `Option<Duration>`. rustc trims it to one segment in every `#[activity]` info body. Verified in the dumps: `_4 = task_duration(move _5)` with `_5: &str` and `_4: std::option::Option<std::time::Duration>`. Pure string parsing: no clock, no ambient state."

[[trusted]]
name = "core"
reason = "Always trusted. Language primitives: arithmetic, formatting, iteration, `Option`/`Result` combinators. No ambient state and no I/O; every hazard reached through it (`core::hint::must_use`, `Iterator::next` over a hash-seeded iterator) is carried by a rule above."
[[trusted]]
name = "alloc"
reason = "Always trusted. `Vec`, `String`, `Box`, `BTreeMap`: allocation and owned containers. Allocation ADDRESSES vary between runs, but no safe API exposes one as a value."
[[trusted]]
name = "std"
reason = "Always trusted as a propagator — and the crate with the most carve-outs: the clock, environment, filesystem, network, thread, process, interior-mutability and `HashMap`-iteration rows above ALL take precedence over this entry. `format!` alone justifies the row: measured, it lowers to `Arguments::new` over an array aggregate with no call into user code, and treating it as unknown would make every workflow that formats a string `unknown`."
[[trusted]]
name = "serde"
reason = "Serialization traits. Derived impls are pure structural walks over the value; nothing ambient is read. (A hand-written `Serialize` that reads a clock is a source inside the FIRST-PARTY crate, whose MIR the analyzer has, so it is still caught.)"
[[trusted]]
name = "serde_json"
reason = "JSON encode/decode over a `BTreeMap`-backed `Map`, so `Value` object iteration is ordered. Note the fragility, carried in the report: serde_json's `preserve_order` feature swaps `Map` for an `IndexMap` — still deterministic, so no rule changes — but a build that swapped it for a `HashMap` would silently invalidate this row."
[[trusted]]
name = "serde_core"
reason = "The trait-only split of `serde`; same argument."
[[trusted]]
name = "chrono"
reason = "Date/time ARITHMETIC and formatting are pure functions of their inputs. The clock ENTRY POINTS are not: `Utc::now` and `Local::now` are `[[source]]` rows and take precedence. Note the re-export: chrono prints as `autumn_harvest::chrono::...` in MIR emitted from this workspace, which is why the source rows are suffix-matched."
[[trusted]]
name = "uuid"
reason = "UUID parsing, formatting and byte manipulation are pure. The generators are not: `new_v4`, `now_v7`, `now_v6` and `new_v1` are `[[source]]` rows and take precedence."
[[trusted]]
name = "autumn_harvest"
reason = "The engine itself. Its `WorkflowContext` surface is fully classified above (160 public methods) and an UNMODELLED `WorkflowContext::*` method yields `unknown(\"unmodeled-ctx-method\")` rather than being silently trusted. Everything else in the crate — `info`, `policy`, `shard`, error types, the `Saga` builder — is a propagator. The crate is also the re-export point for `chrono`, `serde_json` and `uuid`, which is why paths through it are matched by suffix."
[[trusted]]
name = "tokio"
reason = "Async runtime plumbing propagates taint like any other library, but the runtime's EFFECTS are `[[forbidden]]` rows that take precedence: `sleep`, `sleep_until`, `spawn`, `spawn_blocking`, `spawn_local`, `block_on`. `tokio::select!` is the acknowledged hole — the macro lowers to an inline poll loop with no callee path, so nothing in this table can see it, and HVG010 remains its only gate."
[[trusted]]
name = "futures"
reason = "Combinators over futures propagate taint. The order-sensitive combinators (`select`, `select_all`, `select_ok`, `try_select`, `FuturesUnordered`) are `[[forbidden]]` rows and take precedence."
[[trusted]]
name = "tracing"
reason = "Structured logging. Emits no workflow command and reads nothing ambient that reaches a value; a `tracing` subscriber's own clock reads happen outside the workflow body."
[[trusted]]
name = "base64"
reason = "Pure encoding: output is a function of input bytes."
[[trusted]]
name = "sha2"
reason = "Pure hashing: output is a function of input bytes. (Contrast `RandomState`, which is a `[[source]]` because its KEYS are random.)"
[[trusted]]
name = "hmac"
reason = "Pure keyed hashing; see `sha2`."
[[trusted]]
name = "url"
reason = "Pure parsing and formatting."
[[trusted]]
name = "thiserror"
reason = "Derive-only: generates `Display`/`Error` impls that are pure formatting."
[[trusted]]
name = "anyhow"
reason = "Error wrapping. `anyhow::Error` captures a backtrace when `RUST_BACKTRACE` is set — host state — but no safe API turns a backtrace into a value a workflow branches on."
[[trusted]]
name = "itertools"
reason = "Iterator adaptors, pure. Its `sorted*` family are `[[sanitizer]]` rows and take precedence."
[[trusted]]
name = "indexmap"
reason = "`IndexMap`/`IndexSet` iterate in INSERTION order, which is deterministic — this is exactly why no `[[source]] kind = \"order\"` row exists for them, and why `IndexMap` is the recommended fix for a hash-order finding."
[[trusted]]
name = "once_cell"
reason = "Propagator for the container types; the ambient reads are covered by `Lazy`'s `Deref::deref` `[[source]]` row and by the `Lazy`/`OnceCell` `[[ambient_type]]` entries, which take precedence."
[[trusted]]
name = "bytes"
reason = "`Bytes`/`BytesMut`: reference-counted byte buffers. Pure data."
[[trusted]]
name = "regex"
reason = "Compilation and matching are pure functions of the pattern and the haystack. (Capture-group iteration is positional, not hash-ordered.)"
[[trusted]]
name = "rand"
reason = "Trusted as a PROPAGATOR only, so that a seeded `StdRng` threaded through helper functions still analyses. Every entry point that draws unrecorded entropy — `thread_rng`, `rng`, `random`, `Rng::gen*`, `RngCore::*`, `OsRng`, `from_entropy` — is a `[[source]]` row and takes precedence. `SeedableRng::seed_from_u64` is deliberately NOT a source: a recorded seed is reproducible, and the corpus proves that case must stay `proven-deterministic`."
