# ── Replay-varying `WorkflowContext` reads ─────────────────────────────────
#
# The hazard class with NO rule in HVG001-HVG011 or DET001-DET011, and 20 call
# sites in this repo's own examples. Note what is NOT here: `deadline`,
# `scheduled_time`, `start_time` and `now` were audited and found replay-STABLE
# (see `[[sanctioned]]`), and `time_until_deadline` / `should_continue_as_new`
# are sinks with clean returns, not sources. Classifying the whole family as
# replay-varying "to be safe" would have produced 20 false positives; classifying
# none of it would have missed the two that are real.

[[source]]
path = "is_replaying"
receiver = "WorkflowContext"
kind = "value"
reason = "context.rs:4545, doc 4519-4544: \"Observability-only: use it to gate side effects, never to derive workflow commands. Branching command-affecting logic on it records different commands live vs replay and triggers non-determinism.\" The doc's own example (`if !ctx.is_replaying() { println!(..) }`) is the clean use; a command inside that branch is the finding."
[[source]]
path = "history_event_count"
receiver = "WorkflowContext"
kind = "value"
reason = "context.rs:4314. `should_continue_as_new` (context.rs:4352-4356) calls it \"the (task-varying) event count\" and deliberately evaluates the deadline branch unconditionally so the recorded side-effect stream stays \"a pure function of the recorded history at the cursor, not of the event count\". The engine's own workaround is the evidence that a branch on this value diverges."
[[source]]
path = "replay_position"
receiver = "WorkflowContext"
kind = "value"
reason = "context.rs:4297 = `match_history(|m| m.position())`, the matcher cursor. Live execution sits at the frontier; a replay walks the same program point with a different cursor."
[[source]]
path = "history_has_unconsumed_events"
receiver = "WorkflowContext"
kind = "value"
reason = "context.rs:3448 = `match_history(|m| m.has_non_lifecycle_unconsumed())`. Doc 3444-3447: it exists so `run_workflow_strict` can \"detect early-completion non-determinism\" — a cursor-relative predicate, false live and true on replay at the same program point."

# ═══════════════════════════════════════════════════════════════════════════
# SOURCES — kind = "order"
# ═══════════════════════════════════════════════════════════════════════════
#
# `HashMap`/`HashSet` iteration order is seeded per process by `RandomState`, so
# it differs between the original run and a replay on another worker. The VALUES
# are deterministic — only the sequence is not — which is why `Order` is a
# distinct taint kind from `Value`: it is killed by sorting or by an
# order-insensitive reduction (`[[sanitizer]]` / `[[reduction]]`), while `Value`
# is killed only by `ctx.side_effect`.
#
# `impl Trait` returns are transparent in MIR (measured:
# `fn make_iter(_1: &HashMap<String, u64>) -> std::collections::hash_map::Values<'_, String, u64>`),
# so an `Order`-tainted iterator laundered through a helper's return type is still
# visible to the analyzer.
#
# `IndexMap` and `BTreeMap`/`BTreeSet` are deliberately ABSENT: `IndexMap`
# preserves insertion order and `BTree*` are sorted, so all three iterate
# deterministically. `serde_json::Map` is a `BTreeMap` by default and is likewise
# absent — but note the fragility: enabling serde_json's `preserve_order` feature
# swaps it for an `IndexMap`, which is still deterministic, so no row is needed
# either way. It would only become an `Order` source if a build swapped it for a
# `HashMap`, which serde_json never does.

[[source]]
path = "iter"
receiver = "HashMap"
kind = "order"
reason = "`HashMap::iter`. Iterating the map yields entries in a per-process, hash-seeded order."

