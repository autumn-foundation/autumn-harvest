# ═══════════════════════════════════════════════════════════════════════════
# harvest-verify — builtin determinism model (issue #962)
# ═══════════════════════════════════════════════════════════════════════════
#
# This file IS the analysis. `src/` decides how taint flows; this file decides
# what taint is, where it starts, and where it must never arrive. AC4 requires
# that the sanctioned-primitive set be extensible "without a release", which is
# why the rules live in data and not in a `match` arm.
#
# ── How a row matches ──────────────────────────────────────────────────────
#
# Stable `rustc --emit=mir` prints callee paths with rustc's *trimmed* def-paths
# — the shortest unambiguous path — while `let _N: T;` declarations print types
# *fully qualified*. Measured on rustc 1.94.1 against this repo:
#
#     _2 = var::<&str>(const "DEPLOY_REGION")
#     let mut _2: std::result::Result<std::string::String, std::env::VarError>;
#     _5 = SystemTime::now()
#     _3 = format(move _4)
#     _5 = DateTime::<Utc>::timestamp(move _6)
#     let _6: autumn_harvest::chrono::DateTime<autumn_harvest::chrono::Utc>;
#
# Three consequences drive every rule below:
#
#   1. A rule keyed on a full path (`std::env::var`) matches NOTHING.
#   2. Re-export paths win: `chrono` prints as `autumn_harvest::chrono`,
#      `uuid` as `autumn_harvest::uuid`. A `chrono::*` prefix rule silently misses.
#   3. Trimmed paths are *ambiguity-dependent*: the same source lengthens the
#      moment a second item of that name is in scope.
#
# So a `path` is matched as a **`::`-segment SUFFIX of the callee path with
# generic arguments stripped**, never as a prefix:
#
#     path = "SystemTime::now"   matches  `SystemTime::now`, `std::time::SystemTime::now`
#     path = "now"               matches  any callee whose last segment is `now`
#
# Two optional narrowing keys keep bare suffixes honest:
#
#   * `receiver` — the self/receiver type name (LAST segment, generics stripped).
#     `receiver = "HashMap"` matches `<HashMap<K, V> as IntoIterator>::into_iter`
#     and `HashMap::<K, V>::iter` alike.
#   * `dest_type` — a suffix of the fully-qualified declared type of the call's
#     destination local, read from the `let` declarations. This is the answer to
#     the bare-`var` problem: `path = "var"` alone would match any user function
#     named `var`, so the row also requires
#     `dest_type = "std::result::Result<std::string::String, std::env::VarError>"`,
#     which no user function can accidentally produce. Same device pins bare
#     `sleep` to `tokio::time::sleep` via `dest_type = "tokio::time::Sleep"`,
#     and expresses "collect INTO a BTreeMap" as an order sanitizer.
#
# Rows are matched most-specific-first (`receiver` + `dest_type` > `receiver` >
# `path` alone), and `[[source]]` always beats `[[trusted]]`: `chrono` is a
# trusted taint-propagator AND `Utc::now` is a source, and the source row wins.
#
# ── Tables ─────────────────────────────────────────────────────────────────
#
#   [[ambient_type]]        interior-mutable / lazily-initialised types whose
#                           `static` instances are ambient taint roots
#   [[source]]              taint origins; `kind = "value" | "order"`
#   [[sink]]                command-emitting `WorkflowContext` methods
#   [[sanctioned]]          ctx primitives whose RETURN is clean
#   [[non_sink]]            ctx methods that are neither sink nor source
#   [[handler_registration]] ctx methods registering a closure that is analyzed
#                           as an entry-adjacent body
#   [[forbidden]]           effects that are findings on reachability alone
#   [[sanitizer]]           calls that CLEAR a taint kind
#   [[reduction]]           order-killing reductions and lookups
#   [[trusted]]             crates with no MIR available, modelled as pure
#                           taint-propagators rather than as `unknown`
#
# An unmodelled `WorkflowContext::*` method is NOT assumed clean: it yields
# `unknown("unmodeled-ctx-method: <name>")`. That is why all 160 public methods
# of `impl WorkflowContext` are classified here, not just the 73 the examples
# happen to call.
#
# ── Extending it ───────────────────────────────────────────────────────────
#
# `cargo harvest-verify --model extra.toml` overlays a file on this one: the
# result is the union of the rows, and a later row with the same
# (table, path, receiver) key replaces the earlier one. Overlays compose, applied
# left to right. Removing a builtin row = re-declaring it in the other table
# (e.g. an `[[sanctioned]]` row for a first-party wrapper that records its own
# result). Every row must carry a non-empty `reason`; a row without one is a
# model error, not a warning, because an unexplained rule is how a model rots.
#
# The version string is printed with every verdict ("no non-determinism found,
# under model 2026.09.0, up to boundaries ..."), so a verdict can always be
# traced to the rules that produced it. Bump the date component when rows change.

version = "2026.09.0"

# ═══════════════════════════════════════════════════════════════════════════
# AMBIENT TYPES — statics of these types are taint roots
# ═══════════════════════════════════════════════════════════════════════════
#
# Measured constraint (rustc 1.94.1): an immutable `static PLAIN: u64 = 7` and a
# `static COUNTER: AtomicU64` lower to the SAME MIR shape —
# `_6 = const {alloc35: &u64}` / `_7 = const {alloc1: &AtomicU64}` — with the
# static's identity recoverable only from the `alloc` footer
# (`alloc1 (static: COUNTER, size: 8, align: 8)`). The analyzer resolves the
# footer, reads the declared type, and consults this table: an interior-mutable
# or lazily-initialised static is an ambient Value root (its contents can differ
# between the original run and the replay); a plain immutable data static is
# clean and must NOT be flagged, or every `static MAX_RETRIES: u32` in the
# corpus becomes a finding.
#
# The interior-mutability rows in `[[source]]` below are read together with this
# table: `Mutex::lock` on a workflow-local `Mutex` merely propagates the
# receiver's taint; the same call on a `static` of a type listed here starts
# taint. `static mut` is always ambient regardless of type.

[[ambient_type]]
name = "Atomic"
reason = "The generic `core::sync::atomic::Atomic<T>` that rustc >= 1.98 prints for every atomic; `AtomicU64` and friends are aliases of it and MIR resolves an alias to the type it names (`static SEQ: Atomic<u64>`, `_1 = const {alloc6: &Atomic<u64>}`). The width-named rows below stay for MIR emitted by older toolchains, which printed the alias."
[[ambient_type]]
name = "AtomicBool"
reason = "Interior-mutable; a static's value is process-lifetime state, not history-derived."
[[ambient_type]]
name = "AtomicU8"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicU16"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicU32"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicU64"
reason = "Interior-mutable ambient counter. The canonical laundered seed: `COUNTER.fetch_add(1, Relaxed)` replays to a different number on a second worker."
[[ambient_type]]
name = "AtomicUsize"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicI8"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicI16"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicI32"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicI64"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicIsize"
reason = "Interior-mutable ambient counter/flag."
[[ambient_type]]
name = "AtomicPtr"
reason = "Interior-mutable ambient pointer slot."
[[ambient_type]]
name = "Mutex"
reason = "Interior-mutable. A `static M: Mutex<Vec<T>>` carries state across executions on the same worker and is empty on another."
[[ambient_type]]
name = "RwLock"
reason = "Interior-mutable; see `Mutex`."
[[ambient_type]]
name = "RefCell"
reason = "Interior-mutable. Reached in practice through `thread_local! { static TL: RefCell<T> }`, whose `LocalKey::with` read hides inside a promoted constant (`_10 = const wf::{closure#0}::promoted[0]`)."
[[ambient_type]]
name = "Cell"
reason = "Interior-mutable; see `RefCell`."
[[ambient_type]]
name = "OnceLock"
reason = "Lazily initialised: the value observed depends on which execution won the initialisation race, and the initialiser is invisible at the use site."
[[ambient_type]]
name = "OnceCell"
reason = "Lazily initialised; see `OnceLock`."
[[ambient_type]]
name = "LazyLock"
reason = "Lazily initialised, and the worst shape in the whole model: the use site is a bare `<LazyLock<u64> as Deref>::deref(move _7)` that looks like a pure deref, while the initialiser — which may call `SystemTime::elapsed` — is four hops away in `LAZY::{closure#0}`."
[[ambient_type]]
name = "LazyCell"
reason = "Lazily initialised; see `LazyLock`."
[[ambient_type]]
name = "Lazy"
reason = "`once_cell::sync::Lazy` / `lazy_static!`'s generated type. Same invisible-initialiser shape as `LazyLock`."
[[ambient_type]]
name = "LocalKey"
reason = "`thread_local!` storage: per-thread state, and which worker thread runs a decision cycle is not recorded."
[[ambient_type]]
name = "SyncOnceCell"
reason = "Pre-stabilisation spelling of `OnceLock`, still present in older dependency code."
[[ambient_type]]
name = "RandomState"
reason = "`HashMap`'s default hasher builder. A `static` of it seeds every map built from it with per-process randomness."

