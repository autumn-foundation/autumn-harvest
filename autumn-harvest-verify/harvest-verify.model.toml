# SANCTIONED — ctx primitives whose RETURN value is clean
# ═══════════════════════════════════════════════════════════════════════════
#
# AC4's list, plus the members of the deadline family that the audit found to be
# replay-stable. Thirteen of these rows are DUAL ROLE: they also appear in
# `[[sink]]`, because the primitive records its result and a tainted decision to
# call it still diverges the command stream. Modelling `side_effect` as sanctioned
# only (return clean, call ignored) would silently drop the control-taint finding
# that motivates the whole analysis; modelling it as a sink only would flag every
# correct use of the one primitive the engine offers for laundering.
