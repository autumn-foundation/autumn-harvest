# ═══════════════════════════════════════════════════════════════════════════
# SINKS — `WorkflowContext` methods that emit a history-matched command
# ═══════════════════════════════════════════════════════════════════════════
#
# Oracle: `WorkflowContext::push_command` (autumn-harvest/src/context.rs) is the
# single command-emission primitive. A method is a SINK iff it reaches
# `push_command` transitively **and** the command it pushes is matched against
# recorded history. The `reason` on each row names the call chain to the
# `push_command` site (`*` marks the emitting frame).
#
# The second half of that test matters: six methods reach `push_command` and are
# still NOT sinks, because they return early under
# `is_replaying()` / `replay_suppresses_side_effects()` and their command is
# replay-suppressed bookkeeping that never participates in matching
# (`set_current_details`, `publish_progress`, `upsert_search_attrs`,
# `log_info`, `log_warn`, `log_error`). They are `[[non_sink]]` rows, each with
# the guard's line number. Those six cover 30+ of the 310 real `ctx.` call sites
# in this repo's examples; mis-filing them as sinks alone would exhaust the
# 10 % allowlist budget.
#
# `args` is omitted (= all arguments checked) on every row: for a command-emitting
# call there is no argument whose non-determinism is harmless. `side_effect` is the
# single exception and is commented at its row.
