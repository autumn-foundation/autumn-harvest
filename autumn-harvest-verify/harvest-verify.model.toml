# SANITIZERS — calls that CLEAR a taint kind
# ═══════════════════════════════════════════════════════════════════════════
#
# Only `Order` has sanitizers. `Value` is cleared by exactly one thing —
# `ctx.side_effect` recording the value into history — which is already expressed
# by that method's `[[sanctioned]]` row. There is no `clears = "value"` row in
# this model, and adding one would be how a real finding gets laundered away.

[[sanitizer]]
