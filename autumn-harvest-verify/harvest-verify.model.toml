# ═══════════════════════════════════════════════════════════════════════════
# FORBIDDEN — findings on REACHABILITY alone, no taint required
# ═══════════════════════════════════════════════════════════════════════════
#
# These are not sources and not sinks: they are effects a workflow body must not
# perform at all. Reaching one from a `#[workflow]` function is a
# `forbidden-effect` finding whether or not any value is tainted, because the
# effect itself is unrecorded — a blocking sleep is not replayed, a spawned task
# outlives the decision cycle, a file read returns different bytes on another
# host.
#
# NOT here, deliberately:
#   * `println!` / `print!` lower to `std::io::_print`. Console output is noise,
#     not a determinism hazard, and `ctx.is_replaying()`-gated `println!` is the
#     documented idiom (context.rs:4533-4541). Flagging it would fight the docs.
#   * `tokio::select!` — the macro lowers to an inline poll loop with no callee
#     path, so it is NOT identifiable in MIR at all. The syntactic guardrail
#     HVG010 remains the only gate on it. This is a named limitation, not an
#     omission: the report's boundaries table carries it.

[[forbidden]]
path = "sleep"
dest_type = "tokio::time::Sleep"
reason = "`tokio::time::sleep`. Wall-clock sleeping inside a workflow body burns the decision-cycle budget and is not replayed; the durable equivalent is `ctx.timer()` / `ctx.sleep_until()`. Pinned by `dest_type` because the trimmed callee path is the bare suffix `sleep`."
[[forbidden]]
path = "sleep_until"
dest_type = "tokio::time::Sleep"
reason = "`tokio::time::sleep_until`. Distinct from `WorkflowContext::sleep_until`, which is a durable sink — the `dest_type` pin is what separates them."
[[forbidden]]
path = "thread::sleep"
reason = "`std::thread::sleep` blocks the worker thread for real time that no replay reproduces."
[[forbidden]]
path = "tokio::spawn"
reason = "A spawned task outlives the decision cycle and its interleaving is not recorded. Concurrency inside a workflow must go through `ctx.race()` or the fan-out family, which record their branches."
[[forbidden]]
path = "spawn_blocking"
reason = "`tokio::task::spawn_blocking`; see `tokio::spawn`."
[[forbidden]]
path = "spawn_local"
reason = "`tokio::task::spawn_local`; see `tokio::spawn`."
[[forbidden]]
path = "thread::spawn"
reason = "`std::thread::spawn`; see `tokio::spawn`, and the spawned closure is never analyzed as part of the workflow."

# rustc trims `std::thread::spawn` and `tokio::spawn` to the bare segment
# `spawn` whenever nothing else in scope is called `spawn`, so the two-segment
# rows above fire only on the untrimmed spelling. These pin the bare suffix by
# the one thing both spawns have in common: a `JoinHandle` destination. The
# `dest_type` suffix match covers `std::thread::JoinHandle<T>` and
# `tokio::task::JoinHandle<T>` alike, and a single-segment row never fires on a
# callee that has a body in the analyzed set, so a user `fn spawn` is analyzed
# rather than flagged.
