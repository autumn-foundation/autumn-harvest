# harvest-verify corpus oracle (issue #962)
# ============================================================================
#
# This file is the SINGLE SOURCE OF TRUTH for what the analyzer must say about
# every `#[workflow]` fn in `autumn-harvest-verify/corpus/`. It is consumed by
# `autumn-harvest-verify/tests/corpus.rs`, which asserts a *bijection* between
# the rows here and the workflows actually present in the corpus sources — so a
# new corpus module without a row, or a row without a module, fails the build.
#
# ── Naming convention ───────────────────────────────────────────────────────
#
# Each corpus module file `src/wf_<case>.rs` contains exactly ONE `#[workflow]`
# fn, and that fn has THE SAME NAME as its module. The `workflow` key is
# therefore always three segments:
#
#     <rust_crate_name>::<module>::<fn>
#     e.g. harvest_verify_corpus_seeded::wf_uuid_in_helper::wf_uuid_in_helper
#
# `<rust_crate_name>` is the Cargo package name with hyphens replaced by
# underscores (what `rustc --emit=mir` prints and what
# `WorkflowVerdict::workflow` carries). The `crate` key below is the *Cargo
# package* name, hyphens intact, as passed to `cargo -p`.
#
# ── Schema ──────────────────────────────────────────────────────────────────
#
#   schema_version   int      Bumped when the key set changes.
#   [[workflow]]              One table per `#[workflow]` fn. Keys:
#     crate          string   Cargo package name (hyphenated).
#     workflow       string   Fully-qualified path, see above.
#     verdict        string   "proven-deterministic" | "nondeterminism-found"
#                             | "unknown". Matches `Verdict::name()`.
#     mechanism      string   What actually diverges, in one line.
#     launder        string   Why the syntactic layer (HVG001-HVG011 +
#                             DET001-DET011) reports nothing. Every seeded row
#                             must name a concrete structural reason, not "it is
#                             in another file".
#     trace_contains array    Substrings that must ALL appear somewhere in the
#                             finding — its hops' `step`, its `source.what`, its
#                             `sink.what` or its `message`. Helper fn names,
#                             static names, and `[T := HashMap` for the generic
#                             case. Only meaningful for "nondeterminism-found";
#                             empty otherwise.
#     boundary       string   Kebab-case `BoundaryKind::name()` that MUST be
#                             among the reported boundaries. Required for
#                             "unknown", absent otherwise.
#     mandatory      string   Optional AC3 tag, "AC3-1".."AC3-5", marking the
#                             five cases the acceptance criterion names
#                             explicitly.
#
# ── Counts the test enforces ────────────────────────────────────────────────
#
#   >= 22 rows with verdict "nondeterminism-found"  (the seeded corpus; AC3 and
#         the >= 90% detection metric are computed against exactly these)
#   >= 10 rows with verdict "proven-deterministic"  (the false-positive corpus)
#   >=  4 rows with verdict "unknown"               (the honesty corpus)
#   all of AC3-1 .. AC3-5 present exactly once
#
# `unknown` NEVER counts as a detection. A seeded row that comes back `unknown`
# is a miss, and the detection ratio is computed live from the run — never
# hard-coded.

schema_version = 1

