[package]
name = "harvest-verify-corpus-clean"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Seeded determinism corpus for harvest-verify (issue #962); deliberately pathological code, not a library"

[lib]
path = "src/lib.rs"

[dependencies]
autumn-harvest = { version = "0.9.0", path = "../../../autumn-harvest", default-features = false, features = ["testing"] }
harvest-verify-corpus-helpers = { version = "0.9.0", path = "../helpers" }
harvest-verify-corpus-helpers-deep = { version = "0.9.0", path = "../helpers-deep" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

# Verifier fixture code. Each function has the exact shape that
# `corpus/expectations.toml` pins, so a rewrite to suit a style lint
# changes the MIR under test. Style, complexity and perf lints only
# suggest rewrites, so they are off. Correctness and suspicious stay on.
[lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
# C15 passes `Vec::new` as a fn item to `map_or_else`. That shape is the case
# under test, so `unwrap_or_else` would remove it.
unnecessary_option_map_or_else = "allow"
