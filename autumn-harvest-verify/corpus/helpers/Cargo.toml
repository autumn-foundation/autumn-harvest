[package]
name = "harvest-verify-corpus-helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Seeded determinism corpus for harvest-verify (issue #962); deliberately pathological code, not a library"

[lib]
path = "src/lib.rs"

[dependencies]
harvest-verify-corpus-helpers-deep = { version = "0.9.0", path = "../helpers-deep" }
rand = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

# Verifier fixture code. Each function has the exact shape that
# `corpus/expectations.toml` pins, so a rewrite to suit a style lint
# changes the MIR under test. Style, complexity and perf lints only
# suggest rewrites, so they are off. Correctness and suspicious stay on.
[lints.clippy]
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
