[package]
name = "harvest-verify-corpus-seeded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Seeded determinism corpus for harvest-verify (issue #962); deliberately pathological code, not a library"

[lib]
path = "src/lib.rs"

[dependencies]
autumn-harvest = { version = "0.6.0", path = "../../../autumn-harvest", default-features = false, features = ["testing"] }
harvest-verify-corpus-helpers = { version = "0.6.0", path = "../helpers" }
harvest-verify-corpus-helpers-deep = { version = "0.6.0", path = "../helpers-deep" }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true }
