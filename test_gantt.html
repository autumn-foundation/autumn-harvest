<!DOCTYPE html>
<html>
<body>
  <pre class="mermaid">
    gantt
      dateFormat X
      axisFormat %S

      section Tasks
      activity_a :t0, 0, 2s
      activity_b :t1, 2, 5s
  </pre>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });
  </script>
</body>
</html>
