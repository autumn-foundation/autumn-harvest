# promtool unit tests for the SLO burn-rate pack (issue #1816).
#
# Run: promtool test rules docs/alerts/slo-pack-v0.1.0.test.yml
#
# Each alert has a case that fires and a case that stays silent.
# Series values use promtool notation: 'a+bxn' is a, a+b, ..., a+n*b.
# 'axn' is a, n+1 times. The interval is 1m, so sample i is at minute i.
#
# Rules evaluate every 5m. That keeps the 3-day cases fast in CI.
# The alerts have no `for` clause, so the step does not change a result.

rule_files:
  - slo-pack-v0.1.0.rules.yml

evaluation_interval: 5m

tests:
  # ---------------------------------------------------------------- workflow_task
  # Objective 99.9%. Budget 0.1%. Thresholds: 1.44% / 0.6% / 0.1%.

  - name: workflow_task fast burn pages
    # Healthy for 90m, then failed cycles reach 20% of the 1h total.
    interval: 1m
    input_series:
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="completed"}'
        values: '0+1000x120'
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="failed"}'
        values: '0x90 500+500x29'
    alert_rule_test:
      - eval_time: 120m
        alertname: harvest_slo_workflow_task_burn_1h
        exp_alerts:
          - exp_labels: {severity: page, slo: workflow_task, window: 1h}
            exp_annotations: &workflow_task_burn_1h
              summary: "Workflow-task SLO: fast burn (14.4x budget)."
              description: "The workflow-task error ratio is over 14.4x budget in the 1h and 5m windows. At this rate, the 30-day budget runs out in about 2 days."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_workflow_task

  - name: workflow_task fast burn resets when the short window recovers
    # Failures stop 10m before the eval. The 1h ratio is high; the 5m ratio is 0.
    interval: 1m
    input_series:
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="completed"}'
        values: '0+1000x120'
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="failed"}'
        values: '0x60 500+500x49 25000x9'
    alert_rule_test:
      - eval_time: 120m
        alertname: harvest_slo_workflow_task_burn_1h
        exp_alerts: []

  - name: workflow_task fast burn pages when every task times out
    # No cycle completes, so no duration series exists. Timeouts alone must page.
    interval: 1m
    input_series:
      - series: 'harvest_workflow_task_timeout_total{workflow="billing",queue="default"}'
        values: '0+10x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: harvest_slo_workflow_task_burn_1h
        exp_alerts:
          - exp_labels: {severity: page, slo: workflow_task, window: 1h}
            exp_annotations: *workflow_task_burn_1h

  - name: workflow_task zero traffic stays silent
    interval: 1m
    input_series:
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="completed"}'
        values: '5x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: harvest_slo_workflow_task_burn_1h
        exp_alerts: []

  - name: workflow_task slow burn pages
    # A steady 0.8% error ratio: under 1.44%, over 0.6%.
    interval: 1m
    input_series:
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="completed"}'
        values: '0+992x420'
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="failed"}'
        values: '0+8x420'
    alert_rule_test:
      - eval_time: 420m
        alertname: harvest_slo_workflow_task_burn_1h
        exp_alerts: []
      - eval_time: 420m
        alertname: harvest_slo_workflow_task_burn_6h
        exp_alerts:
          - exp_labels: {severity: page, slo: workflow_task, window: 6h}
            exp_annotations:
              summary: "Workflow-task SLO: slow burn (6x budget)."
              description: "The workflow-task error ratio is over 6x budget in the 6h and 30m windows. At this rate, the 30-day budget runs out in 5 days."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_workflow_task

  - name: workflow_task budget burn opens a ticket
    # A steady 0.2% error ratio for 3 days: under 0.6%, over 0.1%.
    interval: 1m
    input_series:
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="completed"}'
        values: '0+998x4320'
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="failed"}'
        values: '0+2x4320'
    alert_rule_test:
      - eval_time: 3d
        alertname: harvest_slo_workflow_task_burn_6h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_workflow_task_burn_3d
        exp_alerts:
          - exp_labels: {severity: ticket, slo: workflow_task, window: 3d}
            exp_annotations:
              summary: "Workflow-task SLO: budget burn (1x budget)."
              description: "The workflow-task error ratio is over 1x budget in the 3d and 6h windows. At this rate, the 30-day budget runs out before the period ends."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_workflow_task

  - name: workflow_task inside budget stays silent
    # A steady 0.05% error ratio for 3 days.
    interval: 1m
    input_series:
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="completed"}'
        values: '0+1999x4320'
      - series: 'harvest_workflow_duration_count{workflow="billing",queue="default",status="failed"}'
        values: '0+1x4320'
    alert_rule_test:
      - eval_time: 3d
        alertname: harvest_slo_workflow_task_burn_1h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_workflow_task_burn_6h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_workflow_task_burn_3d
        exp_alerts: []

  # ------------------------------------------------------------ schedule_to_start
  # Objective: 99% of tasks start within 5 s. Budget 1%.
  # Thresholds: 14.4% / 6% / 1% of tasks slower than 5 s.

  - name: schedule_to_start fast burn pages
    # Half of the tasks in the last hour take more than 5 s.
    # The le="0.5" and le="+Inf" buckets must not match the 5 s matcher.
    interval: 1m
    input_series:
      - series: 'harvest_queue_schedule_to_start_count{queue="default"}'
        values: '0+100x120'
      - series: 'harvest_queue_schedule_to_start_bucket{queue="default",le="0.5"}'
        values: '0+40x120'
      - series: 'harvest_queue_schedule_to_start_bucket{queue="default",le="5"}'
        values: '0+100x60 6050+50x59'
      - series: 'harvest_queue_schedule_to_start_bucket{queue="default",le="+Inf"}'
        values: '0+100x120'
    alert_rule_test:
      - eval_time: 120m
        alertname: harvest_slo_schedule_to_start_burn_1h
        exp_alerts:
          - exp_labels: {severity: page, slo: schedule_to_start, window: 1h}
            exp_annotations: &schedule_to_start_burn_1h
              summary: "Schedule-to-start SLO: fast burn (14.4x budget)."
              description: "The share of tasks that wait over 5 s to start is over 14.4x budget in the 1h and 5m windows. At this rate, the 30-day budget runs out in about 2 days."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_schedule_to_start

  - name: schedule_to_start fast burn pages with Prometheus 3 bucket labels
    # Prometheus 3 stores le="5" as le="5.0". The SLI must still match.
    interval: 1m
    input_series:
      - series: 'harvest_queue_schedule_to_start_count{queue="default"}'
        values: '0+100x120'
      - series: 'harvest_queue_schedule_to_start_bucket{queue="default",le="5.0"}'
        values: '0+100x60 6050+50x59'
    alert_rule_test:
      - eval_time: 120m
        alertname: harvest_slo_schedule_to_start_burn_1h
        exp_alerts:
          - exp_labels: {severity: page, slo: schedule_to_start, window: 1h}
            exp_annotations: *schedule_to_start_burn_1h

  - name: schedule_to_start slow burn pages
    # A steady 8% of tasks over 5 s: under 14.4%, over 6%.
    interval: 1m
    input_series:
      - series: 'harvest_queue_schedule_to_start_count{queue="default"}'
        values: '0+100x420'
      - series: 'harvest_queue_schedule_to_start_bucket{queue="default",le="5"}'
        values: '0+92x420'
    alert_rule_test:
      - eval_time: 420m
        alertname: harvest_slo_schedule_to_start_burn_1h
        exp_alerts: []
      - eval_time: 420m
        alertname: harvest_slo_schedule_to_start_burn_6h
        exp_alerts:
          - exp_labels: {severity: page, slo: schedule_to_start, window: 6h}
            exp_annotations:
              summary: "Schedule-to-start SLO: slow burn (6x budget)."
              description: "The share of tasks that wait over 5 s to start is over 6x budget in the 6h and 30m windows. At this rate, the 30-day budget runs out in 5 days."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_schedule_to_start

  - name: schedule_to_start budget burn opens a ticket
    # A steady 2% of tasks over 5 s for 3 days: under 6%, over 1%.
    interval: 1m
    input_series:
      - series: 'harvest_queue_schedule_to_start_count{queue="default"}'
        values: '0+100x4320'
      - series: 'harvest_queue_schedule_to_start_bucket{queue="default",le="5"}'
        values: '0+98x4320'
    alert_rule_test:
      - eval_time: 3d
        alertname: harvest_slo_schedule_to_start_burn_6h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_schedule_to_start_burn_3d
        exp_alerts:
          - exp_labels: {severity: ticket, slo: schedule_to_start, window: 3d}
            exp_annotations:
              summary: "Schedule-to-start SLO: budget burn (1x budget)."
              description: "The share of tasks that wait over 5 s to start is over 1x budget in the 3d and 6h windows. At this rate, the 30-day budget runs out before the period ends."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_schedule_to_start

  - name: schedule_to_start inside budget stays silent
    # A steady 0.5% of tasks over 5 s for 3 days.
    interval: 1m
    input_series:
      - series: 'harvest_queue_schedule_to_start_count{queue="default"}'
        values: '0+200x4320'
      - series: 'harvest_queue_schedule_to_start_bucket{queue="default",le="5"}'
        values: '0+199x4320'
    alert_rule_test:
      - eval_time: 3d
        alertname: harvest_slo_schedule_to_start_burn_1h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_schedule_to_start_burn_6h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_schedule_to_start_burn_3d
        exp_alerts: []

  # ----------------------------------------------------------------------- canary
  # Objective 99%. Budget 1%. Thresholds: 14.4% / 6% / 1%.

  - name: canary fast burn pages
    # One probe a minute. Every probe fails for the last 30m.
    interval: 1m
    input_series:
      - series: 'harvest_canary_success_total{queue="default",shard="0"}'
        values: '0+1x90 90x29'
      - series: 'harvest_canary_failure_total{queue="default",shard="0"}'
        values: '0x90 1+1x29'
    alert_rule_test:
      - eval_time: 120m
        alertname: harvest_slo_canary_burn_1h
        exp_alerts:
          - exp_labels: {severity: page, slo: canary, window: 1h}
            exp_annotations: &canary_burn_1h
              summary: "Canary SLO: fast burn (14.4x budget)."
              description: "The canary probe failure ratio is over 14.4x budget in the 1h and 5m windows. At this rate, the 30-day budget runs out in about 2 days."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_canary

  - name: canary fast burn pages when no probe ever succeeds
    # No success series exists. Failures alone must page.
    interval: 1m
    input_series:
      - series: 'harvest_canary_failure_total{queue="default",shard="0"}'
        values: '0+1x30'
    alert_rule_test:
      - eval_time: 30m
        alertname: harvest_slo_canary_burn_1h
        exp_alerts:
          - exp_labels: {severity: page, slo: canary, window: 1h}
            exp_annotations: *canary_burn_1h

  - name: canary slow burn pages
    # 50 probes a minute across queues and shards; 8% fail.
    interval: 1m
    input_series:
      - series: 'harvest_canary_success_total{queue="default",shard="0"}'
        values: '0+46x420'
      - series: 'harvest_canary_failure_total{queue="default",shard="0"}'
        values: '0+4x420'
    alert_rule_test:
      - eval_time: 420m
        alertname: harvest_slo_canary_burn_1h
        exp_alerts: []
      - eval_time: 420m
        alertname: harvest_slo_canary_burn_6h
        exp_alerts:
          - exp_labels: {severity: page, slo: canary, window: 6h}
            exp_annotations:
              summary: "Canary SLO: slow burn (6x budget)."
              description: "The canary probe failure ratio is over 6x budget in the 6h and 30m windows. At this rate, the 30-day budget runs out in 5 days."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_canary

  - name: canary budget burn opens a ticket
    # 2% of probes fail for 3 days: under 6%, over 1%.
    interval: 1m
    input_series:
      - series: 'harvest_canary_success_total{queue="default",shard="0"}'
        values: '0+49x4320'
      - series: 'harvest_canary_failure_total{queue="default",shard="0"}'
        values: '0+1x4320'
    alert_rule_test:
      - eval_time: 3d
        alertname: harvest_slo_canary_burn_6h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_canary_burn_3d
        exp_alerts:
          - exp_labels: {severity: ticket, slo: canary, window: 3d}
            exp_annotations:
              summary: "Canary SLO: budget burn (1x budget)."
              description: "The canary probe failure ratio is over 1x budget in the 3d and 6h windows. At this rate, the 30-day budget runs out before the period ends."
              runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_canary

  - name: canary inside budget stays silent
    # 0.5% of probes fail for 3 days.
    interval: 1m
    input_series:
      - series: 'harvest_canary_success_total{queue="default",shard="0"}'
        values: '0+199x4320'
      - series: 'harvest_canary_failure_total{queue="default",shard="0"}'
        values: '0+1x4320'
    alert_rule_test:
      - eval_time: 3d
        alertname: harvest_slo_canary_burn_1h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_canary_burn_6h
        exp_alerts: []
      - eval_time: 3d
        alertname: harvest_slo_canary_burn_3d
        exp_alerts: []
