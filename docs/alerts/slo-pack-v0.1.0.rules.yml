# Harvest SLO burn-rate pack v0.1.0 (issue #1816). Optional.
#
# Multi-window, multi-burn-rate alerts from the Google SRE Workbook,
# chapter "Alerting on SLOs". The budget period is 30 days.
#
#   Tier     Burn   Long  Short  Budget spent  Route
#   burn_1h  14.4x  1h    5m     2%            page
#   burn_6h  6x     6h    30m    5%            page
#   burn_3d  1x     3d    6h     10%           ticket
#
# To tune an objective, edit its harvest:slo_objective:ratio record.
# Docs: docs/alerts/slo.md. Tests: slo-pack-v0.1.0.test.yml.

groups:
  # Workflow-task success. Objective: 99.9% of workflow tasks succeed.
  # A workflow task is one executor cycle. It fails when the cycle ends
  # the run as failed, or when it times out and the worker abandons it.
  - name: harvest-slo-workflow-task
    rules:
      # The objective comes first. Later rules in the group read it.
      - record: harvest:slo_objective:ratio
        expr: vector(0.999)
        labels:
          slo: workflow_task

      - record: harvest:workflow_task_error:ratio_rate5m
        expr: |
          (
            (sum(rate(harvest_workflow_duration_count{status="failed"}[5m])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[5m])) or vector(0))
          )
          /
          (
            (sum(rate(harvest_workflow_duration_count[5m])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[5m])) or vector(0))
          )

      - record: harvest:workflow_task_error:ratio_rate30m
        expr: |
          (
            (sum(rate(harvest_workflow_duration_count{status="failed"}[30m])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[30m])) or vector(0))
          )
          /
          (
            (sum(rate(harvest_workflow_duration_count[30m])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[30m])) or vector(0))
          )

      - record: harvest:workflow_task_error:ratio_rate1h
        expr: |
          (
            (sum(rate(harvest_workflow_duration_count{status="failed"}[1h])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[1h])) or vector(0))
          )
          /
          (
            (sum(rate(harvest_workflow_duration_count[1h])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[1h])) or vector(0))
          )

      - record: harvest:workflow_task_error:ratio_rate6h
        expr: |
          (
            (sum(rate(harvest_workflow_duration_count{status="failed"}[6h])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[6h])) or vector(0))
          )
          /
          (
            (sum(rate(harvest_workflow_duration_count[6h])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[6h])) or vector(0))
          )

      - record: harvest:workflow_task_error:ratio_rate3d
        expr: |
          (
            (sum(rate(harvest_workflow_duration_count{status="failed"}[3d])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[3d])) or vector(0))
          )
          /
          (
            (sum(rate(harvest_workflow_duration_count[3d])) or vector(0))
            + (sum(rate(harvest_workflow_task_timeout_total[3d])) or vector(0))
          )

      - alert: harvest_slo_workflow_task_burn_1h
        expr: |
          harvest:workflow_task_error:ratio_rate1h > 14.4 * (1 - scalar(harvest:slo_objective:ratio{slo="workflow_task"}))
          and
          harvest:workflow_task_error:ratio_rate5m > 14.4 * (1 - scalar(harvest:slo_objective:ratio{slo="workflow_task"}))
        labels:
          severity: page
          slo: workflow_task
          window: 1h
        annotations:
          summary: "Workflow-task SLO: fast burn (14.4x budget)."
          description: "The workflow-task error ratio is over 14.4x budget in the 1h and 5m windows. At this rate, the 30-day budget runs out in about 2 days."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_workflow_task

      - alert: harvest_slo_workflow_task_burn_6h
        expr: |
          harvest:workflow_task_error:ratio_rate6h > 6 * (1 - scalar(harvest:slo_objective:ratio{slo="workflow_task"}))
          and
          harvest:workflow_task_error:ratio_rate30m > 6 * (1 - scalar(harvest:slo_objective:ratio{slo="workflow_task"}))
        labels:
          severity: page
          slo: workflow_task
          window: 6h
        annotations:
          summary: "Workflow-task SLO: slow burn (6x budget)."
          description: "The workflow-task error ratio is over 6x budget in the 6h and 30m windows. At this rate, the 30-day budget runs out in 5 days."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_workflow_task

      - alert: harvest_slo_workflow_task_burn_3d
        expr: |
          harvest:workflow_task_error:ratio_rate3d > 1 * (1 - scalar(harvest:slo_objective:ratio{slo="workflow_task"}))
          and
          harvest:workflow_task_error:ratio_rate6h > 1 * (1 - scalar(harvest:slo_objective:ratio{slo="workflow_task"}))
        labels:
          severity: ticket
          slo: workflow_task
          window: 3d
        annotations:
          summary: "Workflow-task SLO: budget burn (1x budget)."
          description: "The workflow-task error ratio is over 1x budget in the 3d and 6h windows. At this rate, the 30-day budget runs out before the period ends."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_workflow_task

  # Schedule-to-start latency. Objective: 99% of tasks start within 5 s.
  # The SLI is the share of tasks slower than the 5 s bucket bound.
  # It needs bucketed histograms. See docs/telemetry.md.
  - name: harvest-slo-schedule-to-start
    rules:
      # The objective comes first. Later rules in the group read it.
      - record: harvest:slo_objective:ratio
        expr: vector(0.99)
        labels:
          slo: schedule_to_start

      - record: harvest:schedule_to_start_slow:ratio_rate5m
        expr: |
          (
            sum(rate(harvest_queue_schedule_to_start_count[5m]))
            - sum(rate(harvest_queue_schedule_to_start_bucket{le=~"5(\\.0+)?"}[5m]))
          )
          /
          sum(rate(harvest_queue_schedule_to_start_count[5m]))

      - record: harvest:schedule_to_start_slow:ratio_rate30m
        expr: |
          (
            sum(rate(harvest_queue_schedule_to_start_count[30m]))
            - sum(rate(harvest_queue_schedule_to_start_bucket{le=~"5(\\.0+)?"}[30m]))
          )
          /
          sum(rate(harvest_queue_schedule_to_start_count[30m]))

      - record: harvest:schedule_to_start_slow:ratio_rate1h
        expr: |
          (
            sum(rate(harvest_queue_schedule_to_start_count[1h]))
            - sum(rate(harvest_queue_schedule_to_start_bucket{le=~"5(\\.0+)?"}[1h]))
          )
          /
          sum(rate(harvest_queue_schedule_to_start_count[1h]))

      - record: harvest:schedule_to_start_slow:ratio_rate6h
        expr: |
          (
            sum(rate(harvest_queue_schedule_to_start_count[6h]))
            - sum(rate(harvest_queue_schedule_to_start_bucket{le=~"5(\\.0+)?"}[6h]))
          )
          /
          sum(rate(harvest_queue_schedule_to_start_count[6h]))

      - record: harvest:schedule_to_start_slow:ratio_rate3d
        expr: |
          (
            sum(rate(harvest_queue_schedule_to_start_count[3d]))
            - sum(rate(harvest_queue_schedule_to_start_bucket{le=~"5(\\.0+)?"}[3d]))
          )
          /
          sum(rate(harvest_queue_schedule_to_start_count[3d]))

      - alert: harvest_slo_schedule_to_start_burn_1h
        expr: |
          harvest:schedule_to_start_slow:ratio_rate1h > 14.4 * (1 - scalar(harvest:slo_objective:ratio{slo="schedule_to_start"}))
          and
          harvest:schedule_to_start_slow:ratio_rate5m > 14.4 * (1 - scalar(harvest:slo_objective:ratio{slo="schedule_to_start"}))
        labels:
          severity: page
          slo: schedule_to_start
          window: 1h
        annotations:
          summary: "Schedule-to-start SLO: fast burn (14.4x budget)."
          description: "The share of tasks that wait over 5 s to start is over 14.4x budget in the 1h and 5m windows. At this rate, the 30-day budget runs out in about 2 days."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_schedule_to_start

      - alert: harvest_slo_schedule_to_start_burn_6h
        expr: |
          harvest:schedule_to_start_slow:ratio_rate6h > 6 * (1 - scalar(harvest:slo_objective:ratio{slo="schedule_to_start"}))
          and
          harvest:schedule_to_start_slow:ratio_rate30m > 6 * (1 - scalar(harvest:slo_objective:ratio{slo="schedule_to_start"}))
        labels:
          severity: page
          slo: schedule_to_start
          window: 6h
        annotations:
          summary: "Schedule-to-start SLO: slow burn (6x budget)."
          description: "The share of tasks that wait over 5 s to start is over 6x budget in the 6h and 30m windows. At this rate, the 30-day budget runs out in 5 days."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_schedule_to_start

      - alert: harvest_slo_schedule_to_start_burn_3d
        expr: |
          harvest:schedule_to_start_slow:ratio_rate3d > 1 * (1 - scalar(harvest:slo_objective:ratio{slo="schedule_to_start"}))
          and
          harvest:schedule_to_start_slow:ratio_rate6h > 1 * (1 - scalar(harvest:slo_objective:ratio{slo="schedule_to_start"}))
        labels:
          severity: ticket
          slo: schedule_to_start
          window: 3d
        annotations:
          summary: "Schedule-to-start SLO: budget burn (1x budget)."
          description: "The share of tasks that wait over 5 s to start is over 1x budget in the 3d and 6h windows. At this rate, the 30-day budget runs out before the period ends."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_schedule_to_start

  # Synthetic canary success. Objective: 99% of canary probes succeed.
  # It needs the opt-in synthetic liveness canary (issue #796).
  - name: harvest-slo-canary
    rules:
      # The objective comes first. Later rules in the group read it.
      - record: harvest:slo_objective:ratio
        expr: vector(0.99)
        labels:
          slo: canary

      - record: harvest:canary_error:ratio_rate5m
        expr: |
          (sum(rate(harvest_canary_failure_total[5m])) or vector(0))
          /
          (
            (sum(rate(harvest_canary_success_total[5m])) or vector(0))
            + (sum(rate(harvest_canary_failure_total[5m])) or vector(0))
          )

      - record: harvest:canary_error:ratio_rate30m
        expr: |
          (sum(rate(harvest_canary_failure_total[30m])) or vector(0))
          /
          (
            (sum(rate(harvest_canary_success_total[30m])) or vector(0))
            + (sum(rate(harvest_canary_failure_total[30m])) or vector(0))
          )

      - record: harvest:canary_error:ratio_rate1h
        expr: |
          (sum(rate(harvest_canary_failure_total[1h])) or vector(0))
          /
          (
            (sum(rate(harvest_canary_success_total[1h])) or vector(0))
            + (sum(rate(harvest_canary_failure_total[1h])) or vector(0))
          )

      - record: harvest:canary_error:ratio_rate6h
        expr: |
          (sum(rate(harvest_canary_failure_total[6h])) or vector(0))
          /
          (
            (sum(rate(harvest_canary_success_total[6h])) or vector(0))
            + (sum(rate(harvest_canary_failure_total[6h])) or vector(0))
          )

      - record: harvest:canary_error:ratio_rate3d
        expr: |
          (sum(rate(harvest_canary_failure_total[3d])) or vector(0))
          /
          (
            (sum(rate(harvest_canary_success_total[3d])) or vector(0))
            + (sum(rate(harvest_canary_failure_total[3d])) or vector(0))
          )

      - alert: harvest_slo_canary_burn_1h
        expr: |
          harvest:canary_error:ratio_rate1h > 14.4 * (1 - scalar(harvest:slo_objective:ratio{slo="canary"}))
          and
          harvest:canary_error:ratio_rate5m > 14.4 * (1 - scalar(harvest:slo_objective:ratio{slo="canary"}))
        labels:
          severity: page
          slo: canary
          window: 1h
        annotations:
          summary: "Canary SLO: fast burn (14.4x budget)."
          description: "The canary probe failure ratio is over 14.4x budget in the 1h and 5m windows. At this rate, the 30-day budget runs out in about 2 days."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_canary

      - alert: harvest_slo_canary_burn_6h
        expr: |
          harvest:canary_error:ratio_rate6h > 6 * (1 - scalar(harvest:slo_objective:ratio{slo="canary"}))
          and
          harvest:canary_error:ratio_rate30m > 6 * (1 - scalar(harvest:slo_objective:ratio{slo="canary"}))
        labels:
          severity: page
          slo: canary
          window: 6h
        annotations:
          summary: "Canary SLO: slow burn (6x budget)."
          description: "The canary probe failure ratio is over 6x budget in the 6h and 30m windows. At this rate, the 30-day budget runs out in 5 days."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_canary

      - alert: harvest_slo_canary_burn_3d
        expr: |
          harvest:canary_error:ratio_rate3d > 1 * (1 - scalar(harvest:slo_objective:ratio{slo="canary"}))
          and
          harvest:canary_error:ratio_rate6h > 1 * (1 - scalar(harvest:slo_objective:ratio{slo="canary"}))
        labels:
          severity: ticket
          slo: canary
          window: 3d
        annotations:
          summary: "Canary SLO: budget burn (1x budget)."
          description: "The canary probe failure ratio is over 1x budget in the 3d and 6h windows. At this rate, the 30-day budget runs out before the period ends."
          runbook_url: docs/runbooks/harvest-alerts.md#harvest_slo_canary
