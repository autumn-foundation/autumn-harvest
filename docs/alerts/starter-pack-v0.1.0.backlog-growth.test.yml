# promtool unit tests for harvest_queue_backlog_growth (issue #2356).
#
# Run: promtool test rules docs/alerts/starter-pack-v0.1.0.backlog-growth.test.yml
#
# The depth gauge stops at 10,000. Below the cap the rule fires on depth
# growth. At the cap the gauge shows no growth, so the rule fires on the level:
# the gauge holds at the cap for the whole window. A paused queue is left out,
# because harvest_queue_paused_too_long covers it. The age gauge plays no part,
# so several cases give it values that once changed the result.
# Series values use promtool notation: 'a+bxn' is a, a+b, ..., a+n*b.
# 'axn' is a, n+1 times. '_xn' is n missing samples. The interval is 1m.

rule_files:
  - starter-pack-v0.1.0.backlog-growth.rules.yml

evaluation_interval: 1m

tests:
  - name: depth growth below the cap fires
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}

  - name: a steady depth below the cap stays silent
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '5000x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts: []

  - name: at the cap, a backlog with a growing oldest age fires
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x40'
      - series: 'harvest_queue_oldest_pending_age{queue="default"}'
        values: '0+60x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}

  # One tenant is gated and piles up. Other rows flow, so the oldest claimable
  # row stays young (issue #2356 review).
  - name: at the cap, a partly gated backlog with a young oldest row fires
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x40'
      - series: 'harvest_queue_oldest_pending_age{queue="default"}'
        values: '0.4x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}

  # A gate that opens for a moment shows the real age in one sample, then 0.
  - name: at the cap, an intermittently claimable backlog fires
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x40'
      - series: 'harvest_queue_oldest_pending_age{queue="default"}'
        values: '0x10 900 0x10 1500 0x10 2100 0x6'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}

  - name: at the cap, a backlog with no claimable row fires
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x40'
      - series: 'harvest_queue_oldest_pending_age{queue="default"}'
        values: '0x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}

  # The gauge cannot tell growth from a deep backlog that drains, so the level
  # fires whatever the age does (a known limit, see the runbook).
  - name: at the cap, a draining backlog fires while it stays at the cap
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x40'
      - series: 'harvest_queue_oldest_pending_age{queue="default"}'
        values: '3000-60x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}

  - name: a backlog that drains below the cap clears
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x20 9500-500x20'
    alert_rule_test:
      - eval_time: 18m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts: []

  # A deliberate queue pause has its own alert, harvest_queue_paused_too_long.
  - name: at the cap, a paused queue stays silent
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x40'
      - series: 'harvest_queue_oldest_pending_age{queue="default"}'
        values: '0x40'
      - series: 'harvest_queue_paused{queue="default"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts: []

  - name: a pause on another queue does not silence this one
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '10000x40'
      - series: 'harvest_queue_paused{queue="default"}'
        values: '0x40'
      - series: 'harvest_queue_paused{queue="payments"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}

  # Two deployments share one Prometheus and both name a queue "default". A
  # pause in one must not silence the other (issue #2356 review).
  - name: a pause of the same queue in another deployment does not silence this one
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default", job="billing"}'
        values: '10000x40'
      - series: 'harvest_queue_paused{queue="default", job="billing"}'
        values: '0x40'
      - series: 'harvest_queue_depth{queue="default", job="search"}'
        values: '3000x40'
      - series: 'harvest_queue_paused{queue="default", job="search"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default, job: billing}

  # Each replica exports both gauges, so each one matches its own pause.
  - name: a pause seen by every replica silences each one
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default", instance="w1"}'
        values: '10000x40'
      - series: 'harvest_queue_paused{queue="default", instance="w1"}'
        values: '1x40'
      - series: 'harvest_queue_depth{queue="default", instance="w2"}'
        values: '10000x40'
      - series: 'harvest_queue_paused{queue="default", instance="w2"}'
        values: '1x40'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts: []

  # A new series, as after a rollout, holds the cap for 5 minutes only.
  - name: a new series at the cap waits out the for clause
    interval: 1m
    input_series:
      - series: 'harvest_queue_depth{queue="default"}'
        values: '_x30 10000x10'
    alert_rule_test:
      - eval_time: 35m
        alertname: harvest_queue_backlog_growth
        exp_alerts: []
      - eval_time: 41m
        alertname: harvest_queue_backlog_growth
        exp_alerts:
          - exp_labels: {severity: ticket, queue: default}
