# Ledger profiles for `autumn-harvest-sqlite/src/wake.rs`. See `docs/ledger/README.md`.
# A tenant driver reads it at an idle point after work, or after a known
# deadline passed. A quiet idle point skips it.

["next_wake_at"]
driver = "per_tick"
backend = ["sqlite"]
kind = ["read"]
tables = ["harvest_executions", "harvest_schedules", "harvest_tasks", "harvest_timers"]
measured = "unmeasured"
