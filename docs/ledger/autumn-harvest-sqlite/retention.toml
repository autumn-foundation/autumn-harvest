# Ledger profiles for `autumn-harvest-sqlite/src/retention.rs`. See `docs/ledger/README.md`.

["delete_runs"]
driver = "per_tick"
backend = ["sqlite"]
kind = ["read", "write"]
tables = ["harvest_events", "harvest_tasks", "harvest_timers", "harvest_signals", "harvest_activity_attempts", "harvest_llm_ledger", "harvest_workflow_logs", "harvest_executions"]
measured = "unmeasured"

["purge_scope"]
driver = "per_tick"
backend = ["sqlite"]
kind = ["read"]
tables = ["harvest_executions"]
measured = "unmeasured"
