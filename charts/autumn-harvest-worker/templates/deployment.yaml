{{- /* `profile` is the only profile selector. The init check reads it, so `env` must not override it. */}}
{{- range .Values.env }}
{{- if has .name (list "AUTUMN_ENV" "AUTUMN_PROFILE") }}
{{- fail (printf "env: do not set %s. Set `profile`: the migration check reads it." .name) }}
{{- end }}
{{- end }}
{{- $floor := add .Values.drain.preStopSleepSeconds .Values.drain.shutdownSeconds 10 }}
{{- if lt (int .Values.drain.terminationGracePeriodSeconds) (int $floor) }}
{{- fail (printf "drain.terminationGracePeriodSeconds must be at least %d (preStopSleepSeconds + shutdownSeconds + 10)" (int $floor)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "harvest-worker.fullname" . }}
  labels:
    {{- include "harvest-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ int .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    {{- with .Values.strategy.rollingUpdate }}
    rollingUpdate:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "harvest-worker.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "harvest-worker.workerSelectorLabels" . | nindent 8 }}
        {{- /* A selector key here would detach the pods from the Service. */}}
        {{- with omit .Values.podLabels "app.kubernetes.io/name" "app.kubernetes.io/instance" "app.kubernetes.io/component" }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "harvest-worker.serviceAccountName" . }}
      # The worker does not call the Kubernetes API.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ int .Values.drain.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- /* In `dev`, the runner applies the migrations itself after this check. */}}
      {{- if and .Values.migrations.checkOnStart (ne .Values.profile "dev") }}
      initContainers:
        - name: check-migrations
          image: {{ include "harvest-worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/harvest
            - migrate
            - status
            - --check
            {{- if .Values.migrations.includeDirs }}
            {{- include "harvest-worker.includeDirs" . | trim | nindent 12 }}
            {{- end }}
          env:
            {{- include "harvest-worker.checkEnv" . | nindent 12 }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "harvest-worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int .Values.containerPort }}
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "harvest-worker.databaseSecret" . }}
                  key: {{ .Values.database.secretKey }}
            - name: AUTUMN_PROFILE
              value: {{ .Values.profile | quote }}
            - name: STANDALONE_RUNNER_ADDR
              value: {{ printf "0.0.0.0:%d" (int .Values.containerPort) | quote }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* The runner answers HTTP only after the runtime starts. */}}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: {{ printf "%s/health/live" .Values.probes.basePath }}
              port: http
            {{- toYaml (omit .Values.probes.startup "enabled") | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ printf "%s/health/live" .Values.probes.basePath }}
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ printf "%s/health/ready" .Values.probes.basePath }}
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.drain.preStopSleepSeconds }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The root filesystem is read-only.
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
