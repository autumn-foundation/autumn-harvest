[package]
name = "autumn-harvest-cli"
description = "CLI client for the autumn-harvest management API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "durable", "cli", "orchestration", "autumn"]
categories = ["command-line-utilities", "asynchronous"]
# README.md, examples/quickstart/README.md, docs/getting-started/10-operations.md
# and docs/runbooks/ all invoke this package as plain `cargo run -p
# autumn-harvest-cli -- ...` — no `--bin`. Without default-run, the
# harvest-replay [[bin]] below makes every one of those commands ambiguous
# and fatal (see scripts/check-default-run.sh).
default-run = "harvest"

[dependencies]
# `db` is enabled UNCONDITIONALLY (not behind a CLI Cargo feature) so every CI
# lint/test leg covers `backup verify` (issue #943). Diesel's `postgres_backend`
# and diesel-async/tokio-postgres are pure Rust, so the Windows/macOS CI legs
# build it without a system libpq/OpenSSL, and the workspace already compiles
# diesel for the core crate.
autumn-harvest = { version = "0.6.0", path = "../autumn-harvest", default-features = false, features = ["db", "testing", "debugger"] }
clap = { version = "4.5", features = ["derive", "env"] }
# `harvest migrate` builds its own Postgres connection so it can offer TLS,
# which `AsyncPgConnection::establish` (NoTls) cannot -- a managed Harvest
# database with `sslmode=require` is the common production shape (issue #1240).
# Every crate here is already in the workspace lockfile at these versions via
# autumn-web's own migration path, so this unifies rather than widening.
diesel-async = { workspace = true }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
url = "2"
crossterm = "0.29.0"
percent-encoding = "2"
ratatui = "0.30.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "harvest"
path = "src/main.rs"

[[bin]]
name = "harvest-replay"
path = "src/bin/harvest_replay.rs"

[dev-dependencies]
# Already in the graph via `autumn-harvest`; a dev-dep so the integration test
# binaries can stamp a `RestoreVerifyReport::generated_at` directly.
chrono = { workspace = true }
tempfile = "3"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[lints]
workspace = true
