[package]
name = "autumn-harvest-cli"
description = "CLI client for the autumn-harvest management API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/madmax983/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "durable", "cli", "orchestration", "autumn"]
categories = ["command-line-utilities", "asynchronous"]

[dependencies]
autumn-harvest = { version = "0.4.0", path = "../autumn-harvest", default-features = false, features = ["testing"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29.0"
percent-encoding = "2"
ratatui = "0.30.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[[bin]]
name = "harvest"
path = "src/main.rs"

[[bin]]
name = "harvest-replay"
path = "src/bin/harvest_replay.rs"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
