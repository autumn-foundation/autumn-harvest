# Changelog: CI cost controls — reduce GitHub Actions minutes on iterative draft
# work. Three standard controls (this repo has no docs/changelog.d/ newsfragment
# convention on the base branch, so this changelog note lives here as a comment):
#   1. concurrency.cancel-in-progress — a new push cancels the superseded in-progress
#      run instead of queueing (already present below).
#   2. Draft-PR skip — expensive jobs are guarded with
#      `github.event_name != 'pull_request' || github.event.pull_request.draft == false`
#      so intermediate draft-PR pushes don't run CI. The team iterates on DRAFT PRs
#      and flips to "Ready for review" when final, so CI runs once per PR at the end
#      plus any post-ready fixes. Push events (e.g. to trunk-dev) always run.
#   3. Docs-only skip — the `changes` guard job gates the build/test jobs so a change
#      touching only docs/** or **/*.md doesn't run the compile/test matrix. A job
#      skipped via `if:` still reports success to branch protection, so this is safe
#      for required status checks (unlike paths-ignore, which reports nothing).
name: CI

on:
  # Manual trigger for the opt-in fuzz-smoke job (see the `fuzz-smoke` job).
  workflow_dispatch:
  push:
    branches: [trunk, trunk-dev]
  pull_request:
    # ready_for_review is required so flipping a draft to "Ready for review"
    # triggers a fresh run; the GitHub default [opened, synchronize, reopened]
    # does not include it. The other three keep normal PR pushes triggering.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [trunk, trunk-dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Detects whether any non-docs file changed, so the build/test jobs below can
  # skip on docs-only PRs/pushes. Plain `git diff` — no third-party action.
  changes:
    name: Detect non-docs changes
    runs-on: ubuntu-latest
    # Draft-skip (see header): don't even compute changes on draft-PR pushes.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      code: ${{ steps.filter.outputs.code }}
      # Resolved base revision, exported so the issue #794 schema gate can
      # compare the checked-in artifact against its PREVIOUS revision. This job
      # is the only one with `fetch-depth: 0`, so it is the only place the base
      # can be resolved reliably.
      base_sha: ${{ steps.filter.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Check whether any non-docs file changed
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="$PR_BASE"; head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"; head="${{ github.sha }}"
          fi
          # Fall back to the previous commit if base is empty/all-zeros/unknown
          # (e.g. a brand-new branch push).
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "Comparing ${base}...${head}"
          echo "base_sha=${base}" >> "$GITHUB_OUTPUT"
          # --no-renames disables rename detection so a code->docs move surfaces
          # the deleted source path (setting code=true) instead of a docs-only add.
          changed="$(git diff --name-only --no-renames "$base" "$head")"
          echo "Changed files:"
          echo "$changed"
          # Docs-only = every changed path matches docs/** or **/*.md. If any
          # other path is present, we have code changes and must run the matrix.
          #
          # Carve-out: `docs/workflow-schema-contract.json` is a checked-in
          # CONTRACT artifact, not prose. The issue #794 schema gate compares it
          # against the freshly generated contract, so a baseline-only PR must
          # still run the matrix — otherwise a hand-edited, stale, or malformed
          # baseline merges with no comparison at all, defeating the gate.
          if echo "$changed" | grep -qvE '^(docs/|.*\.md$)' \
            || echo "$changed" | grep -qxF 'docs/workflow-schema-contract.json'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Draft-skip: the team iterates on DRAFT PRs (many pushes) and flips to
    # "Ready for review" when final, so CI runs once per PR at the end plus any
    # post-ready fixes. Push events (e.g. trunk-dev) always run via the
    # `github.event_name != 'pull_request'` clause. Lint intentionally runs on
    # docs-only changes (it's a single cheap job); the expensive build/test jobs
    # below additionally gate on the `changes` guard.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy autumn-harvest
        run: cargo clippy -p autumn-harvest --all-features --tests -- -D warnings
      - name: Clippy autumn-harvest-plugin
        run: cargo clippy -p autumn-harvest-plugin --all-targets -- -D warnings
      - name: Clippy autumn-harvest-plugin (mcp feature)
        run: cargo clippy -p autumn-harvest-plugin --all-targets --features mcp,unified-dag-execution -- -D warnings
      - name: Clippy autumn-harvest-plugin (metrics feature)
        run: cargo clippy -p autumn-harvest-plugin --all-targets --features metrics -- -D warnings
      - name: Clippy autumn-harvest-plugin (webhooks feature)
        run: cargo clippy -p autumn-harvest-plugin --all-targets --features webhooks -- -D warnings
      # issue #944. `connectors` alone is the broker-agnostic layer (no broker
      # client), so it lints without any system dependency. `kafka` needs the
      # libcurl headers vendored librdkafka's cmake build looks for.
      - name: Clippy autumn-harvest-plugin (connectors feature)
        run: cargo clippy -p autumn-harvest-plugin --all-targets --features connectors -- -D warnings
      - name: Clippy autumn-harvest-plugin (sqs feature)
        run: cargo clippy -p autumn-harvest-plugin --all-targets --features sqs -- -D warnings
      - name: Install librdkafka build deps
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Clippy autumn-harvest-plugin (kafka feature)
        run: cargo clippy -p autumn-harvest-plugin --all-targets --features kafka -- -D warnings
      - name: Clippy autumn-harvest-macros
        run: cargo clippy -p autumn-harvest-macros -- -D warnings
      - name: Clippy autumn-harvest-cli
        run: cargo clippy -p autumn-harvest-cli --all-targets -- -D warnings
      - name: Clippy autumn-harvest-sqlite
        run: cargo clippy -p autumn-harvest-sqlite --all-targets -- -D warnings
      # Issue #786: the `docs/performance.md` prose-vs-table guards must run on
      # DOCS-ONLY pull requests — which is the change class most likely to break
      # them, and the one the `test` matrix below skips entirely (every step
      # there is gated on `changes.outputs.code == 'true'`). The Clippy step
      # above only *compiles* these tests; it never executes them. So they run
      # here, in the job that is deliberately ungated.
      #
      # Unconditional rather than `if: code == 'false'`: "the guards always run"
      # is a stronger property than "the guards run when the other place did
      # not", and does not silently break the day someone edits the matrix's
      # gating. The duplicate run on code PRs is 7 tests against a
      # `--no-default-features` build, which is cheap and cached.
      #
      # Guarded by `performance_docs::performance_guards_run_on_docs_only_changes`,
      # which fails if this step is removed or becomes conditional.
      # The filter is quoted because it ends in `::`, and a trailing colon in an
      # unquoted YAML scalar is a mapping indicator — unquoted, this line makes
      # the entire workflow file unparseable, so GitHub loads zero jobs and every
      # run fails instantly. Guarded by
      # `performance_docs::ci_yaml_plain_scalars_do_not_contain_a_mapping_colon`.
      - name: Run docs/performance.md guards (also on docs-only PRs)
        run: "cargo test -p autumn-harvest --no-default-features --features testing --test integration performance_docs::"

      # Issue #966: same reasoning as the step above, for the R&D report's
      # coupling-inventory guards. `docs/rnd/sqlite-feasibility.md` matches BOTH
      # clauses of the docs-only filter (`^(docs/|.*\.md$)`), so a PR that edits
      # only the report — deleting inventory rows, staling a count, dropping a
      # classification — sets `code=false` and skips the entire `test` matrix.
      # That is precisely the change class these guards exist to catch, so they
      # run here in the ungated `lint` job.
      #
      # Guarded by `sqlite_feasibility_docs::guards_run_on_docs_only_changes`,
      # which fails if this step is removed or becomes conditional. Quoted for
      # the same trailing-`::` YAML reason as above.
      - name: Run docs/rnd/sqlite-feasibility.md guards (also on docs-only PRs)
        run: "cargo test -p autumn-harvest --no-default-features --features testing --test integration sqlite_feasibility_docs::"

      # Issue #1202: same reasoning as the two steps above, for
      # docs/testing/chaos.md's worked local-iteration example. It lives
      # under `docs/`, so a PR that edits only that page — e.g. dropping the
      # `chaos_tests::` scope from the `HARVEST_TEST_DATABASE_URL` example,
      # which risks a chaos test's global TRUNCATE scrub racing a concurrent,
      # unrelated integration-test module against the same shared database —
      # sets `code=false` and skips the entire `test` matrix. That is
      # precisely the change class these guards exist to catch.
      #
      # Guarded by `chaos_docs::chaos_docs_guards_run_on_docs_only_changes`,
      # which fails if this step is removed or becomes conditional. Quoted
      # for the same trailing-`::` YAML reason as above.
      - name: Run docs/testing/chaos.md guards (also on docs-only PRs)
        run: "cargo test -p autumn-harvest --no-default-features --features testing --test integration chaos_docs::"

  test:
    name: Test (${{ matrix.os }})
    needs: [lint, changes]
    # Draft-skip only at the JOB level (see lint). Docs-only is handled at the
    # STEP level below, not here: a job-level `if:` on a MATRIX job that evaluates
    # false prevents matrix expansion entirely, so the `Test (<os>)` leg contexts
    # are never created — not even as "skipped" — and any branch-protection rule
    # requiring those legs by name is left stuck pending forever on a docs-only PR.
    # Guarding each expensive step with `needs.changes.outputs.code == 'true'`
    # instead keeps every leg context reporting (success, with the costly work
    # skipped) while still saving the minutes on docs-only changes.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Setup steps stay unconditional so the leg still spins up and reports a
      # conclusion. The expensive cargo steps below carry the docs-only guard;
      # when they all skip, the leg reports success — keeping the required
      # `Test (<os>)` contexts satisfied without running the matrix work.
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run no-db tests
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features
      - name: Run classic (non-unified) DAG tests
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features db --lib
      - name: Compile db-backed tests
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --all-features --tests --no-run
      # Issue #786: the claim/enqueue benchmark shares its harness with the
      # CI-gated budget assertion (`claim_budget_tests`, run Docker-backed via
      # the manifest below). Compile-checking it here keeps the published
      # `docs/performance.md` report from bit-rotting; `cargo bench` itself is
      # deliberately NOT run per-PR, since the measurement is minutes-long and
      # the *gate* is the test, not the report.
      #
      # Linux-only: bit-rot protection needs exactly one OS, and the benchmark is
      # only ever *run* on Linux (see the manifest). The macOS and Windows legs
      # already compile the same harness module through the `--all-features
      # --tests --no-run` step above, so restricting this one costs no coverage
      # and saves two legs' worth of minutes.
      - name: Compile claim/enqueue benchmark (issue #786)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: cargo bench -p autumn-harvest --features db --bench claim_bench --no-run
      - name: Run all-features lib tests
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --all-features --lib
      - name: Free disk space
        if: needs.changes.outputs.code == 'true'
        run: cargo clean
      - name: Run plugin lib tests
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-plugin --lib
      - name: Run plugin lib tests (webhooks feature, issue #618 outbound-delegate gating)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-plugin --features webhooks --lib
      - name: Run plugin connector tests (issue #944)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-plugin --features connectors --lib connector
      # No CI step ran the plugin's doctests, so a broken `///` example landed
      # silently (issue #944 review found exactly that). These are compile-only
      # (`no_run`), so they cost seconds and need no database.
      - name: Run plugin doctests (issue #944 review)
        if: needs.changes.outputs.code == 'true'
        run: cargo test --doc -p autumn-harvest-plugin --features connectors
      - name: Run plugin MCP tool tests (issue #597, DAG MCP tools issue #601 follow-up)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-plugin --features mcp,unified-dag-execution --lib --test mcp_tools_http_tests
      - name: Run plugin metrics scrape tests (issue #355)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-plugin --features metrics --lib --test metrics_scrape_http_tests
      - name: Compile plugin metrics scrape example
        if: needs.changes.outputs.code == 'true'
        run: cargo build -p autumn-harvest-plugin --example metrics_scrape_quickstart --features metrics
      # `aws-sdk-sqs` is pure Rust, so the SQS example builds on every OS.
      - name: Compile plugin SQS connector example (issue #944)
        if: needs.changes.outputs.code == 'true'
        run: cargo build -p autumn-harvest-plugin --example sqs_connector_quickstart --features sqs
      # issue #944: the Kafka example is the success metric's measured artifact
      # (see tests/connector_example_budget.rs), so it must keep compiling.
      # Linux-only for the same librdkafka reason as the broker suite.
      - name: Compile plugin Kafka connector example (issue #944, Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
          cargo build -p autumn-harvest-plugin --example kafka_connector_quickstart --features kafka
      - name: Run macros tests
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-macros
      - name: Run CLI tests (issue #753)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-cli
      - name: Run autumn-harvest-sqlite tests (issue #1068)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-sqlite
      - name: Run business_metrics example tests (issue #758)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example business_metrics
      - name: Run typed_workflow_failure example tests (issue #767)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example typed_workflow_failure
      - name: Run activity_ctx_info example tests (issue #783)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example activity_ctx_info
      - name: Run activity_interceptor example tests (issue #680)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example activity_interceptor
      - name: Run child_with_timeout example tests (issue #779)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example child_with_timeout
      - name: Run replay_debugger example tests (issue #949)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features debugger --example replay_debugger
      - name: Run long_lived_entity_deadline example tests (issue #772)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example long_lived_entity_deadline
      - name: Run dag_data_flow example tests (issue #702)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing,unified-dag-execution --example dag_data_flow
      # Quoted: an unquoted `#` after whitespace starts a YAML comment, which
      # would silently truncate the step name at "(issue".
      - name: "Run dag_compensation example tests (issue #780)"
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing,unified-dag-execution --example dag_compensation
      - name: Run interface_schema_workflow example tests (issue #610)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing,schema --example interface_schema_workflow
      - name: Run entity_phase_transition example tests (issue #803)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example entity_phase_transition
      - name: Run mutex_ledger example tests (issue #691)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example mutex_ledger
      - name: Run workflow_logs example tests (issue #790)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example workflow_logs
      - name: Run fanout_batch example tests (issue #750)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example fanout_batch
      - name: Run business_day_escalation example tests (issue #806)
        if: needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --no-default-features --features testing --example business_day_escalation
      # The WASM example is a `main()` that self-asserts the sandbox contract
      # (echo round-trip, a granted capability, and an ungranted import denied as
      # SandboxDenied), so RUN it rather than only building it. It needs no
      # database. Linux-only: it is the one example gated on `wasm-activities`,
      # which drags in wasmtime — a multi-minute build not worth paying on three
      # legs, and the macOS/Windows legs never build core examples at all.
      - name: Run wasm_activity example (issue #965)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: cargo run -p autumn-harvest --features wasm-activities --example wasm_activity
      # Issue #794: the schema-contract gate, end to end. Generates the
      # currently-published schemas from the example registry, then diffs them
      # against the checked-in baseline. This is simultaneously the drift guard
      # for `docs/workflow-schema-contract.json` and the proof that the
      # documented CI recipe actually works. No database, no services.
      #
      # Linux-only, matching the benchmark bit-rot guard above: schema drift is
      # a property of the checked-in artifact, not of the OS, so one leg proves
      # it. The step builds twice (`--features schema` pulls schemars; the CLI
      # links the whole `harvest` binary), so restricting it saves two legs'
      # worth of minutes for zero added coverage.
      - name: "Gate workflow payload-schema changes (issue #794)"
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
          ARTIFACT: docs/workflow-schema-contract.json
        run: |
          set -euo pipefail
          cargo run --quiet -p autumn-harvest --no-default-features --features schema \
            --example schema_workflow -- --emit-contract > "${RUNNER_TEMP}/schema-current.json"

          # 1. Is the checked-in artifact current, and is every delta safe?
          #    --require-current also refuses an unabsorbed COMPATIBLE delta: a
          #    baseline allowed to lag records what was deployed some time ago
          #    while this gate reads it as what was deployed last, so a field
          #    added in one release and removed in the next is invisible even
          #    though replay of data written in between fails.
          cargo run --quiet -p autumn-harvest-cli --bin harvest -- \
            schema check --require-current --current "${RUNNER_TEMP}/schema-current.json"

          # 2. Was the ARTIFACT's own change since the base revision recorded?
          #
          # Step 1 alone is bypassable: regenerate the artifact by hand in the
          # same PR and it agrees with the generated contract, so the diff is
          # empty and a replay-breaking change merges with no justification.
          # Comparing against the artifact's PREVIOUS revision is the only
          # signal left, so this is what makes the escape hatch auditable.
          #
          # The matrix checkout is shallow, so fetch just the base commit.
          git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            # The base object is unreachable (a force-push, or a transient fetch
            # failure). Warn rather than block every PR on infrastructure: step 1
            # still ran, and a reviewer sees the artifact in the diff.
            echo "::warning::base commit ${BASE_SHA} unavailable — skipped the" \
                 "acknowledgement check; review artifact changes manually"
          elif git cat-file -e "${BASE_SHA}:${ARTIFACT}" 2>/dev/null; then
            git show "${BASE_SHA}:${ARTIFACT}" > "${RUNNER_TEMP}/schema-base.json"
            cargo run --quiet -p autumn-harvest-cli --bin harvest -- \
              schema check --baseline "${RUNNER_TEMP}/schema-base.json" \
                           --current "${RUNNER_TEMP}/schema-current.json" \
                           --acknowledged-in "$ARTIFACT"
          else
            echo "no artifact at ${BASE_SHA} — first introduction, nothing to compare"
          fi
      # ── Manifest-driven integration suites ──────────────────────────────
      # The per-suite `cargo test` steps that used to live here are now data in
      # `.github/ci/integration-suites.txt`, executed by `.github/ci/run-suites.sh`.
      # Adding a suite is one sorted manifest line — no edit to this file. See
      # `autumn-harvest/tests/integration/ci_run_coverage.rs` for the coverage
      # guard that keeps the manifest honest. Per-step `if:` gating is preserved
      # exactly (NOT hoisted to a job-level `if:` — see the note on the `test`
      # job above); `shell: bash` resolves to Git Bash on Windows.
      - name: Free runner disk before heavy plugin link (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/lib/jvm "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Compile plugin integration test suites (manifest, all OSes)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: bash .github/ci/run-suites.sh compile
      - name: Run all-OS manifest suites (no live DB)
        if: needs.changes.outputs.code == 'true'
        shell: bash
        run: bash .github/ci/run-suites.sh run allos
      - name: Run Linux Docker-backed manifest suites (serial)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        shell: bash
        run: bash .github/ci/run-suites.sh run linux
      # Issue #684's signal/update-metric run targets SPECIFIC test paths across
      # two modules (a multi-token `--` filter), which the single-`filter`-column
      # manifest schema cannot represent; it stays a literal Docker-backed step.
      - name: Run Docker-backed signal/update metric integration tests (issue #684)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest --test integration -- metrics_integration::update_completed_metric_fires_on_the_suspend_path nd_block_tests::genuine_terminal_with_undrained_signal_emits_signal_unhandled nd_block_tests::nd_blocked_cycle_does_not_emit_signal_unhandled --test-threads=1
      # Issue #944's Kafka broker suite stays a literal Linux-only step rather
      # than a manifest row: it needs the apt install below first, and the
      # manifest's `compile` mode would try to build vendored librdkafka on the
      # macOS and Windows legs too. Its ALLOWLIST entry in `ci_run_coverage.rs`
      # points here. (The SQS broker suite IS a manifest row — `aws-sdk-sqs` is
      # pure Rust and compiles everywhere.)
      - name: Install librdkafka build deps (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Run plugin Kafka broker connector tests (issue #944)
        if: runner.os == 'Linux' && needs.changes.outputs.code == 'true'
        run: cargo test -p autumn-harvest-plugin --features kafka --test connector_kafka_broker -- --test-threads=1

  quickstart:
    name: Quickstart example builds
    needs: changes
    # Draft-skip (see lint) + docs-only skip via the `changes` guard.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build quickstart
        run: cargo build -p quickstart

  scaffold-smoke:
    name: Scaffold builds and runs (harvest new)
    needs: changes
    # Draft-skip (see lint) + docs-only skip via the `changes` guard.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # A real Postgres so the scaffolded app can auto-migrate (AUTUMN_PROFILE=dev)
    # and drive a workflow to a terminal state. User/password/db match the
    # scaffold's generated `autumn.toml`
    # (`postgres://demo_app:demo_app@localhost:5432/demo_app`), so the app's own
    # config connects verbatim — the truest AC-2/AC-3 test.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: demo_app
          POSTGRES_PASSWORD: demo_app
          POSTGRES_DB: demo_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Scaffold a project with `harvest new`
        run: cargo run -p autumn-harvest-cli --bin harvest -- new demo_app --path "${RUNNER_TEMP}/scaffold"
      - name: Build the scaffolded project against published crates.io deps
        # NO `[patch.crates-io]`: the scaffold pins `autumn-harvest = "0.4"`,
        # `autumn-harvest-plugin = "0.4"`, `autumn-web = "0.5"`, all resolved
        # from crates.io — exactly what a real user gets from `harvest new` +
        # `cargo build`. This is the honest AC-2 guard (published API, not trunk).
        run: cargo build --manifest-path "${RUNNER_TEMP}/scaffold/Cargo.toml"
      - name: Run the scaffold and assert a workflow reaches COMPLETED
        # Boots the generated app, triggers its workflow, and polls the execution
        # to a terminal state — the literal AC-8 assertion ("generate, build, and
        # assert a workflow reaches a terminal state").
        env:
          AUTUMN_PROFILE: dev
          AUTUMN_MANIFEST_DIR: ${{ runner.temp }}/scaffold
        run: |
          set -uo pipefail
          "${RUNNER_TEMP}/scaffold/target/debug/demo_app" &
          APP_PID=$!
          trap 'kill "${APP_PID}" 2>/dev/null || true' EXIT

          # 1. Wait for the app to become healthy (fail fast if it exits early).
          healthy=false
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/api/harvest/health; then
              echo "app healthy after ${i}s"; healthy=true; break
            fi
            if ! kill -0 "${APP_PID}" 2>/dev/null; then
              echo "::error::scaffolded app exited before becoming healthy"; exit 1
            fi
            sleep 1
          done
          if [ "${healthy}" != "true" ]; then
            echo "::error::scaffolded app never became healthy"; exit 1
          fi

          # 2. Trigger the workflow and capture its execution_id.
          resp="$(curl -sf -X POST \
            http://localhost:3000/api/harvest/workflows/demo_app_workflow/start \
            -H 'Content-Type: application/json' \
            -d '{"workflow_id":"ci-1","input":"World"}')" || {
              echo "::error::start request failed"; exit 1; }
          echo "start response: ${resp}"
          eid="$(echo "${resp}" | jq -r '.execution_id // empty')"
          if [ -z "${eid}" ]; then
            echo "::error::no execution_id in start response"; exit 1
          fi

          # 3. Poll the execution until COMPLETED (fail the job if it never does).
          for i in $(seq 1 60); do
            state="$(curl -s "http://localhost:3000/api/harvest/workflows/${eid}" \
              | jq -r '.execution.state // empty' 2>/dev/null || true)"
            echo "t=${i}s state=${state:-<none>}"
            case "${state}" in
              COMPLETED)
                echo "workflow reached COMPLETED — scaffold runs end to end"; exit 0 ;;
              FAILED|TIMED_OUT|TERMINATED|CANCELLED)
                echo "::error::workflow reached terminal-but-not-completed state: ${state}"
                exit 1 ;;
            esac
            sleep 1
          done
          echo "::error::workflow did not reach COMPLETED within the timeout"; exit 1

  msrv:
    name: MSRV (1.88.0)
    needs: changes
    # Draft-skip (see lint) + docs-only skip via the `changes` guard.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Check MSRV compiles
        run: cargo check --workspace

  # Opt-in fuzz smoke. NEVER runs on push/PR — GitHub Actions minutes are tight
  # and fuzzing needs nightly + libFuzzer. Trigger manually from the Actions tab
  # (Run workflow) when you want a quick "do the targets still build and run
  # clean" check. For a real campaign, run a single target locally with a larger
  # -max_total_time (see docs/testing/property-and-fuzz.md and fuzz/smoke.sh).
  fuzz-smoke:
    name: Fuzz smoke (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz smoke (30s per target)
        working-directory: fuzz
        run: |
          set -euo pipefail
          for t in fuzz_workflow_event_deser fuzz_det_check_source \
                   fuzz_validate_target_url fuzz_failure_signature; do
            echo "=== ${t} ==="
            cargo +nightly fuzz run "${t}" -- -max_total_time=30
          done
