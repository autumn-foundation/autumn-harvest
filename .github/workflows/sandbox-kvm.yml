# Sandboxed code activities on real Firecracker microVMs.
#
# The `test-nodb` job of ci.yml runs the sandbox tests without KVM. This
# workflow boots real microVMs on a GitHub runner with /dev/kvm. It builds the
# guest image with scripts/sandbox/build-guest-image.sh and runs the ignored
# `sandbox::firecracker::kvm_tests`. See docs/sandbox-activities.md.
#
# The tests whose names start with `root_` need root, so a second step runs
# the test binary with sudo. They include the jailer and snapshot tests.
#
# The Firecracker release and the base image have pinned digests. The image
# script pins its default kernel by digest, so this workflow boots that pin.
# The Alpine packages come from the Alpine repository unpinned.
name: Sandbox (KVM)

on:
  pull_request:
    paths:
      - "autumn-harvest/src/sandbox/**"
      - "autumn-harvest/Cargo.toml"
      - "autumn-harvest-sandbox-guest/**"
      - "scripts/sandbox/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/sandbox-kvm.yml"
  push:
    branches: [trunk-dev]
    paths:
      - "autumn-harvest/src/sandbox/**"
      - "autumn-harvest/Cargo.toml"
      - "autumn-harvest-sandbox-guest/**"
      - "scripts/sandbox/**"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/sandbox-kvm.yml"
  workflow_dispatch:
  schedule:
    # Weekly on Monday at 04:17 UTC, so a new runner image cannot break KVM
    # unseen.
    - cron: "17 4 * * 1"

concurrency:
  group: sandbox-kvm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FIRECRACKER_VERSION: v1.17.0
  FIRECRACKER_SHA256: 06094a1108ae9e82aa4c23a775aa92758f53f1175d422270d9d6162cb9ade558
  # The Docker Hub image through its Google mirror, which has no pull limit.
  BASE_IMAGE: mirror.gcr.io/library/python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4

jobs:
  kvm:
    name: Sandbox (KVM)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Give the runner user /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install Firecracker and the jailer
        run: |
          dir="${RUNNER_TEMP}/fc"
          mkdir -p "${dir}"
          url="https://github.com/firecracker-microvm/firecracker/releases/download"
          curl -fsSL --retry 3 -o "${dir}/fc.tgz" \
            "${url}/${FIRECRACKER_VERSION}/firecracker-${FIRECRACKER_VERSION}-x86_64.tgz"
          echo "${FIRECRACKER_SHA256}  ${dir}/fc.tgz" | sha256sum -c -
          tar -xzf "${dir}/fc.tgz" -C "${dir}"
          release="${dir}/release-${FIRECRACKER_VERSION}-x86_64"
          # Short names keep the jailed socket paths below the AF_UNIX limit.
          install -m 0755 "${release}/firecracker-${FIRECRACKER_VERSION}-x86_64" "${dir}/firecracker"
          install -m 0755 "${release}/jailer-${FIRECRACKER_VERSION}-x86_64" "${dir}/jailer"
          "${dir}/firecracker" --version
          echo "HARVEST_FIRECRACKER_BIN=${dir}/firecracker" >> "${GITHUB_ENV}"
          echo "HARVEST_JAILER_BIN=${dir}/jailer" >> "${GITHUB_ENV}"
      - name: Build the guest image
        run: |
          # fakeroot keeps root as the owner of the image files.
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends fakeroot
          scripts/sandbox/build-guest-image.sh "${RUNNER_TEMP}/image"
          echo "HARVEST_GUEST_KERNEL=${RUNNER_TEMP}/image/vmlinux" >> "${GITHUB_ENV}"
          echo "HARVEST_GUEST_ROOTFS=${RUNNER_TEMP}/image/rootfs.ext4" >> "${GITHUB_ENV}"
      - name: Run the KVM tests
        run: >-
          cargo test -p autumn-harvest --no-default-features --features sandbox-activities --lib
          sandbox::firecracker::kvm_tests -- --ignored --skip root_ --test-threads=1
      - name: Run the root tests, the jailer and snapshot tests among them
        run: |
          bin="$(cargo test -p autumn-harvest --no-default-features --features sandbox-activities \
            --lib --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.kind == ["lib"]) | .executable')"
          # A jailed launcher refuses a binary or an image that a non-root
          # user could replace, so the root tests use copies that root owns.
          sudo install -d -m 0755 /srv/harvest-image
          sudo install -m 0644 "${HARVEST_GUEST_KERNEL}" "${HARVEST_GUEST_ROOTFS}" /srv/harvest-image/
          sudo install -m 0755 "${HARVEST_FIRECRACKER_BIN}" "${HARVEST_JAILER_BIN}" /srv/harvest-image/
          sudo env \
            "HARVEST_FIRECRACKER_BIN=/srv/harvest-image/firecracker" \
            "HARVEST_JAILER_BIN=/srv/harvest-image/jailer" \
            "HARVEST_GUEST_KERNEL=/srv/harvest-image/vmlinux" \
            "HARVEST_GUEST_ROOTFS=/srv/harvest-image/rootfs.ext4" \
            "${bin}" root_ --ignored --test-threads=1
