# Daily RUSTSEC advisory scan (issue #1826).
#
# The `dependency-audit` job in ci.yml runs `cargo deny` on code changes only.
# A new advisory lands with no code change, so that job does not see it. This
# workflow runs `cargo deny check advisories` every day.
#
# A scheduled run that finds an advisory opens an issue, or comments on the
# open one. A clean scheduled run closes it. A pull request that changes the
# scan runs it too, with no issue write. The logic is in
# .github/ci/advisory-scan.sh. The supply_chain_ci tests in
# autumn-harvest/tests/integration run it against a stub `gh`.
name: Advisory scan

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:37 UTC, off the hour and away from the other nightlies.
    - cron: "37 5 * * *"
  pull_request:
    branches: [trunk, trunk-dev]
    paths:
      - .github/workflows/advisory-scan.yml
      - .github/ci/advisory-scan.sh
      - deny.toml

# One run at a time, so two runs cannot both open an alert issue. Queue, do
# not cancel: a cancelled run skips the failure report step.
concurrency:
  group: advisory-scan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: cargo deny check advisories
    runs-on: ubuntu-latest
    # A job timeout cancels the job, and then the report step does not run. A
    # step timeout is a step failure, so the step timeouts sum to less than
    # this.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 2
      # The same cargo-deny version as the `dependency-audit` gate in ci.yml.
      # A test checks that the two agree.
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        timeout-minutes: 3
        with:
          tool: cargo-deny@0.20.2
      - name: Scan for advisories
        id: scan
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          ADVISORY_ALERT: ${{ github.event_name == 'schedule' }}
        run: bash .github/ci/advisory-scan.sh
      # A failed scan step has reported already. Any other failed step stops
      # the run before the scan, so this step reports it.
      - name: Report a failed setup on the alert issue
        if: failure() && github.event_name == 'schedule' && steps.scan.outcome != 'failure'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .github/ci/advisory-scan.sh ]; then
            bash .github/ci/advisory-scan.sh setup-failed
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Advisory scan: cargo deny check advisories failed" \
              --body "The advisory scan failed before checkout: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
