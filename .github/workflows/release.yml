name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
      - name: Verify CHANGELOG.md is current
        run: |
          git-cliff --config cliff.toml --output /tmp/CHANGELOG.md
          perl -0pi -e 's/\n+\z/\n/' /tmp/CHANGELOG.md
          if ! diff -u CHANGELOG.md /tmp/CHANGELOG.md; then
            echo "::error::CHANGELOG.md is out of date for ${{ github.ref_name }}. Run git-cliff --config cliff.toml --output CHANGELOG.md and commit it before tagging the release."
            exit 1
          fi
      - name: Generate release notes
        id: release-notes
        run: |
          git-cliff --config cliff.toml --latest --strip header > RELEASE_NOTES.md
          perl -0pi -e 's/\n+\z/\n/' RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
