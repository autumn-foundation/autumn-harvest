name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
      - name: Verify CHANGELOG.md is current
        run: |
          git-cliff --config cliff.toml --output /tmp/CHANGELOG.md
          perl -0pi -e 's/\n+\z/\n/' /tmp/CHANGELOG.md
          if ! diff -u CHANGELOG.md /tmp/CHANGELOG.md; then
            echo "::error::CHANGELOG.md is out of date for ${{ github.ref_name }}. Run git-cliff --config cliff.toml --output CHANGELOG.md and commit it before tagging the release."
            exit 1
          fi
      - name: Generate release notes
        id: release-notes
        run: |
          git-cliff --config cliff.toml --latest --strip header > RELEASE_NOTES.md
          perl -0pi -e 's/\n+\z/\n/' RELEASE_NOTES.md
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Issue #1616. Build the client before the release exists, so a broken
      # client stops the release. The package version must equal the tag.
      - name: Build the TypeScript client
        id: client
        run: |
          set -euo pipefail
          version="$(jq -r .version clients/typescript/package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::clients/typescript/package.json is ${version}, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          tarball="$(scripts/build-typescript-client.sh | tail -n 1)"
          test "$(basename "${tarball}")" = "autumn-harvest-client-${version}.tgz"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.client.outputs.tarball }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
