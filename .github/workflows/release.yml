# Release pipeline.
#
# A `v*` tag push builds, signs and publishes a release. Issue #1826 adds the
# supply-chain steps:
#
# - `binaries` builds the `harvest` CLI with `cargo auditable`, so
#   `cargo audit bin` can scan a shipped binary. It writes a CycloneDX SBOM
#   for the same package and target. It holds no write or OIDC permission,
#   because the build runs third-party `build.rs` code.
# - `sign` signs each archive and SBOM with Sigstore keyless signing, then
#   verifies each bundle against this workflow's identity. It attests build
#   provenance and the SBOM with GitHub artifact attestations. It runs no
#   repository code.
# - `release` runs on a tag push only. It publishes the signed files.
#
# A manual run or a pull request that changes this file is a dry run. It runs
# `binaries` and `sign`, and keeps the result as a workflow artifact.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
  pull_request:
    branches: [trunk, trunk-dev]
    paths:
      - .github/workflows/release.yml

# Read-only by default. Each job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release
    # CI runs these checks on every pull request. Run them again for a tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  meta:
    name: Release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # A tag release must match the CLI version. A dry run gets a version
      # that cannot pass for a real release.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "autumn-harvest-cli") | .version')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "v${crate}" != "$GITHUB_REF_NAME" ]; then
              echo "::error::autumn-harvest-cli is ${crate}, the tag is ${GITHUB_REF_NAME}"
              exit 1
            fi
            version="$crate"
          else
            version="${crate}-dryrun.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build harvest (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NAME: harvest-${{ needs.meta.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No build cache. A release build must not read a cache that another
      # run wrote.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-auditable@0.7.7,cargo-cyclonedx@0.5.9
      - name: Build with cargo auditable
        run: cargo auditable build --release --locked -p autumn-harvest-cli --target "$TARGET"
      # The dependency list is in the `.dep-v0` section. Check it on ELF only.
      # The other targets use the same build command.
      - name: Check the embedded dependency list
        if: runner.os == 'Linux'
        run: readelf -S "target/${TARGET}/release/harvest" | grep -q '\.dep-v0'
      - name: Package the archive
        run: |
          set -euo pipefail
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p "dist/${NAME}"
          cp "target/${TARGET}/release/harvest${ext}" \
            "target/${TARGET}/release/harvest-replay${ext}" \
            README.md "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME}"
      # The SBOM describes the package, features and target of the build.
      # `cargo cyclonedx` writes one file per workspace member. Keep the CLI
      # file only.
      - name: Write the CycloneDX SBOM
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          cargo cyclonedx --manifest-path autumn-harvest-cli/Cargo.toml \
            --format json --spec-version 1.5 --target "$TARGET" \
            --override-filename "${NAME}.cdx"
          mv "autumn-harvest-cli/${NAME}.cdx.json" dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and attest (${{ matrix.target }})
    needs: [meta, binaries]
    # A fork pull request gets no OIDC token, so it cannot sign.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
    env:
      NAME: harvest-${{ needs.meta.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.target }}
          path: dist
      # Refuse to sign an empty or malformed SBOM.
      - name: Check the SBOM
        run: |
          jq -e '.bomFormat == "CycloneDX" and (.components | length > 0)' \
            "dist/${NAME}.cdx.json" > /dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the certificate binds the signature to this workflow run.
      # The entry goes to the public Rekor transparency log.
      - name: Sign with Sigstore
        run: |
          set -euo pipefail
          for file in "dist/${NAME}.tar.gz" "dist/${NAME}.cdx.json"; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      # Verify as a user does. A bundle for another identity fails here.
      - name: Verify the signatures
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          for file in "dist/${NAME}.tar.gz" "dist/${NAME}.cdx.json"; do
            cosign verify-blob --bundle "${file}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.NAME }}.tar.gz
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/${{ env.NAME }}.tar.gz
          sbom-path: dist/${{ env.NAME }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [meta, validate, sign]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install git-cliff
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: git-cliff
      - name: Verify CHANGELOG.md is current
        run: |
          git-cliff --config cliff.toml --output /tmp/CHANGELOG.md
          perl -0pi -e 's/\n+\z/\n/' /tmp/CHANGELOG.md
          if ! diff -u CHANGELOG.md /tmp/CHANGELOG.md; then
            echo "::error::CHANGELOG.md is out of date for ${{ github.ref_name }}. Run git-cliff --config cliff.toml --output CHANGELOG.md and commit it before tagging the release."
            exit 1
          fi
      - name: Generate release notes
        id: release-notes
        run: |
          git-cliff --config cliff.toml --latest --strip header > RELEASE_NOTES.md
          perl -0pi -e 's/\n+\z/\n/' RELEASE_NOTES.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      # Issue #1616. Build the client before the release exists, so a broken
      # client stops the release. The package version must equal the tag.
      - name: Build the TypeScript client
        id: client
        run: |
          set -euo pipefail
          version="$(jq -r .version clients/typescript/package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::clients/typescript/package.json is ${version}, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          # The script logs to stderr. Its stdout is the tarball path only.
          tarball="$(scripts/build-typescript-client.sh)"
          if [ "$(basename "${tarball}")" != "autumn-harvest-client-${version}.tgz" ]; then
            echo "::error::the client packed as $(basename "${tarball}"), not autumn-harvest-client-${version}.tgz"
            exit 1
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: cd dist && sha256sum -- *.tar.gz *.cdx.json *.sigstore.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ steps.client.outputs.tarball }}
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sigstore.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
