# Release pipeline.
#
# A `v*` tag push builds, signs and publishes a release. Issue #1826 adds the
# supply-chain steps:
#
# - `binaries` builds the `harvest` CLI with `cargo auditable`, so
#   `cargo audit bin` can scan a shipped binary. It writes a CycloneDX SBOM
#   for the same package and target. It holds no write or OIDC permission,
#   because the build runs third-party `build.rs` code.
# - `sign` signs each archive and SBOM with Sigstore keyless signing, then
#   verifies each bundle against this workflow's identity. On a tag push it
#   also attests build provenance and the SBOM with GitHub artifact
#   attestations. It runs no repository code.
# - `client` builds the TypeScript client and its CycloneDX SBOM with
#   read-only permissions, because `npm` runs third-party install scripts.
#   `sign-client` signs and attests the tarball as `sign` does an archive.
# - `image` builds the worker image of issue #1989 with read-only
#   permissions, then runs it against Postgres.
# - `publish-image` runs on a tag push only, after both sign jobs. It pushes
#   the image, signs its digest, and pushes a provenance attestation to the
#   registry. It runs no repository code.
# - `release` runs on a tag push only. It publishes the signed files.
#
# A manual run is a dry run. So is a pull request that changes a file in
# `pull_request.paths` below. A dry run runs `binaries`, `sign` and `image`,
# and keeps the result as a workflow artifact. It writes no attestation.
# `gh attestation verify --repo` accepts any workflow run of this
# repository, so a dry-run attestation would verify like a release.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:
  pull_request:
    # `ready_for_review` runs the dry run that a draft skipped.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [trunk, trunk-dev]
    paths:
      - .github/workflows/release.yml
      # The image inputs. A dependency change can add a shared library that
      # the distroless runtime lacks. CI runs the runner acceptance suite on
      # each source change.
      - Dockerfile
      - .dockerignore
      - rust-toolchain.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - autumn-harvest-plugin/migrations/harvest/**

# Read-only by default. Each job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Issue #1989. `publish-image` pushes here, and the release notes name it.
  IMAGE: ghcr.io/autumn-foundation/autumn-harvest

jobs:
  # Every check that can reject a tag runs here. Both sign jobs wait for this
  # job, so a rejected tag leaves no Rekor entry and no attestation.
  validate:
    name: Validate release
    # CI runs the build checks on every pull request. Run them again for a tag.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff reads the full history.
          fetch-depth: 0
          persist-credentials: false
      - name: Install git-cliff
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: git-cliff
      - name: Verify CHANGELOG.md is current
        run: |
          git-cliff --config cliff.toml --output /tmp/CHANGELOG.md
          perl -0pi -e 's/\n+\z/\n/' /tmp/CHANGELOG.md
          if ! diff -u CHANGELOG.md /tmp/CHANGELOG.md; then
            echo "::error::CHANGELOG.md is out of date for ${GITHUB_REF_NAME}. Run git-cliff --config cliff.toml --output CHANGELOG.md and commit it before tagging the release."
            exit 1
          fi
      # Issue #1616. The client package version must equal the tag.
      - name: Check the TypeScript client version
        run: |
          version="$(jq -r .version clients/typescript/package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::clients/typescript/package.json is ${version}, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  meta:
    name: Release version
    # A draft pull request does not run the three release builds.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A tag release must match the CLI version. A dry run gets a version
      # that cannot pass for a real release.
      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          crate="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "autumn-harvest-cli") | .version')"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "v${crate}" != "$GITHUB_REF_NAME" ]; then
              echo "::error::autumn-harvest-cli is ${crate}, the tag is ${GITHUB_REF_NAME}"
              exit 1
            fi
            version="$crate"
          else
            version="${crate}-dryrun.${GITHUB_SHA::7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Build harvest (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      NAME: harvest-${{ needs.meta.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No build cache. A release build must not read a cache that another
      # run wrote.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-auditable@0.7.7,cargo-cyclonedx@0.5.9
      - name: Build with cargo auditable
        run: cargo auditable build --release --locked -p autumn-harvest-cli --target "$TARGET"
      # The dependency list is in the `.dep-v0` section. Check it on ELF only.
      # The other targets use the same build command.
      - name: Check the embedded dependency list
        if: runner.os == 'Linux'
        run: readelf -S "target/${TARGET}/release/harvest" | grep -q '\.dep-v0'
      - name: Package the archive
        run: |
          set -euo pipefail
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=".exe"; fi
          mkdir -p "dist/${NAME}"
          # The archive ships both license texts (issue #1990). `cp` fails
          # the step if a license file is missing.
          cp "target/${TARGET}/release/harvest${ext}" \
            "target/${TARGET}/release/harvest-replay${ext}" \
            README.md LICENSE-MIT LICENSE-APACHE "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          rm -rf "dist/${NAME:?}"
      # The SBOM describes the package, features and target of the build.
      # `cargo cyclonedx` writes one file per workspace member. Keep the CLI
      # file only. Do not set SOURCE_DATE_EPOCH: it drops `serialNumber`, and
      # `actions/attest` then rejects the SBOM.
      - name: Write the CycloneDX SBOM
        run: |
          set -euo pipefail
          cargo cyclonedx --manifest-path autumn-harvest-cli/Cargo.toml \
            --format json --spec-version 1.5 --target "$TARGET" \
            --override-filename "${NAME}.cdx"
          mv "autumn-harvest-cli/${NAME}.cdx.json" dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-${{ matrix.target }}
          path: |
            dist/${{ env.NAME }}.tar.gz
            dist/${{ env.NAME }}.cdx.json
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Sign and attest (${{ matrix.target }})
    # On a tag push, a failed `validate` stops signing, so no Rekor entry or
    # attestation names a release that never ships. A dry run skips
    # `validate`.
    needs: [meta, binaries, validate]
    # A fork pull request gets no OIDC token, so it cannot sign. A Dependabot
    # pull request gets a read-only token, so it skips signing too.
    if: >-
      !cancelled() &&
      needs.binaries.result == 'success' &&
      (needs.validate.result == 'success' || needs.validate.result == 'skipped') &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
    env:
      NAME: harvest-${{ needs.meta.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-${{ matrix.target }}
          path: dist
      # Refuse to sign an empty or malformed SBOM. `actions/attest` needs
      # these three fields, and a dry run does not attest, so check them here.
      - name: Check the SBOM
        run: |
          jq -e '.bomFormat == "CycloneDX" and .specVersion and .serialNumber
            and (.components | length > 0)' "dist/${NAME}.cdx.json" > /dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: the certificate binds the signature to this workflow run.
      # The entry goes to the public Rekor transparency log.
      - name: Sign with Sigstore
        run: |
          set -euo pipefail
          for file in "dist/${NAME}.tar.gz" "dist/${NAME}.cdx.json"; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      # Verify as a user does. A bundle for another identity fails here.
      - name: Verify the signatures
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          for file in "dist/${NAME}.tar.gz" "dist/${NAME}.cdx.json"; do
            cosign verify-blob --bundle "${file}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
          done
      # Tag push only. See the header for why a dry run writes no attestation.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: dist/${{ env.NAME }}.tar.gz
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name == 'push'
        with:
          subject-path: dist/${{ env.NAME }}.tar.gz
          sbom-path: dist/${{ env.NAME }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # Issue #1616. Build the client before the release exists, so a broken
  # client stops the release. The package version must equal the tag.
  client:
    name: Build the TypeScript client
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.client.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Build the TypeScript client
        id: client
        run: |
          set -euo pipefail
          version="$(jq -r .version clients/typescript/package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::clients/typescript/package.json is ${version}, the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          # The script logs to stderr. Its stdout is the tarball path only.
          tarball="$(scripts/build-typescript-client.sh)"
          if [ "$(basename "${tarball}")" != "autumn-harvest-client-${version}.tgz" ]; then
            echo "::error::the client packed as $(basename "${tarball}"), not autumn-harvest-client-${version}.tgz"
            exit 1
          fi
          base="$(basename "${tarball}")"
          mkdir -p client-dist
          cp "${tarball}" client-dist/
          # The SBOM lists the runtime dependencies that a user installs.
          (cd clients/typescript && npm sbom --sbom-format cyclonedx \
            --sbom-type library --omit dev) > "client-dist/${base}.cdx.json"
          echo "tarball=${base}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typescript-client
          path: |
            client-dist/${{ steps.client.outputs.tarball }}
            client-dist/${{ steps.client.outputs.tarball }}.cdx.json
          if-no-files-found: error

  # The same steps as `sign`, for the client tarball. It runs no repository
  # code.
  sign-client:
    name: Sign and attest the TypeScript client
    needs: [validate, client]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARBALL: ${{ needs.client.outputs.tarball }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typescript-client
          path: dist
      # The same rule as the `sign` job.
      - name: Check the SBOM
        run: |
          jq -e '.bomFormat == "CycloneDX" and .specVersion and .serialNumber' \
            "dist/${TARBALL}.cdx.json" > /dev/null
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign with Sigstore
        run: |
          set -euo pipefail
          for file in "dist/${TARBALL}" "dist/${TARBALL}.cdx.json"; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done
      - name: Verify the signatures
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          for file in "dist/${TARBALL}" "dist/${TARBALL}.cdx.json"; do
            cosign verify-blob --bundle "${file}.sigstore.json" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "$file"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/${{ env.TARBALL }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.TARBALL }}
          sbom-path: dist/${{ env.TARBALL }}.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-client
          path: dist/
          if-no-files-found: error

  # Issue #1989. The build runs third-party `build.rs` code, so this job
  # holds no write token. The smoke test runs the image as a cluster does.
  image:
    name: Build the worker image
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harvest
          POSTGRES_PASSWORD: harvest
          POSTGRES_DB: harvest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harvest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      LOCAL: autumn-harvest:${{ needs.meta.outputs.version }}
      DATABASE_URL: postgres://harvest:harvest@127.0.0.1:5432/harvest?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache, as in `binaries`.
      - name: Build the image
        run: |
          set -euo pipefail
          docker build --pull --no-cache \
            --build-arg "VERSION=${VERSION}" \
            --build-arg "REVISION=${GITHUB_SHA}" \
            --tag "$LOCAL" .
      # The runtime image has no shell. A missing library, a missing file or
      # a root user fails here, not in a cluster.
      - name: Smoke test the binaries
        run: |
          set -euo pipefail
          docker run --rm "$LOCAL" harvest --version
          docker run --rm "$LOCAL" harvest-replay --help > /dev/null
          user="$(docker image inspect --format '{{.Config.User}}' "$LOCAL")"
          if [ "$user" != "65532:65532" ]; then
            echo "::error::the image runs as '${user}', not 65532:65532"
            exit 1
          fi
      # The chart runs these three commands. Migrate, gate, start the runner,
      # wait for readiness, then stop it as the kubelet does.
      - name: Smoke test the worker against Postgres
        run: |
          set -euo pipefail
          dirs=(--include-dir /usr/share/autumn-harvest/migrations/harvest)
          docker run --rm --network host -e "HARVEST_DATABASE_URL=${DATABASE_URL}" \
            "$LOCAL" harvest migrate run "${dirs[@]}"
          docker run --rm --network host -e "HARVEST_DATABASE_URL=${DATABASE_URL}" \
            "$LOCAL" harvest migrate status --check "${dirs[@]}"
          docker run -d --name worker --network host \
            -e "DATABASE_URL=${DATABASE_URL}" -e AUTUMN_PROFILE=prod "$LOCAL"
          ready=""
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8082/api/harvest/health/ready; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            docker logs worker
            echo "::error::the worker did not become ready"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8082/api/harvest/health/live
          docker stop --timeout 60 worker
          code="$(docker inspect --format '{{.State.ExitCode}}' worker)"
          docker logs worker 2>&1 | tail -n 20
          if [ "$code" != 0 ]; then
            echo "::error::the worker exited with ${code} after SIGTERM"
            exit 1
          fi
      - name: Save the image
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save --output dist/worker-image.tar "$LOCAL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-image
          path: dist/worker-image.tar
          if-no-files-found: error
          retention-days: 7

  # Issue #1989. A tag push only. It waits for `validate` and both sign jobs,
  # so the push is the last irreversible step before `release`. It runs no
  # repository code: no checkout, only `docker` and `cosign`. It signs the
  # digest, because a tag can move.
  publish-image:
    name: Publish and sign the worker image
    needs: [meta, validate, image, sign, sign-client]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      LOCAL: autumn-harvest:${{ needs.meta.outputs.version }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-image
          path: dist
      # Install cosign before the registry credential is on disk.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Read the digest back from the registry. It is the digest that a
      # user pulls. The hash of the raw manifest bytes is that digest on
      # every buildx release, so no format template is needed. `cosign` and
      # the attestation read the login.
      - name: Push the image
        id: push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker load --input dist/worker-image.tar
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag "$LOCAL" "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:${VERSION}"
          digest="sha256:$(docker buildx imagetools inspect --raw "${IMAGE}:${VERSION}" \
            | sha256sum | cut -d ' ' -f 1)"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest for ${IMAGE}:${VERSION}: '${digest}'"
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      # Keyless, as in `sign`. The signature goes to the registry and the
      # entry goes to the public Rekor log.
      - name: Sign the image digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the image signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" > /dev/null
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # A storage record needs `artifact-metadata: write`. The registry
          # copy is the one that users verify.
          create-storage-record: false
      # GHCR makes a new package private. The chart default then cannot pull
      # it. ADR 0006 has the one-time fix. The check only warns: each failed
      # request, the token request too, takes the warning path.
      - name: Check that the image is public
        run: |
          set -uo pipefail
          repo="${IMAGE#ghcr.io/}"
          accept="application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json"
          if token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -er .token)" \
            && curl -fsS -o /dev/null -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" \
              "https://ghcr.io/v2/${repo}/manifests/${VERSION}"; then
            echo "${IMAGE}:${VERSION} is public."
          else
            echo "::warning::${IMAGE}:${VERSION} is not public. See docs/adr/0006-worker-container-image.md."
          fi

  # The only job with `contents: write`. It runs no npm and no build, and its
  # checkout keeps no credentials on disk.
  release:
    name: Create GitHub Release
    needs: [meta, validate, sign, client, sign-client, publish-image]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # `validate` has checked CHANGELOG.md already.
      - name: Install git-cliff
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: git-cliff
      # The notes name the image by digest, the form to pin.
      - name: Generate release notes
        id: release-notes
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ needs.publish-image.outputs.digest }}
        run: |
          git-cliff --config cliff.toml --latest --strip header > RELEASE_NOTES.md
          perl -0pi -e 's/\n+\z/\n/' RELEASE_NOTES.md
          printf '\nWorker image: `%s`\n' "$IMAGE_REF" >> RELEASE_NOTES.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: signed-*
          path: dist
          merge-multiple: true
      - name: Write SHA256SUMS
        run: cd dist && sha256sum -- *.tar.gz *.tgz *.cdx.json *.sigstore.json > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/${{ needs.client.outputs.tarball }}
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sigstore.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
