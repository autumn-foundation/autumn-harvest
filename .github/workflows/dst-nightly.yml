# Deterministic simulation, nightly (issue #1830).
#
# - `sweep`: the oracle seed sweep of the `dst` target, in release mode.
#   Four shards run 1000000 seeds each. The owner-lease sweep of issue
#   #2250 then runs on the same seeds.
# - `differential`: replays oracle runs on Postgres. Four shards run 500
#   seeds each.
# - `world`: the world simulation of issue #2002. It runs the real worker
#   loop, the resident path, timers and the scheduler fire claim on
#   Postgres. Four shards run 250 seeds each.
# - `autoresearch`: the seeded simulation sweeps (issue #2033) of the
#   autoresearch example, widened from 64 seeds to 5000 per sweep. It has
#   its own seed space: its base is run_number * 5000, and it ignores the
#   `seeds` input.
# - `stateright`: the Stateright model checks of the DST oracles, at the
#   larger bounds of HARVEST_STATERIGHT_DEEP. A PR checks the smaller
#   bounds in the no-db test job. See docs/testing/stateright.md.
# - `alert`: a failed scheduled run opens an issue, or comments on the open
#   one. GitHub tells only the last editor of a cron about a failure.
#
# A job's seed base is run_number * 4 * 999999999. Each shard has at most
# 999999999 seeds, so two runs never share a seed, whatever their sizes.
#
# Each test step and each image pull has a timeout. The step timeouts of a
# job sum to less than its timeout. A step timeout is a failure, so the
# alert fires. A job timeout is a cancel, and `failure()` does not see it.
#
# A failure prints its seed and a local replay command. See
# docs/testing/simulation.md.
name: DST nightly

on:
  workflow_dispatch:
    inputs:
      seed_base:
        description: >-
          Optional first seed. Leave empty to derive it from the run number.
        required: false
        default: ""
      seeds:
        description: Seeds per sweep shard.
        required: false
        default: "1000000"
  schedule:
    # Nightly at 02:43 UTC, away from the chaos and proptest runs.
    - cron: "43 2 * * *"

concurrency:
  group: dst-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  sweep:
    name: Oracle sweep (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SEEDS: ${{ github.event.inputs.seeds || '1000000' }}
      SEED_BASE: ${{ github.event.inputs.seed_base || '' }}
      SHARD: ${{ matrix.shard }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pick the seeds
        run: |
          for value in "$SEEDS" "$SEED_BASE"; do
            case "$value" in
              *[!0-9]*) echo "not a decimal number: '$value'" >&2; exit 1 ;;
            esac
          done
          # Bash arithmetic is signed 64-bit with no overflow check. These
          # bounds keep every value below i64::MAX.
          if [ "${#SEEDS}" -gt 9 ] || [ "${#SEED_BASE}" -gt 18 ]; then
            echo "seeds must have at most 9 digits, seed_base at most 18" >&2
            exit 1
          fi
          # Force base 10. Bash reads a leading 0 as octal.
          SEEDS=$((10#$SEEDS))
          if [ -n "$SEED_BASE" ]; then SEED_BASE=$((10#$SEED_BASE)); fi
          # A fixed stride per run: 4 shards of the largest allowed size.
          base="${SEED_BASE:-$((RUN_NUMBER * 4 * 999999999))}"
          echo "HARVEST_DST_SEED_BASE=$((base + SHARD * SEEDS))" >> "$GITHUB_ENV"
          echo "HARVEST_DST_SEEDS=$SEEDS" >> "$GITHUB_ENV"
      - name: Run the sweep
        timeout-minutes: 40
        run: cargo test --release -p autumn-harvest --no-default-features --test dst seed_sweep -- --nocapture
      # Issue #2250: the owner-lease simulation runs on the same seeds.
      # 1000000 seeds take about 3 minutes. The two step timeouts sum to
      # less than the job timeout.
      # It runs even when the sweep above fails, so both results show.
      - name: Run the owner-lease sweep
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          HARVEST_DST_OWNER_SEED_BASE: ${{ env.HARVEST_DST_SEED_BASE }}
          HARVEST_DST_OWNER_SEEDS: ${{ env.HARVEST_DST_SEEDS }}
        run: cargo test --release -p autumn-harvest --no-default-features --test dst owner_sweep -- --nocapture

  differential:
    name: Postgres differential (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SEEDS: "500"
      SEED_BASE: ${{ github.event.inputs.seed_base || '' }}
      SHARD: ${{ matrix.shard }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pick the seeds
        run: |
          for value in "$SEEDS" "$SEED_BASE"; do
            case "$value" in
              *[!0-9]*) echo "not a decimal number: '$value'" >&2; exit 1 ;;
            esac
          done
          # Bash arithmetic is signed 64-bit with no overflow check. These
          # bounds keep every value below i64::MAX.
          if [ "${#SEEDS}" -gt 9 ] || [ "${#SEED_BASE}" -gt 18 ]; then
            echo "seeds must have at most 9 digits, seed_base at most 18" >&2
            exit 1
          fi
          # Force base 10. Bash reads a leading 0 as octal.
          SEEDS=$((10#$SEEDS))
          if [ -n "$SEED_BASE" ]; then SEED_BASE=$((10#$SEED_BASE)); fi
          # A fixed stride per run: 4 shards of the largest allowed size.
          base="${SEED_BASE:-$((RUN_NUMBER * 4 * 999999999))}"
          echo "HARVEST_DST_SEED_BASE=$((base + SHARD * SEEDS))" >> "$GITHUB_ENV"
          echo "HARVEST_DST_SEEDS=$SEEDS" >> "$GITHUB_ENV"
      # testcontainers does not retry a pull. An interrupted pull failed
      # the `world` job (issue #2280). This step pulls with retries.
      - name: Pull the Postgres image
        timeout-minutes: 10
        run: bash .github/ci/pull-test-images.sh postgres:16
      - name: Replay oracle runs on Postgres
        # The test owns a Postgres container (testcontainers), so the
        # runner needs only Docker.
        timeout-minutes: 60
        run: 'cargo test -p autumn-harvest --test integration dst_differential_tests:: -- --nocapture --test-threads=1'

  world:
    name: Worker world (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The build (40), the pull (10) and the run (70) leave 10 for setup.
    timeout-minutes: 130
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SEEDS: "250"
      SEED_BASE: ${{ github.event.inputs.seed_base || '' }}
      SHARD: ${{ matrix.shard }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pick the seeds
        run: |
          for value in "$SEEDS" "$SEED_BASE"; do
            case "$value" in
              *[!0-9]*) echo "not a decimal number: '$value'" >&2; exit 1 ;;
            esac
          done
          # Bash arithmetic is signed 64-bit with no overflow check. These
          # bounds keep every value below i64::MAX.
          if [ "${#SEEDS}" -gt 9 ] || [ "${#SEED_BASE}" -gt 18 ]; then
            echo "seeds must have at most 9 digits, seed_base at most 18" >&2
            exit 1
          fi
          # Force base 10. Bash reads a leading 0 as octal.
          SEEDS=$((10#$SEEDS))
          if [ -n "$SEED_BASE" ]; then SEED_BASE=$((10#$SEED_BASE)); fi
          # A fixed stride per run: 4 shards of the largest allowed size.
          base="${SEED_BASE:-$((RUN_NUMBER * 4 * 999999999))}"
          echo "HARVEST_DST_SEED_BASE=$((base + SHARD * SEEDS))" >> "$GITHUB_ENV"
          echo "HARVEST_DST_SEEDS=$SEEDS" >> "$GITHUB_ENV"
      - name: Build the integration tests
        # A separate step, so a slow build does not count against the
        # sweep timeout. Debug mode, as in `differential`: Postgres bounds
        # the run time, and a release build of this target is large.
        timeout-minutes: 40
        run: cargo test -p autumn-harvest --test integration --no-run
      - name: Pull the Postgres image
        timeout-minutes: 10
        run: bash .github/ci/pull-test-images.sh postgres:16
      - name: Run the worker loop under the seeded world
        # The test owns a Postgres container (testcontainers), so the
        # runner needs only Docker. Each run clones a fresh database.
        timeout-minutes: 70
        run: 'cargo test -p autumn-harvest --test integration dst_world_tests::world_seed_sweep -- --nocapture --test-threads=1'

  autoresearch:
    name: autoresearch workflow sweeps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SEED_BASE: ${{ github.event.inputs.seed_base || '' }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Pick the seeds
        run: |
          case "$SEED_BASE" in
            *[!0-9]*) echo "not a decimal number: '$SEED_BASE'" >&2; exit 1 ;;
          esac
          if [ "${#SEED_BASE}" -gt 18 ]; then
            echo "seed_base must have at most 18 digits" >&2
            exit 1
          fi
          if [ -n "$SEED_BASE" ]; then SEED_BASE=$((10#$SEED_BASE)); fi
          # Each run explores 5000 new seeds.
          echo "HARVEST_SIM_SEED_BASE=${SEED_BASE:-$((RUN_NUMBER * 5000))}" >> "$GITHUB_ENV"
          echo "HARVEST_SIM_SEEDS=5000" >> "$GITHUB_ENV"
      - name: Sweep the session and experiment workflows
        timeout-minutes: 40
        run: cargo test --release -p autoresearch --test simulation -- --nocapture

  stateright:
    name: Stateright models (nightly bounds)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The checks take about 1 minute on 4 cores. The build takes longer.
      - name: Check every state within the nightly bounds
        timeout-minutes: 30
        env:
          HARVEST_STATERIGHT_DEEP: "1"
        run: cargo test --release -p autumn-harvest --no-default-features --test stateright -- --nocapture

  alert:
    name: Report a failed nightly
    needs: [sweep, differential, world, autoresearch, stateright]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the alert issue
        run: |
          title="DST nightly: a scheduled run failed"
          body="The deterministic simulation run failed: ${RUN_URL}. The job log prints the seed and a replay command (docs/testing/simulation.md)."
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
