# Nightly fuzzing with a persisted corpus (issue #1835).
#
# Each fuzz target runs in its own job, for 600 seconds by default.
#
# - `corpus`: each run uploads each target's corpus as an artifact, also
#   after a crash. The next run downloads the newest one. The actions cache
#   is not used: the CI build caches fill it, so GitHub evicted a corpus
#   entry within minutes. An artifact stays for its retention period.
#   With no artifact left, the fuzzer starts again from the seeds.
# - `seeds`: `fuzz/seeds/<target>/` is read too. It holds the committed
#   reproducers, such as the #1253 and #1758 envelope look-alikes.
# - `alert`: a failed scheduled run opens an issue, or comments on the open
#   one. The crash input is a run artifact.
# - `pull_request`: a change to the fuzz harness or to the crate source runs
#   each target for 60 seconds. That checks the wiring, the corpus cycle and
#   the replayer before the merge.
#
# `autumn-harvest/tests/integration/fuzz_nightly_wiring.rs` guards this
# file. `docs/testing/property-and-fuzz.md` tells how to reproduce a crash.
name: Fuzz nightly

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Fuzz time per target, in seconds (at most 1800)
        type: number
        default: 600
  schedule:
    # Nightly at 02:47 UTC, away from the proptest and chaos runs.
    - cron: "47 2 * * *"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [trunk, trunk-dev]
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz-nightly.yml"
      # `fuzz_replay` drives the replayer, the payload codecs and stores and
      # the workflow context. So any change to the crate source runs it. The
      # root manifest and lockfile set its dependencies, and the build copies
      # the root lockfile.
      - "Cargo.toml"
      - "Cargo.lock"
      - "autumn-harvest/Cargo.toml"
      - "autumn-harvest/src/**"
      - "autumn-harvest-macros/**"
      - "rust-toolchain.toml"

concurrency:
  group: fuzz-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The 1.100 nightlies that were tested (2026-09-01 and later) fail to build
  # the `db` feature: E0275, a recursion-limit error or an ICE in the diesel
  # transaction futures. Move this pin forward once a newer nightly builds
  # the crate. `fuzz/smoke.sh` has the same default.
  FUZZ_TOOLCHAIN: nightly-2026-08-14

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    # Draft-skip, as in ci.yml. A schedule or a dispatch always runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `actions: read` lists and downloads the corpus artifacts.
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_workflow_event_deser
          - fuzz_det_check_source
          - fuzz_validate_target_url
          - fuzz_failure_signature
          - fuzz_replay
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      # One build cache for all targets. Its key names the nightly, because
      # rust-cache reads the version of the toolchain that rust-toolchain.toml
      # pins. Only the nightly fuzz_replay job saves it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
          shared-key: fuzz-${{ env.FUZZ_TOOLCHAIN }}
          save-if: ${{ github.event_name == 'schedule' && matrix.target == 'fuzz_replay' }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build the target
        id: build
        working-directory: fuzz
        # The fuzz crate has its own workspace and no lockfile in git. Start
        # from the root lockfile, so it builds the versions that CI tests.
        run: |
          cp ../Cargo.lock Cargo.lock
          cargo +"${FUZZ_TOOLCHAIN}" fuzz build "${TARGET}"
      - name: Restore the corpus
        # The newest corpus artifact of this target, from a run of this
        # repository. Runs of a fork are skipped, so a fork cannot seed the
        # nightly. A run prefers its own branch, then the default branch.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_ID: ${{ github.repository_id }}
          OWN_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          dest="fuzz/corpus/${TARGET}"
          mkdir -p "${dest}"
          run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=fuzz-corpus-${TARGET}&per_page=100" --jq '
            [.artifacts[]
             | select(.expired | not)
             | select(.workflow_run.head_repository_id == ($ENV.REPO_ID | tonumber))
             | select(.workflow_run.head_branch == $ENV.OWN_BRANCH
                 or .workflow_run.head_branch == $ENV.DEFAULT_BRANCH)]
            | (map(select(.workflow_run.head_branch == $ENV.OWN_BRANCH)) + .)
            | .[0].workflow_run.id // empty')"
          if [ -z "${run_id}" ]; then
            echo "no corpus artifact; the fuzzer starts from the seeds"
            exit 0
          fi
          gh run download "${run_id}" --repo "${GITHUB_REPOSITORY}" \
            --name "fuzz-corpus-${TARGET}" --dir "${dest}"
          echo "restored the corpus of run ${run_id}"
      - name: Fuzz
        id: fuzz
        working-directory: fuzz
        # New inputs go to the first directory. The seeds are read only.
        run: |
          set -euo pipefail
          mkdir -p "corpus/${TARGET}"
          echo "corpus size before: $(find "corpus/${TARGET}" -type f | wc -l)"
          dirs=("corpus/${TARGET}")
          if [ -d "seeds/${TARGET}" ]; then dirs+=("seeds/${TARGET}"); fi
          # Stay well inside the job timeout, so the corpus save still runs.
          secs=$(( SECONDS_PER_TARGET > 1800 ? 1800 : SECONDS_PER_TARGET ))
          cargo +"${FUZZ_TOOLCHAIN}" fuzz run "${TARGET}" "${dirs[@]}" -- \
            -max_total_time="${secs}" -timeout=30
      - name: Minimize the corpus
        if: always() && steps.build.outcome == 'success'
        # A failed minimization keeps the corpus as it is.
        continue-on-error: true
        working-directory: fuzz
        run: |
          cargo +"${FUZZ_TOOLCHAIN}" fuzz cmin "${TARGET}" "corpus/${TARGET}"
          echo "corpus size after: $(find "corpus/${TARGET}" -type f | wc -l)"
      - name: Save the corpus
        if: always() && hashFiles(format('fuzz/corpus/{0}/**', matrix.target)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}
          # A re-run attempt replaces the corpus of the earlier attempt.
          overwrite: true
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Upload the crash input
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  alert:
    name: Report a failed nightly
    needs: fuzz
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the alert issue
        run: |
          title="Fuzz nightly: a scheduled run failed"
          body="The nightly fuzz run failed: ${RUN_URL}. A build error fails the run too, so read the failed job log first. For a crash, download the fuzz-artifacts-<target> artifact and reproduce with \`cargo +${FUZZ_TOOLCHAIN} fuzz run <target> <input>\` (docs/testing/property-and-fuzz.md). Add the input to fuzz/seeds/<target>/ with the fix."
          issue="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
