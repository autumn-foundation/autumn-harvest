# Dependabot version updates (issue #1826).
#
# Every pull request targets trunk-dev. trunk is the release branch.
#
# github-actions: each `uses:` is pinned to a commit SHA with a `# <tag>`
# comment. Dependabot updates the SHA and the comment together.
# docs/audits/action-sha-pin.py rejects a pin with no SHA.
#
# cargo: `/` is the workspace. `/fuzz` is its own workspace, outside the root
# one. The CI `msrv` job catches an update that needs a newer rustc.
#
# Security updates are a repository setting, not part of this file.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/fuzz"
    target-branch: trunk-dev
    schedule:
      interval: weekly
      day: monday
      time: "06:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      # One pull request for the compatible updates. A major update gets its
      # own pull request, because it can break the build.
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: trunk-dev
    schedule:
      interval: weekly
      day: monday
      time: "06:23"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
