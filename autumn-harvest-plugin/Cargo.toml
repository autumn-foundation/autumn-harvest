[package]
name = "autumn-harvest-plugin"
description = "Autumn plugin for autumn-harvest durable workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/autumn-foundation/autumn-harvest"
readme = "../README.md"
keywords = ["workflow", "durable", "postgres", "orchestration", "autumn"]
categories = ["asynchronous", "database"]

[features]
unified-dag-execution = ["autumn-harvest/unified-dag-execution"]
webhooks = ["autumn-harvest/db"]
# MCP tool exposure for #[workflow(mcp)] workflows (issue #597). Enables
# autumn-web's MCP layer so HarvestPlugin::mcp_tools() can project workflows
# as start/status/signal/update/watch tools via AppBuilder::mount_mcp.
mcp = ["autumn-web/mcp"]
# Built-in Prometheus scrape endpoint (issue #355). Registers Harvest's nine
# ADR-0001 catalogue metrics as an autumn-web MetricsSource feeding the
# app's shared /actuator/prometheus endpoint. No new dependency: rendering
# is done entirely through autumn-web's existing MetricsSource contract.
metrics = []
# Broker event-source connectors for workflow triggers (issue #944).
#
# `connectors` alone brings only the broker-AGNOSTIC layer (bindings,
# idempotency, ack ordering, poison isolation, backpressure, MockSource) with
# no broker client at all — enough to unit-test a mapping function and the
# whole dispatch path with no Docker. `kafka` / `sqs` add the respective
# client. The core `autumn-harvest` crate gains zero broker dependencies under
# every combination; `tests/connector_dependency_graph.rs` enforces it.
connectors = ["dep:async-trait", "dep:sha2"]
kafka = ["connectors", "dep:rdkafka"]
sqs = ["connectors", "dep:aws-config", "dep:aws-sdk-sqs"]
# Zero-setup local dev runtime (issue #525) — the `harvest-dev` binary.
#
# Off by default and never in a release build. It provisions an **ephemeral**
# Postgres cluster, applies the ordinary embedded migration sets, runs a worker
# and serves the management API + Vantage UI, then reclaims every byte of that
# state on exit. Development and evaluation only; it refuses to point at
# anything that looks like a real database.
#
# This tier drives a Postgres install that is already on the machine
# (Homebrew, apt, Postgres.app, the EnterpriseDB installer). It adds one small
# pure-Rust dependency (`url`, already in the lockfile via `autumn-harvest`).
dev-runtime = ["dep:tokio-postgres"]
# `dev-runtime` plus automatic acquisition of a platform-matched PostgreSQL
# build when the machine has none — the tier that makes "a clean machine with
# only the Rust toolchain" literally true. `postgresql_archive` only downloads
# and extracts the archive; the cluster is still driven by our own lifecycle
# code, so ephemerality and teardown stay under this crate's control.
#
# `postgresql_archive` 0.19 (not 0.21) deliberately: it is what `autumn-web`'s
# own `managed-pg` feature resolves to, its rustls feature unifies on the
# reqwest already in the graph rather than pulling a second copy, and its MSRV
# (1.87) is below this workspace's 1.88 — so unlike `wasm-activities` this
# feature raises no effective MSRV at all.
dev-runtime-managed = ["dev-runtime", "dep:postgresql_archive"]


[dependencies]
autumn-harvest = { version = "0.6.0", path = "../autumn-harvest", features = ["db", "testing"] }
autumn-web = "0.7"
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
tracing = { workspace = true }
diesel = { workspace = true }
diesel-async = { workspace = true }
diesel_migrations = { workspace = true }
deadpool = { workspace = true }
futures = { workspace = true }
tower = "0.5"
# Radix-tree route matcher (same crate axum 0.8 uses internally) — the read-only
# operator role (issue #776) matches a request's nest-stripped path against
# CLASSIFIED_ROUTES to recover its RouteClass, with correct static-beats-param
# precedence. MatchedPath is unusable in a nested-router layer (axum #1441).
matchit = "0.8"
# Strict (non-lossy) percent-decoding for `GET /admin/queue-coverage`'s raw
# query string (issue #774 review): axum's built-in `Query` extractor is
# backed by `serde_urlencoded`/`form_urlencoded`, which always succeeds by
# silently substituting U+FFFD for a malformed percent-encoded byte
# sequence -- so a caller CI/CD deploy-gate request with corrupted
# encoding would otherwise silently query a different (nonexistent) queue
# and report a false-clean `uncovered: false` instead of a `400`. Already a
# transitive dependency (via `url`/`serde_urlencoded`); pinned directly so
# `queue_coverage.rs` can call it without pulling in the rest of `url`.
percent-encoding = "2.3"
maud = { version = "0.27", features = ["axum"] }
# The dev runtime's production-database refusal gate parses candidate DSNs with
# the SAME parser the connection will use (issue #525). This is the whole point:
# a second, hand-rolled parser is a second opinion about what the client will
# dial, and every disagreement between the two is a bypass — `hostaddr` vs
# `host`, a `host=` query parameter that appends rather than replaces, and the
# first-vs-last `@` split of userinfo were all real ones. Already in the
# lockfile at this version (`autumn-harvest` depends on it under `db`, and
# `diesel-async` connects through it), so this unifies rather than widening the
# graph.
tokio-postgres = { version = "0.7.18", optional = true }
# Downloads and extracts a platform-matched PostgreSQL build for the
# `dev-runtime-managed` tier (issue #525). Deliberately `postgresql_archive`
# and NOT `postgresql_embedded`: we need archive acquisition only, and the
# server-orchestration half of `postgresql_embedded` would pull `sqlx` into the
# graph for a cluster we already drive ourselves. `default-features = false`
# drops its native-tls default in favour of rustls, matching the rest of the
# crate's pure-Rust TLS story (no OpenSSL on Windows).
postgresql_archive = { version = "0.19", default-features = false, features = ["theseus", "rustls"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
thiserror = { workspace = true }

# ── Broker connectors (issue #944) — all optional, all off by default ──
# Object-safe async traits for the EventSource / DeadLetterSink seams
# (same version autumn-harvest-redis already uses).
async-trait = { version = "0.1", optional = true }
# Collision-resistant digest for the bounded idempotency-key encoding, so a
# pathological topic/key component can never blow the 512-byte start-key cap
# (the issue #699 `bound_key_component` precedent).
sha2 = { version = "0.10", optional = true }
# Kafka client. `cmake-build` builds librdkafka from the vendored source, so
# the adapter needs no system librdkafka. NOTE: librdkafka's build requires
# libcurl headers (`libcurl4-openssl-dev` on Debian/Ubuntu) even with
# `WITH_CURL=0` — see the CI step added alongside this feature.
rdkafka = { version = "0.38", default-features = false, features = ["cmake-build", "libz", "tokio"], optional = true }
# SQS client.
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"], optional = true }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rt-tokio", "rustls"], optional = true }

[[bin]]
# Zero-setup local dev runtime (issue #525). `cargo dev` is the workspace alias
# for running this with the managed tier enabled.
name = "harvest-dev"
path = "src/bin/harvest_dev.rs"
required-features = ["dev-runtime"]

[dev-dependencies]
autumn-web = { version = "0.7", features = ["test-support", "mcp"] }
# The dev-runtime lifecycle test drives the running dev runtime over real HTTP
# (start a workflow, poll its status, fetch the Vantage page). The crate already
# depends on reqwest for the callback deliverer; the test needs `json` on top.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
autumn-harvest = { version = "0.6.0", path = "../autumn-harvest", features = ["db", "testing"] }
tower = "0.5"
# `test-util` for `#[tokio::test(start_paused = true)]`: the shutdown-drain
# deadline is a 30s wall-clock wait that must be asserted, not slept through.
tokio = { workspace = true, features = ["test-util"] }
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
tracing-subscriber = "0.3"
# Issue #798: the export -> bundle -> drift-gate end-to-end test writes a real
# bundle directory and feeds it to `WorkflowReplayer::replay_bundle`.
tempfile = "3"

# Deterministic (non-criterion) instruction/allocation-count profiling
# harness for `dag_graph::build_run_graph` -- the pure projection behind
# `GET /dag-run-graph` (issue #690) that reconstructs a unified DAG run's
# node topology from the registered DagDefinition and recorded event
# history. No feature requirement: `dag_graph`/`dag_retry` are unconditional
# modules. See `benches/dag_graph_profile.rs` and
# `docs/performance-dag-graph.md`.
[[bench]]
name = "dag_graph_profile"
harness = false

# End-to-end wall-clock latency of `GET /workflows/{id}/diagnose` against a
# real Postgres (issue #1194, following up on issue #809's unverified
# `p95 < 500 ms` claim). `harness = false` + its own `main()`, matching
# `claim_bench`/`e2e_bench`/`retention_reclaim_bench` in the `autumn-harvest`
# crate: the report format (p50/p99/max tables pasted into
# `docs/performance.md`) is the house convention those establish, even though
# `/diagnose` is read-only and criterion would be numerically valid here (see
# the bench's own module doc comment). Drives the real `harvest_api_router`
# handler over `tower::ServiceExt::oneshot`, not a reimplementation of its
# query shapes -- the diagnose internals are private to this crate, so a
# bench in `autumn-harvest/benches/` could only ever measure a proxy. No
# `required-features`: this crate's `autumn-harvest` dependency already
# unconditionally enables `db`/`testing` (see `[dependencies]` above).
[[bench]]
name = "diagnose_bench"
harness = false

[lints]
workspace = true

[[example]]
name = "mcp_tools_quickstart"
required-features = ["mcp"]

[[example]]
name = "webhook_receiver_quickstart"
required-features = ["webhooks"]

[[example]]
name = "metrics_scrape_quickstart"
required-features = ["metrics"]

[[example]]
name = "kafka_connector_quickstart"
required-features = ["kafka"]

[[example]]
name = "sqs_connector_quickstart"
required-features = ["sqs"]
