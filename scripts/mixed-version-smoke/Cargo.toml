# Mixed-version smoke worker (issue #1828).
#
# `scripts/run-mixed-version-smoke.sh` copies this crate into the `target/`
# directory of each tree and builds it there. The path dependencies then
# resolve to the current tree or to the previous release. The script also
# copies the Cargo.lock of that tree, so each build uses the versions that
# its release shipped with.
#
# The empty `[workspace]` table keeps this crate out of the root workspace.
[package]
name = "mixed-version-smoke"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "mixed-version-smoke"
path = "src/main.rs"

[features]
# Adapters for the API of an older release. The script selects one by tag.
v0_6 = []

[dependencies]
autumn-harvest = { path = "../../autumn-harvest" }
autumn-harvest-plugin = { path = "../../autumn-harvest-plugin" }
base64 = "0.22"
diesel = { version = "2.3", features = ["postgres_backend"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace]
