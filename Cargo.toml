[workspace]
members = [
    "autumn-harvest",
    "autumn-harvest-plugin",
    "autumn-harvest-macros",
    "autumn-harvest-cli",
    "autumn-harvest-redis",
    "examples/billing-autumn-web",
    "examples/quickstart",
    "examples/saga-choreography",
    "examples/standalone-runner",
]
# The cargo-fuzz harness is nightly + libFuzzer-only and must never be built by
# the root workspace resolver. It also declares its own `[workspace]` root.
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88.0"
version = "0.4.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/madmax983/autumn-harvest"

[workspace.dependencies]
# Core
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
futures = "0.3"
rand = "0.8"

# Database
diesel = { version = "2.3", features = ["postgres_backend", "uuid", "chrono", "serde_json", "64-column-tables"] }
diesel-async = { version = "0.8", features = ["deadpool", "postgres"] }
diesel_migrations = "2"
deadpool = "0.13"

# Proc macro
syn = { version = "2", features = ["full", "visit"] }
quote = "1"
proc-macro2 = "1"

# Redis
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "streams", "script"] }

# Dev / test
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres", "redis"] }
proptest = "1.11.0"

[workspace.lints.rust]
# `loom` is a custom cfg set only by `RUSTFLAGS="--cfg loom"` for the loom
# model-checking target (autumn-harvest/tests/loom_models.rs). Registering it
# here stops `unexpected_cfgs` from firing on the `#[cfg(loom)]` shim in
# `autumn-harvest/src/loom_sync.rs` under normal (`-D warnings`) builds.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.dev.package.bollard-stubs]
opt-level = 0
debug = false

[profile.dev.package.bollard]
opt-level = 0
debug = false



