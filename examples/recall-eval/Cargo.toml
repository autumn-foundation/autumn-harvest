[package]
name = "recall-eval"
description = "The long-horizon recall eval of a durable agent, run by hand (issue #2455)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "recall-eval"
path = "src/main.rs"

[dependencies]
autumn-harvest-sqlite = { version = "0.10.0", path = "../../autumn-harvest-sqlite" }
# `anthropic` is the shared Claude model.
autumn-harvest-agent = { version = "0.10.0", path = "../../autumn-harvest-agent", features = ["sqlite", "anthropic"] }
chrono = { workspace = true }
clap = { version = "4.6", features = ["derive", "env"] }
tempfile = "3"
tokio = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
