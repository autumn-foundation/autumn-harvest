services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: runner
      POSTGRES_PASSWORD: runner
      POSTGRES_DB: runner
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runner"]
      interval: 5s
      timeout: 5s
      retries: 10
