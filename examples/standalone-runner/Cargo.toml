[package]
name = "standalone-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
autumn-harvest = { version = "0.6.0", path = "../../autumn-harvest", features = ["db", "testing"] }
autumn-harvest-plugin = { version = "0.6.0", path = "../../autumn-harvest-plugin", features = ["metrics", "webhooks"] }
# Issue #1615: no `autumn-web` entry. A unit test in `src/tests.rs` fails if one returns.
axum = "0.8"
deadpool = { workspace = true, features = ["rt_tokio_1"] }
diesel = { workspace = true }
diesel-async = { workspace = true }
futures = { workspace = true }
# TLS for `sslmode=require` and `verify-*` (see `src/db.rs`). All are in the
# lockfile already, through the CLI and the core `tls` feature.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.13"
tracing = { workspace = true }
tracing-subscriber = "0.3"

[dev-dependencies]
autumn-harvest-cli = { version = "0.6.0", path = "../../autumn-harvest-cli" }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
sha2 = "0.10"
testcontainers = { workspace = true }
testcontainers-modules = { workspace = true }
toml = { workspace = true }
tower = "0.5"

[lints]
workspace = true
