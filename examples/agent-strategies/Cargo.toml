[package]
name = "agent-strategies"
description = "One task under four inference strategies, on SQLite with a scripted model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "agent-strategies"
path = "src/main.rs"

[dependencies]
# The embedded SQLite backend, so the example needs no service. The agent
# features match the agent-mesh example, so CI builds them once.
autumn-harvest-sqlite = { version = "0.10.0", path = "../../autumn-harvest-sqlite" }
autumn-harvest-agent = { version = "0.10.0", path = "../../autumn-harvest-agent", features = ["sqlite"] }
serde_json = { workspace = true }
tempfile = "3"
tokio = { workspace = true }

[lints]
workspace = true
