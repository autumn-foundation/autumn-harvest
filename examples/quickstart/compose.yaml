services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: quickstart
      POSTGRES_PASSWORD: quickstart
      POSTGRES_DB: quickstart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickstart"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
