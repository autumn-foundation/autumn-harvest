[package]
name = "agent-loop-hit-rate"
description = "Measures the resident-state hit rate of the agent loop on a Postgres worker (issue #2007)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
autumn-harvest = { version = "0.7.0", path = "../../autumn-harvest", features = ["db", "testing"] }
autumn-harvest-agent = { version = "0.7.0", path = "../../autumn-harvest-agent" }
deadpool = { workspace = true, features = ["rt_tokio_1"] }
diesel-async = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
